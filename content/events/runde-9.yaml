  date: "439-10-19"
  weight: 3
  kind: krieg
  summary: Der Verlust der reichsten Provinzen Nordafrikas beraubt das Westreich seiner wichtigsten Steuer- und Getreidequellen.
  regions: [nordafrika]
  themes: [krieg-militaer, wirtschaft-handel]
  places: [karthago]
  persons: [geiserich]
  polities: [vandalenreich, westroemisches-reich]
- id: schlacht-katalaunische-felder
  title: Schlacht auf den Katalaunischen Feldern
  date: "451"
  weight: 2
  kind: schlacht
  summary: Ein Heer aus Römern, Westgoten und anderen Verbündeten unter Aetius hält den Vormarsch der Hunnen in Gallien auf.
  regions: [frankreich]
  themes: [krieg-militaer]
  places: [katalaunische-felder]
  persons: [aetius, attila]
  polities: [westroemisches-reich, hunnenreich, westgotenreich]
- id: pluenderung-roms-455
  title: Plünderung Roms durch die Vandalen
  date: "455-06"
  weight: 3
  kind: ereignis
  summary: Geiserich landet mit seiner Flotte und lässt Rom zwei Wochen lang plündern; der neuzeitliche Begriff „Vandalismus“ spielt darauf an.
  regions: [italien]
  themes: [krieg-militaer]
  places: [rom]
  persons: [geiserich]
  polities: [vandalenreich, westroemisches-reich]
- id: absetzung-romulus-augustulus
  title: Absetzung des Romulus Augustulus
  date: "476-09-04"
  weight: 1
  kind: herrschaft
  summary: Der Heerführer Odoaker setzt den jungen Kaiser in Ravenna ab und schickt die Herrschaftszeichen nach Konstantinopel; einen weströmischen Kaiser gibt es danach nicht mehr. Das Datum gilt traditionell als Ende des Weströmischen Reichs.
  regions: [italien]
  themes: [politik]
  places: [ravenna]
  persons: [odoaker, romulus-augustulus]
  polities: [westroemisches-reich]
- id: theoderich-erobert-italien
