  title: Tötung der verbliebenen Franzosen
  start: "1804-02"
  end: "1804-04"
  weight: 3
  kind: ereignis
  summary: Auf Befehl Dessalines’ werden mehrere Tausend in Haiti verbliebene Weiße getötet; einige Gruppen wie polnische Soldaten und Ärzte werden verschont. Die Morde prägen das Bild Haitis im Ausland für lange Zeit.
  regions: [karibik]
  themes: [gewalt-genozid]
  persons: [jean-jacques-dessalines]
  polities: [haiti]
- id: entschaedigung-1825
  title: Französische „Entschädigungsforderung“
  date: "1825-04-17"
  weight: 3
  kind: vertrag
  summary: Unter Androhung militärischer Gewalt erkennt Frankreich die Unabhängigkeit Haitis nur gegen eine Zahlung von 150 Millionen Franc an die früheren Pflanzer an; die Schuld und die zu ihrer Bezahlung aufgenommenen Kredite belasten Haiti über Jahrzehnte.
  regions: [karibik, frankreich]
  themes: [wirtschaft-handel, politik]
  polities: [haiti]
