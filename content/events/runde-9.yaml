  start: "489"
  end: "493"
  weight: 3
  kind: krieg
  summary: Im Auftrag des oströmischen Kaisers zieht der Ostgotenkönig Theoderich nach Italien, belagert Odoaker in Ravenna und tötet ihn nach der Übergabe eigenhändig.
