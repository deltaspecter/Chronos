  themes: [krieg-militaer]
  places: [ravenna]
  persons: [theoderich-der-grosse, odoaker]
  polities: [ostgotenreich]
- id: taufe-chlodwigs
  title: Taufe Chlodwigs
  date: "~498"
  certainty: umstritten
  dateNote: Das Jahr ist umstritten; vorgeschlagen werden Daten zwischen 496 und 508.
  weight: 3
  kind: ereignis
  summary: Der Frankenkönig lässt sich in Reims katholisch taufen und gewinnt damit die Unterstützung der gallorömischen Bischöfe.
  regions: [frankreich]
  themes: [religion, politik]
  persons: [chlodwig-i]
  polities: [frankenreich]
# --- Haitianische Revolution ---
