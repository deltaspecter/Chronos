  date: "1801-07-08"
  weight: 3
  kind: gesetz
  summary: Toussaint Louverture lässt eine Verfassung verkünden, die die Sklaverei für immer verbietet und ihn zum Gouverneur auf Lebenszeit macht – formell innerhalb des französischen Reiches.
  regions: [karibik]
  themes: [verfassung-recht, revolutionen]
  persons: [toussaint-louverture]
  polities: [saint-domingue]
