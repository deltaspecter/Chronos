  title: Napoleon führt die Sklaverei wieder ein
  date: "1802-05-20"
  weight: 3
  kind: gesetz
  summary: Ein Gesetz bestätigt die Sklaverei in den Kolonien, die Frankreich von Großbritannien zurückerhalten hat; in Guadeloupe wird sie mit Gewalt wiederhergestellt. Die Nachricht treibt den Widerstand in Saint-Domingue an.
  regions: [karibik, frankreich]
  themes: [sklaverei-unfreiheit]
  persons: [napoleon-bonaparte]
  polities: [erste-franzoesische-republik]
- id: schlacht-von-vertieres
  title: Schlacht von Vertières
  date: "1803-11-18"
  weight: 3
  kind: schlacht
  summary: Die Armee Dessalines’ schlägt die letzten französischen Truppen vor Cap-Français; wenige Tage später räumen die Franzosen die Kolonie.
  regions: [karibik]
  themes: [krieg-militaer]
  places: [vertieres, cap-francais]
  persons: [jean-jacques-dessalines]
  polities: [saint-domingue]
- id: unabhaengigkeit-haitis
  title: Unabhängigkeit Haitis
  date: "1804-01-01"
  weight: 1
  kind: gruendung
  summary: In Gonaïves verkündet Dessalines die Unabhängigkeit und gibt dem Land den indigenen Namen Haiti – der erste Staat, der aus einer erfolgreichen Erhebung Versklavter hervorging.
  regions: [karibik]
  themes: [revolutionen, sklaverei-unfreiheit]
  places: [gonaives]
  persons: [jean-jacques-dessalines]
  polities: [haiti]
