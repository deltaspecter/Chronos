# --- Muhammad und die Entstehung des Islam ---
- id: erste-offenbarung
  title: Erste Offenbarung an Muhammad
  date: "~610"
  certainty: wahrscheinlich
  dateNote: Datierung nach der islamischen Überlieferung.
  weight: 3
  kind: ereignis
  summary: Nach der islamischen Überlieferung empfängt Muhammad in einer Höhle am Berg Hira bei Mekka die ersten Offenbarungen; einige Jahre später beginnt er öffentlich zu predigen.
  regions: [arabische-halbinsel]
  themes: [religion]
  places: [mekka]
  persons: [muhammad, chadidscha]
- id: hidschra
  title: Hidschra – Auswanderung nach Medina
  date: "622"
  weight: 1
  kind: ereignis
  summary: Nach Jahren der Anfeindung in Mekka wandern Muhammad und seine Anhänger nach Yathrib (Medina) aus, wo er zum Schlichter und Anführer der Gemeinde wird; das Jahr wird später zum Beginn der islamischen Zeitrechnung.
  regions: [arabische-halbinsel]
  themes: [religion, politik]
  places: [mekka, medina]
  persons: [muhammad, abu-bakr]
- id: schlacht-von-badr
  title: Schlacht von Badr
  date: "624-03"
  weight: 3
  kind: schlacht
  summary: Die Muslime aus Medina überfallen eine mekkanische Karawane und besiegen ein überlegenes Aufgebot der Mekkaner; der Sieg gilt in der Überlieferung als Zeichen göttlicher Hilfe.
  regions: [arabische-halbinsel]
  themes: [krieg-militaer, religion]
  places: [badr]
  persons: [muhammad]
- id: einnahme-mekkas
  title: Einnahme Mekkas
  date: "630-01"
  weight: 2
  kind: ereignis
  summary: Muhammad zieht nahezu kampflos in Mekka ein; die Götterbilder in der Kaaba werden entfernt, die meisten Mekkaner nehmen den Islam an.
  regions: [arabische-halbinsel]
  themes: [religion, politik]
  places: [mekka]
  persons: [muhammad]
- id: tod-muhammads
  title: Tod Muhammads
  date: "632-06-08"
  weight: 2
  kind: ereignis
  summary: Muhammad stirbt in Medina, ohne eine Nachfolgeregelung zu hinterlassen; die Gemeinde wählt Abu Bakr zu seinem Nachfolger (Kalif).
  regions: [arabische-halbinsel]
  themes: [religion, politik]
  places: [medina]
  persons: [muhammad, abu-bakr, ali-ibn-abi-talib]
  polities: [kalifat-der-rechtgeleiteten]
- id: schlacht-am-jarmuk
  title: Schlacht am Jarmuk
  date: "636-08"
  weight: 3
  kind: schlacht
  summary: Arabische Truppen schlagen ein großes oströmisches Heer; Syrien und Palästina gehen für Byzanz verloren.
  regions: [levante]
  themes: [krieg-militaer]
  places: [jarmuk]
  persons: [herakleios]
  polities: [kalifat-der-rechtgeleiteten, byzantinisches-reich]
- id: arabische-eroberungen
  title: Arabisch-islamische Eroberungen
  start: "634"
  end: "~750"
  weight: 1
  kind: krieg
  summary: In wenigen Jahrzehnten erobern arabische Heere das Sasanidenreich und die oströmischen Provinzen im Süden und Osten; unter den Umayyaden reicht das Kalifat von der Iberischen Halbinsel bis an den Indus.
  regions: [levante, mesopotamien, iran, aegypten, nordafrika, iberische-halbinsel, zentralasien]
  themes: [imperien, krieg-militaer, religion]
  places: [jarmuk, ktesiphon, jerusalem, alexandria, damaskus]
  persons: [umar-ibn-al-chattab, herakleios]
  polities: [kalifat-der-rechtgeleiteten, umayyaden-kalifat, byzantinisches-reich, sasanidenreich, westgotenreich]
- id: fall-von-ktesiphon
  title: Fall von Ktesiphon
  date: "637"
  weight: 3
  kind: schlacht
  summary: Nach dem Sieg bei al-Qadisiyya nehmen arabische Truppen die sasanidische Hauptstadt ein; der letzte Großkönig flieht nach Osten und wird 651 getötet.
  regions: [mesopotamien, iran]
  themes: [krieg-militaer, imperien]
  places: [ktesiphon]
  polities: [kalifat-der-rechtgeleiteten, sasanidenreich]
- id: koran-redaktion
  title: Kodifizierung des Korans
  date: "~650"
  certainty: wahrscheinlich
  dateNote: Nach islamischer Überlieferung unter dem Kalifen Uthman (644–656); frühe Handschriften bestätigen eine Fixierung des Textes im 7. Jahrhundert.
  weight: 3
  kind: entwicklung
  summary: Nach der Überlieferung lässt Kalif Uthman eine verbindliche schriftliche Fassung des Korans erstellen und abweichende Abschriften vernichten.
  regions: [arabische-halbinsel]
  themes: [religion, schrift-medien]
  places: [medina]
  persons: [uthman-ibn-affan]
- id: erster-buergerkrieg-fitna
  title: Erster Bürgerkrieg der Muslime
  start: "656"
  end: "661"
  weight: 2
  kind: krieg
  summary: Nach der Ermordung Uthmans kämpfen Ali, Aischa und Muawiya um die Führung; in der „Kamelschlacht“ und bei Siffin stehen sich Muslime gegenüber. Der Konflikt legt den Grund für die Spaltung in Sunniten und Schiiten.
  regions: [mesopotamien, levante, arabische-halbinsel]
  themes: [religion, krieg-militaer]
  places: [basra, kufa, damaskus]
  persons: [ali-ibn-abi-talib, aischa, muawiya-i, uthman-ibn-affan]
  polities: [kalifat-der-rechtgeleiteten, umayyaden-kalifat]
- id: schlacht-von-kerbela
  title: Kerbela
  date: "680-10-10"
  weight: 2
  kind: schlacht
  summary: Husain, der Enkel Muhammads, wird mit einer kleinen Schar von Truppen des Umayyadenkalifen Yazid getötet; das Gedenken an seinen Tod (Aschura) prägt die schiitische Frömmigkeit.
  regions: [mesopotamien]
  themes: [religion, gewalt-genozid]
  places: [karbala]
  persons: [husain-ibn-ali]
  polities: [umayyaden-kalifat]
- id: bau-felsendom
  title: Bau des Felsendoms
  date: "691"
  dateNote: Die Bauinschrift nennt das Jahr 72 der Hidschra (691/92).
  weight: 3
  kind: gruendung
  summary: Kalif Abd al-Malik lässt auf dem Tempelberg in Jerusalem einen prächtigen Kuppelbau errichten, dessen Inschriften zu den ältesten datierten Koranzitaten gehören.
  regions: [levante]
  themes: [religion, kultur-kunst]
  places: [felsendom, jerusalem]
  polities: [umayyaden-kalifat]
# --- Ende des Weströmischen Reiches ---
- id: edikt-von-thessalonike
  title: Edikt von Thessalonike
  date: "380-02-28"
  weight: 3
  kind: gesetz
  summary: Kaiser Theodosius I. erklärt den nicänischen Glauben für alle Untertanen verbindlich; in den folgenden Jahren werden heidnische Opfer verboten.
  regions: [suedosteuropa, italien]
  themes: [religion]
  persons: [theodosius-i]
  polities: [roemisches-kaiserreich]
- id: goten-ueberqueren-donau
  title: Goten überqueren die Donau
  date: "376"
  weight: 3
  kind: ereignis
  summary: Vor den Hunnen fliehende Goten bitten um Aufnahme ins Reich; Kaiser Valens lässt sie über die Donau, doch Versorgungsnot und Übergriffe römischer Beamter führen zum Aufstand.
  regions: [suedosteuropa]
  themes: [migration, politik]
  persons: [valens]
  polities: [roemisches-kaiserreich, hunnenreich]
- id: schlacht-von-adrianopel
  title: Schlacht von Adrianopel
  date: "378-08-09"
  weight: 2
  kind: schlacht
  summary: Die Goten vernichten das oströmische Heer; Kaiser Valens fällt. Sein Nachfolger Theodosius siedelt sie 382 als Verbündete mit eigenen Anführern im Reich an.
  regions: [suedosteuropa]
  themes: [krieg-militaer]
  places: [edirne]
  persons: [valens, theodosius-i]
  polities: [roemisches-kaiserreich]
- id: reichsteilung-395
  title: Reichsteilung von 395
  date: "395-01-17"
  weight: 2
  kind: ereignis
  summary: Nach dem Tod des Theodosius regieren seine Söhne Arcadius im Osten und Honorius im Westen; aus der Verwaltungsteilung wird eine dauerhafte Trennung.
  regions: [italien, suedosteuropa]
  themes: [politik, imperien]
  persons: [theodosius-i, honorius]
  polities: [roemisches-kaiserreich, westroemisches-reich, byzantinisches-reich]
- id: rheinuebergang-406
  title: Rheinübergang von 406
  date: "406-12-31"
  certainty: wahrscheinlich
  dateNote: Das traditionelle Datum beruht auf einer einzigen Chronik; manche Forschende datieren den Übergang auf 405.
  weight: 3
  kind: ereignis
  summary: Vandalen, Alanen und Sueben überschreiten den Rhein und ziehen plündernd durch Gallien bis nach Spanien.
  regions: [deutschland, frankreich]
  themes: [migration, krieg-militaer]
  polities: [westroemisches-reich]
- id: pluenderung-roms-410
  title: Plünderung Roms durch die Goten
  date: "410-08-24"
  weight: 2
  kind: ereignis
  summary: Gotische Truppen unter Alarich plündern drei Tage lang die Stadt Rom – zum ersten Mal seit acht Jahrhunderten fällt sie einem fremden Heer in die Hände. Das Ereignis erschüttert die römische Welt.
  regions: [italien]
  themes: [krieg-militaer]
  places: [rom]
  persons: [alarich-i, honorius]
  polities: [westroemisches-reich]
- id: vandalen-erobern-karthago
