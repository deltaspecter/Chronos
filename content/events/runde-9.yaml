  date: "1793-08-29"
  weight: 3
  kind: gesetz
  summary: Um die Kolonie gegen Spanier und Briten zu halten, erklärt der republikanische Kommissar Sonthonax alle Versklavten der Nordprovinz für frei.
  regions: [karibik]
  themes: [sklaverei-unfreiheit, revolutionen]
  places: [cap-francais]
  persons: [leger-felicite-sonthonax]
  polities: [saint-domingue, erste-franzoesische-republik]
