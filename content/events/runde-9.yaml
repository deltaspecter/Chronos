  end: "1803-11"
  weight: 2
  kind: krieg
  summary: Napoleon schickt über 20.000 Soldaten, um die französische Herrschaft wiederherzustellen; Toussaint wird im Juni 1802 durch eine List gefangen genommen und nach Frankreich gebracht.
  regions: [karibik]
  themes: [krieg-militaer, sklaverei-unfreiheit]
