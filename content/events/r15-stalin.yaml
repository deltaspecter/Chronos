- id: tod-stalins
  title: Tod Stalins
  date: "1953-03-05"
  weight: 2
  kind: ereignis
  summary: Stalin stirbt nach einem Schlaganfall auf seiner Datscha in Kunzewo bei Moskau; bei der Aufbahrung kommen im Gedränge zahlreiche Menschen ums Leben. Eine Amnestie entlässt kurz darauf rund 1,2 Millionen Häftlinge, vor allem nicht politische.
  regions: [russland]
  themes: [politik]
  places: [moskau]
  persons: [josef-stalin, lawrenti-berija, nikita-chruschtschow, wjatscheslaw-molotow]
  polities: [sowjetunion]
- id: geheimrede-1956
  title: Chruschtschows Geheimrede
  date: "1956-02-25"
  weight: 2
  kind: ereignis
  summary: Auf einer geschlossenen Sitzung des XX. Parteitags der KPdSU prangert Nikita Chruschtschow den Personenkult um Stalin und die Verfolgung von Parteimitgliedern an; die Rede leitet die Entstalinisierung ein und erschüttert die kommunistische Weltbewegung.
  regions: [russland]
  themes: [politik]
  places: [moskau]
  persons: [nikita-chruschtschow, josef-stalin]
  polities: [sowjetunion]
- id: gruendung-memorial
  title: Gründung von Memorial
  date: "1989-01-28"
  weight: 3
  kind: gruendung
  summary: Auf einer Gründungskonferenz in Moskau konstituiert sich die aus einer Unterschriftenkampagne von 1987/88 hervorgegangene Gesellschaft Memorial, Ehrenvorsitzender ist Andrei Sacharow; sie dokumentiert die Opfer politischer Verfolgung, wird Ende 2021 von russischen Gerichten aufgelöst und erhält 2022 den Friedensnobelpreis.
  regions: [russland]
  themes: [geschichtsschreibung, politik]
  places: [moskau]
  persons: [andrei-sacharow]
  polities: [sowjetunion]
