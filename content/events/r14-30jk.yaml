  date: "1620-11-08"
  weight: 2
  kind: schlacht
  summary: Kaiserliche und ligistische Truppen unter Bucquoy und Tilly schlagen das Heer der böhmischen Stände vor Prag; König Friedrich V. flieht, Böhmen wird rekatholisiert, 1621 werden 27 Anführer des Aufstands in Prag hingerichtet.
  regions: [mitteleuropa]
