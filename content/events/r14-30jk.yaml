  summary: Kaiser Ferdinand II. ordnet ohne Zustimmung des Reichstags die Rückgabe aller seit 1552 von Protestanten eingezogenen geistlichen Güter an; das Edikt treibt auch kaisertreue Lutheraner in die Opposition.
  regions: [deutschland]
  themes: [religion, verfassung-recht]
