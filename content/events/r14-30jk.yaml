  summary: Der Kaiser und Kursachsen schließen Frieden, dem sich die meisten Reichsstände anschließen; das Restitutionsedikt wird ausgesetzt, Sonderbündnisse werden verboten. Weil Schweden und Frankreich draußen bleiben, geht der Krieg weiter.
