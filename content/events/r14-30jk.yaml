- id: prager-fenstersturz-1618
  title: Prager Fenstersturz
  aliases: [Zweiter Prager Fenstersturz]
  date: "1618-05-23"
  weight: 2
  kind: ereignis
  summary: Protestantische böhmische Adlige werfen in der Prager Burg die königlichen Statthalter Jaroslav Borsita von Martinitz und Wilhelm Slavata sowie den Sekretär Philipp Fabricius aus dem Fenster; alle drei überleben. Der Akt eröffnet den Aufstand der böhmischen Stände.
  regions: [mitteleuropa]
  themes: [politik, religion]
  places: [prager-burg, prag]
  polities: [koenigreich-boehmen, habsburgermonarchie]
