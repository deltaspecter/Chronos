- id: berliner-maerzrevolution
  title: Barrikadenkämpfe in Berlin
  aliases: [18. März 1848, Märzgefallene]
  start: "1848-03-18"
  end: "1848-03-19"
  weight: 2
  kind: revolution
  summary: Als Soldaten auf dem Schlossplatz in die Menge schießen, errichten Berliner Handwerker, Arbeiter und Studenten Barrikaden und kämpfen eine Nacht lang gegen das Militär. König Friedrich Wilhelm IV. lässt die Truppen abziehen und muss sich vor den aufgebahrten Toten verneigen; Schätzungen der Getöteten auf Seiten der Aufständischen reichen von etwa 250 bis über 300.
  regions: [deutschland]
  themes: [revolutionen, gewalt-genozid]
  places: [berlin]
  persons: [friedrich-wilhelm-iv]
  polities: [koenigreich-preussen]
