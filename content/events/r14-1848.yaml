  date: "1849-07-23"
  weight: 2
  kind: ereignis
  summary: Nach dreiwöchiger Belagerung durch preußische Truppen ergibt sich die von badischen Revolutionstruppen gehaltene Festung Rastatt; Standgerichte verurteilen zahlreiche Revolutionäre zum Tod. Mit der Kapitulation endet die Revolution in Deutschland, Tausende Badener fliehen in die Schweiz und nach Amerika.
