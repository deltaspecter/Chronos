  start: "1849-05"
  end: "1849-07-23"
  weight: 2
  kind: revolution
  summary: Volksvereine, Bürgerwehren und Teile des Militärs versuchen, die Reichsverfassung gegen die Fürsten durchzusetzen; es kommt zu Aufständen in Sachsen, im Rheinland und in Westfalen, in der bayerischen Pfalz und in Baden. Preußische Truppen und Bundestruppen schlagen die Bewegung bis Juli 1849 nieder.
  regions: [deutschland]
