  title: Vorparlament in Frankfurt
  start: "1848-03-31"
  end: "1848-04-03"
  weight: 3
  kind: ereignis
  summary: Über 500 liberale und demokratische Politiker, meist Mitglieder deutscher Landtage, beschließen in Frankfurt Wahlen zu einer deutschen Nationalversammlung; der Antrag der Radikalen, sich zum permanenten Revolutionsorgan zu erklären, scheitert.
  regions: [deutschland]
  themes: [politik, verfassung-recht]
  places: [frankfurt, paulskirche]
  polities: [deutscher-bund]
