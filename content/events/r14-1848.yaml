  aliases: [Heckeraufstand, Gefecht auf der Scheideck]
  start: "1848-04-12"
  end: "1848-04-20"
  weight: 3
  kind: revolution
  summary: Friedrich Hecker ruft in Konstanz zum bewaffneten Zug für eine deutsche Republik auf; die wenigen tausend Freischärler werden am 20. April bei Kandern von Bundestruppen geschlagen, deren Befehlshaber Friedrich von Gagern im Gefecht fällt.
  regions: [deutschland]
  themes: [revolutionen, krieg-militaer]
