  start: "1848-03-13"
  end: "1848-03-15"
  weight: 2
  kind: revolution
  summary: Demonstrationen von Studenten, Bürgern und Vorstadtarbeitern und blutige Zusammenstöße mit Militär zwingen Staatskanzler Metternich am 13. März zum Rücktritt und zur Flucht; der Hof hebt die Zensur auf, genehmigt eine Nationalgarde und verspricht eine Verfassung.
  regions: [mitteleuropa]
  themes: [revolutionen, politik]
  places: [wien]
  persons: [klemens-von-metternich, ferdinand-i-oesterreich]
  polities: [habsburgermonarchie]
- id: ungarische-revolution-1848
  title: Ungarische Revolution und Unabhängigkeitskrieg
  start: "1848-03-15"
  end: "1849-10-06"
  weight: 1
  kind: revolution
  summary: Am 15. März 1848 erheben sich in Pest Studenten und Intellektuelle um Sándor Petőfi; mit den Aprilgesetzen erhält Ungarn eine eigene verantwortliche Regierung, die Leibeigenschaft wird aufgehoben. Ab Herbst 1848 eskaliert der Konflikt mit Wien und mit Kroaten, Serben und Rumänen zum Krieg, der 1849 mit russischer Hilfe niedergeschlagen wird.
  regions: [mitteleuropa, suedosteuropa]
