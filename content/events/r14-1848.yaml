  aliases: [Kartoffelkrankheit, Kartoffelrevolution]
  start: "1845"
  end: "1847"
  weight: 2
  kind: katastrophe
  summary: Die seit 1845 grassierende Kartoffelfäule und schlechte Getreideernten 1846 ließen die Lebensmittelpreise 1847 in weiten Teilen Europas auf ein Vielfaches steigen; es kam zu Hungerunruhen, etwa der Berliner „Kartoffelrevolution“ im April 1847. Zugleich traf eine Handels- und Gewerbekrise Handwerker und Heimarbeiter. In Irland wurde die Missernte zur großen Hungersnot.
  regions: [europa, deutschland, britische-inseln]
  themes: [landwirtschaft, wirtschaft-handel, umwelt-klima, gesellschaft]
