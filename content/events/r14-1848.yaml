- id: abschaffung-sklaverei-frankreich-1848
  title: Endgültige Abolition in den französischen Kolonien 1848
  date: "1848-04-27"
  weight: 2
  kind: gesetz
  summary: Auf Betreiben Victor Schœlchers schafft die Provisorische Regierung der Zweiten Republik die Sklaverei in allen französischen Kolonien ab; rund eine Viertelmillion Menschen auf Martinique, Guadeloupe, Réunion, in Französisch-Guayana und Senegal werden frei, die Eigentümer erhalten eine Entschädigung.
  regions: [frankreich, karibik, westafrika, indischer-ozean]
  themes: [sklaverei-unfreiheit, verfassung-recht]
