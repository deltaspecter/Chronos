- id: bauernbefreiung-oesterreich-1848
  title: Grundentlastung in Österreich
  aliases: [Bauernbefreiung 1848, Aufhebung der Untertänigkeit]
  date: "1848-09-07"
  weight: 3
  kind: gesetz
  summary: Auf Antrag des schlesischen Abgeordneten Hans Kudlich hebt der österreichische Reichstag Untertänigkeit, Robot und grundherrliche Lasten auf, teils gegen Entschädigung der Grundherren – eine der dauerhaftesten Errungenschaften der Revolution, die auch die neoabsolutistische Regierung nicht zurücknahm.
  regions: [mitteleuropa]
  themes: [landwirtschaft, sklaverei-unfreiheit, gesellschaft]
  places: [wien]
  polities: [habsburgermonarchie]
- id: septemberunruhen-frankfurt-1848
  title: Septemberaufstand in Frankfurt
  date: "1848-09-18"
  weight: 3
  kind: revolution
  summary: Nachdem die Nationalversammlung den von Preußen eigenmächtig geschlossenen Waffenstillstand von Malmö mit Dänemark hingenommen hat, kommt es in Frankfurt zu Barrikadenkämpfen; zwei konservative Abgeordnete werden ermordet, preußische und österreichische Truppen schlagen den Aufstand nieder. Das Parlament ist fortan auf den Schutz der Fürsten angewiesen.
  regions: [deutschland]
  themes: [revolutionen, politik]
  places: [frankfurt, paulskirche]
  polities: [deutscher-bund, koenigreich-preussen]
