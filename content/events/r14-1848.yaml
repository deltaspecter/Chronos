  summary: Die ungarische Hauptarmee unter Artúr Görgei streckt vor der russischen Interventionsarmee die Waffen. Kossuth flieht ins Osmanische Reich; am 6. Oktober 1849 lässt die österreichische Militärjustiz in Arad dreizehn Generäle und in Pest den früheren Ministerpräsidenten Batthyány hinrichten.
