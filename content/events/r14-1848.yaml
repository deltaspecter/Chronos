  aliases: [Cinque Giornate]
  start: "1848-03-18"
  end: "1848-03-22"
  weight: 3
  kind: revolution
  summary: In fünftägigen Straßenkämpfen vertreiben die Mailänder die österreichische Garnison unter Radetzky; zugleich ruft Venedig unter Daniele Manin die Republik San Marco aus, und Sardinien-Piemont erklärt Österreich den Krieg.
  regions: [italien]
  themes: [revolutionen, krieg-militaer]
  places: [mailand, venedig]
  persons: [joseph-radetzky, karl-albert-sardinien]
  polities: [habsburgermonarchie, koenigreich-sardinien]
