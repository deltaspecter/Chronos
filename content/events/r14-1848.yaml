  title: Schlacht bei Custozza
  start: "1848-07-23"
  end: "1848-07-25"
  weight: 3
  kind: schlacht
  summary: Feldmarschall Radetzky besiegt die Armee Sardinien-Piemonts südwestlich von Verona; Österreich gewinnt Mailand und die Lombardei zurück, ein Waffenstillstand folgt im August.
  regions: [italien]
  themes: [krieg-militaer]
  persons: [joseph-radetzky, karl-albert-sardinien]
