  title: Wiener Oktoberaufstand
  start: "1848-10-06"
  end: "1848-10-31"
  weight: 2
  kind: revolution
  summary: Um den Abmarsch von Truppen gegen Ungarn zu verhindern, erheben sich Wiener Arbeiter, Studenten und Nationalgardisten; Kriegsminister Latour wird gelyncht, der Hof flieht nach Olmütz. Truppen unter Windischgrätz und Jelačić belagern und erobern die Stadt; die Zahl der Toten wird sehr unterschiedlich, meist auf über 2.000, geschätzt.
  regions: [mitteleuropa]
  themes: [revolutionen, krieg-militaer]
  places: [wien, olmuetz]
  persons: [alfred-zu-windischgraetz, josip-jelacic, robert-blum]
  polities: [habsburgermonarchie]
