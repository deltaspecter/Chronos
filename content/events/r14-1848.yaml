  summary: Das nach Debrecen ausgewichene ungarische Parlament erklärt das Haus Habsburg-Lothringen für abgesetzt und wählt Lajos Kossuth zum Regenten-Präsidenten; der junge Kaiser Franz Joseph bittet daraufhin den Zaren um militärische Hilfe.
