  title: Hinrichtung Robert Blums
  date: "1848-11-09"
  weight: 3
  kind: ereignis
  summary: Der Frankfurter Abgeordnete Robert Blum, der im belagerten Wien mitgekämpft hatte, wird trotz parlamentarischer Immunität von einem Standgericht verurteilt und in der Brigittenau erschossen – ein demonstrativer Schlag der Gegenrevolution gegen das Frankfurter Parlament.
  regions: [mitteleuropa, deutschland]
  themes: [politik, gewalt-genozid]
  places: [wien]
  persons: [robert-blum, alfred-zu-windischgraetz]
  polities: [habsburgermonarchie]
- id: gegenrevolution-preussen-1848
  title: Staatsstreich in Preußen und oktroyierte Verfassung
  start: "1848-11-09"
  end: "1848-12-05"
  weight: 3
  kind: gesetz
  summary: Friedrich Wilhelm IV. verlegt die preußische Nationalversammlung, lässt Berlin am 10. November von General Wrangel besetzen und den Belagerungszustand verhängen; am 5. Dezember löst er die Versammlung auf und erlässt aus eigener Machtvollkommenheit eine Verfassung, die 1849 durch das Dreiklassenwahlrecht ergänzt wird.
  regions: [deutschland]
  themes: [verfassung-recht, politik]
  places: [berlin]
  persons: [friedrich-wilhelm-iv]
  polities: [koenigreich-preussen]
- id: thronwechsel-oesterreich-1848
  title: Thronwechsel in Olmütz
  date: "1848-12-02"
  weight: 3
  kind: herrschaft
  summary: Kaiser Ferdinand I. dankt zugunsten seines 18-jährigen Neffen Franz Joseph ab, der nicht an die Zusagen seines Vorgängers gebunden sein soll; im März 1849 lässt die Regierung Schwarzenberg den Reichstag in Kremsier auflösen und oktroyiert eine Verfassung für den Gesamtstaat.
  regions: [mitteleuropa]
  themes: [politik]
  places: [olmuetz, kremsier]
  persons: [ferdinand-i-oesterreich, franz-joseph-i, felix-zu-schwarzenberg]
  polities: [habsburgermonarchie]
- id: praesidentenwahl-frankreich-1848
  title: Präsidentenwahl in Frankreich
  date: "1848-12-10"
  weight: 3
  kind: ereignis
  summary: Bei der ersten Präsidentenwahl nach allgemeinem Männerwahlrecht siegt Louis-Napoléon Bonaparte, ein Neffe Napoleons I., mit rund drei Vierteln der Stimmen, getragen vor allem von der Landbevölkerung; General Cavaignac und Lamartine unterliegen deutlich.
  regions: [frankreich]
  themes: [politik]
  persons: [napoleon-iii, alphonse-de-lamartine]
  polities: [zweite-franzoesische-republik]
- id: grundrechte-des-deutschen-volkes
  title: Grundrechte des deutschen Volkes
  date: "1848-12-27"
  weight: 2
  kind: gesetz
  summary: Die Nationalversammlung verkündet als Reichsgesetz einen Katalog von Grundrechten – Gleichheit vor dem Gesetz, Aufhebung der Standesvorrechte des Adels, Freiheit der Person, Presse-, Glaubens-, Versammlungs- und Vereinsfreiheit, Abschaffung der Todesstrafe außer im Kriegsrecht; mehrere große Staaten, darunter Preußen und Österreich, verweigern die Einführung, der Deutsche Bund hebt sie 1851 auf.
  regions: [deutschland]
  themes: [verfassung-recht]
  places: [paulskirche]
  polities: [deutscher-bund]
- id: reichsverfassung-1849
  title: Reichsverfassung der Paulskirche
  aliases: [Paulskirchenverfassung, Frankfurter Reichsverfassung]
  date: "1849-03-28"
  weight: 1
  kind: gesetz
  summary: Die Nationalversammlung verabschiedet eine Verfassung für einen deutschen Bundesstaat ohne die nichtdeutschen Gebiete Österreichs – mit einem erblichen Kaiser, einem Reichstag aus Volks- und Staatenhaus, allgemeinem Männerwahlrecht für das Volkshaus und den Grundrechten; am selben Tag wählt sie den preußischen König zum Kaiser. Die Verfassung tritt nie in Kraft, wird aber Vorbild für die Weimarer Reichsverfassung und das Grundgesetz.
  regions: [deutschland]
  themes: [verfassung-recht, politik]
  places: [paulskirche]
  persons: [heinrich-von-gagern, eduard-simson, friedrich-wilhelm-iv]
  polities: [deutscher-bund]
