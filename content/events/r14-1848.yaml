  title: Sklavenbefreiung in Dänisch-Westindien
  date: "1848-07-03"
  weight: 3
  kind: gesetz
  summary: Nach einem Aufstand versklavter Menschen auf der Insel St. Croix verkündet Generalgouverneur Peter von Scholten eigenmächtig die sofortige Freiheit aller Unfreien in der dänischen Karibikkolonie – ein Beispiel dafür, dass 1848 auch jenseits Europas Freiheit erkämpft wurde.
