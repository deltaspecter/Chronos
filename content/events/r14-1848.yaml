  title: Dresdner Maiaufstand
  start: "1849-05-03"
  end: "1849-05-09"
  weight: 3
  kind: revolution
  summary: Als der sächsische König die Reichsverfassung ablehnt und den Landtag auflöst, erheben sich Dresdner Bürger und Arbeiter; unter den Beteiligten sind der Hofkapellmeister Richard Wagner, der Architekt Gottfried Semper und der russische Anarchist Michail Bakunin. Sächsische und preußische Truppen schlagen den Aufstand nieder.
