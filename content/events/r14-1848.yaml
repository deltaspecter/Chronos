  date: "1848-02-27"
  weight: 3
  kind: ereignis
  summary: Eine Volksversammlung in Mannheim fordert Volksbewaffnung, unbeschränkte Pressefreiheit, Schwurgerichte und die sofortige Einberufung eines deutschen Parlaments – Grundmuster der „Märzforderungen“, die in den folgenden Wochen in fast allen deutschen Staaten erhoben wurden.
  regions: [deutschland]
  themes: [politik, revolutionen]
  places: [mannheim]
  polities: [grossherzogtum-baden, deutscher-bund]
