  start: "1849-04-03"
  end: "1849-04-28"
  weight: 2
  kind: ereignis
  summary: Friedrich Wilhelm IV. empfängt am 3. April 1849 die Kaiserdeputation der Nationalversammlung unter Eduard Simson und antwortet ausweichend, er könne die Krone nur mit Zustimmung der Fürsten annehmen; am 28. April lehnt Preußen die Krone und die Reichsverfassung endgültig ab, obwohl 28 kleinere und mittlere Staaten sie angenommen haben.
