  persons: [victor-schoelcher]
  polities: [zweite-franzoesische-republik]
- id: frankfurter-nationalversammlung
  title: Frankfurter Nationalversammlung
  aliases: [Paulskirchenparlament, Deutsche Nationalversammlung, Rumpfparlament]
  start: "1848-05-18"
  end: "1849-06-18"
  dateNote: Nach dem Auszug der österreichischen, preußischen und vieler anderer Abgeordneter tagte ein Rumpfparlament ab dem 6. Juni 1849 in Stuttgart, bis württembergisches Militär es am 18. Juni auflöste.
  weight: 1
  kind: ereignis
  summary: Erste aus allgemeinen, wenn auch je nach Staat unterschiedlich geregelten Männerwahlen hervorgegangene gesamtdeutsche Volksvertretung; sie tagt in der Frankfurter Paulskirche, wählt einen Reichsverweser, beschließt Grundrechte und eine Reichsverfassung, kann diese aber gegen die Fürsten nicht durchsetzen.
  regions: [deutschland, mitteleuropa]
  themes: [politik, verfassung-recht, revolutionen]
  places: [paulskirche, frankfurt]
  persons: [heinrich-von-gagern, eduard-simson, robert-blum, erzherzog-johann, gabriel-riesser]
  polities: [deutscher-bund]
- id: slawenkongress
  title: Slawenkongress in Prag
  start: "1848-06-02"
  end: "1848-06-12"
  weight: 3
  kind: ereignis
  summary: Mehrere hundert Vertreter slawischer Völker vor allem der Habsburgermonarchie beraten unter dem Vorsitz František Palackýs über ihre Stellung; die Mehrheit fordert einen Umbau Österreichs zu einem Bund gleichberechtigter Nationen statt eines Anschlusses an ein deutsches Reich.
  regions: [mitteleuropa, osteuropa]
  themes: [politik]
  places: [prag]
  persons: [frantisek-palacky]
  polities: [habsburgermonarchie]
- id: prager-pfingstaufstand
  title: Prager Pfingstaufstand
  start: "1848-06-12"
  end: "1848-06-17"
  weight: 3
  kind: revolution
  summary: Ein Aufstand tschechischer Studenten und Arbeiter gegen das Militär endet nach der Beschießung der Stadt durch Truppen des Fürsten Windischgrätz mit der Kapitulation; der Slawenkongress wird aufgelöst. Es ist der erste große Sieg der Gegenrevolution in Mitteleuropa.
  regions: [mitteleuropa]
  themes: [revolutionen, krieg-militaer]
  places: [prag]
  persons: [alfred-zu-windischgraetz]
  polities: [habsburgermonarchie]
- id: junischlacht-1848
  title: Juniaufstand in Paris
  aliases: [Junischlacht, Journées de Juin]
  start: "1848-06-23"
  end: "1848-06-26"
  weight: 2
  kind: revolution
  summary: Die Schließung der Nationalwerkstätten, die Arbeitslose beschäftigt hatten, treibt Pariser Arbeiter auf die Barrikaden. General Cavaignac schlägt den Aufstand mit Armee und Nationalgarde nieder; Tausende sterben, Tausende werden verhaftet und viele nach Algerien deportiert. Der Bruch zwischen bürgerlicher Republik und Arbeiterschaft prägt die Wahrnehmung der Revolution in ganz Europa.
  regions: [frankreich]
  themes: [revolutionen, gesellschaft, gewalt-genozid]
  places: [paris]
  polities: [zweite-franzoesische-republik]
