  date: "1848-01-12"
  weight: 3
  kind: revolution
  summary: In Palermo erheben sich die Sizilianer gegen die bourbonische Regierung in Neapel und erzwingen eine Verfassung – die erste Revolution des Jahres 1848, noch vor dem Umsturz in Paris.
  regions: [italien]
  themes: [revolutionen]
  places: [palermo]
- id: februarrevolution-1848
  title: Februarrevolution in Paris
  start: "1848-02-22"
  end: "1848-02-24"
  weight: 1
  kind: revolution
  summary: Nach dem Verbot eines Reformbanketts errichten Pariser Arbeiter, Handwerker und Studenten Barrikaden; Schüsse von Soldaten auf Demonstranten verschärfen den Aufstand. König Louis-Philippe dankt ab, eine Provisorische Regierung ruft die Republik aus und führt das allgemeine Männerwahlrecht ein. Die Nachricht löst in ganz Mitteleuropa Erhebungen aus.
  regions: [frankreich, europa]
  themes: [revolutionen, politik]
  places: [paris]
  persons: [louis-philippe, alphonse-de-lamartine, louis-blanc]
  polities: [julimonarchie, zweite-franzoesische-republik]
- id: mannheimer-volksversammlung-1848
