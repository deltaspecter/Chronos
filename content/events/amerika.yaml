  themes: [archaeologie]
  places: [palenque]
  persons: [pakal]
- id: proskouriakoff-historische-hypothese
  title: Proskouriakoffs „historische Hypothese“
  date: "1960"
  weight: 3
  kind: entdeckung
  summary: Tatiana Proskouriakoff weist nach, dass die Stelen von Piedras Negras Geburt, Thronbesteigung und Tod von Herrschern verzeichnen; Maya-Inschriften werden als Geschichtsquellen lesbar.
  regions: [mesoamerika]
  themes: [schrift-medien, geschichtsschreibung]
  persons: [tatiana-proskouriakoff]
- id: lidar-maya-tiefland
