  date: "2018"
  weight: 3
  kind: entdeckung
  summary: Eine luftgestützte Laservermessung (LiDAR) von über 2.100 Quadratkilometern macht rund 61.000 bis dahin weitgehend unbekannte Bauten sichtbar und verändert die Schätzungen zur Bevölkerungsdichte der Maya.
  regions: [mesoamerika]
  themes: [archaeologie]
  places: [tikal, el-mirador]

