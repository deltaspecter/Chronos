  aliases: [Maya-Kollaps, Klassischer Maya-Kollaps]
  start: "~800"
  end: "~950"
  certainty: wahrscheinlich
  weight: 1
  kind: entwicklung
  summary: Die Königtümer des südlichen Tieflands zerfallen, viele Städte werden innerhalb weniger Generationen weitgehend verlassen; als Ursachen gelten Dürren, Kriege, Überlastung der Landschaft und eine Krise des Königtums.
  regions: [mesoamerika]
  themes: [umwelt-klima, politik]
  places: [tikal, calakmul, copan, palenque]
  polities: [mutul, kaanul]
