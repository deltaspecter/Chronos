  places: [palenque]
  persons: [pakal]
- id: proskouriakoff-historische-hypothese
  title: Proskouriakoffs „historische Hypothese“
  date: "1960"
  weight: 3
  kind: entdeckung
  summary: Tatiana Proskouriakoff weist nach, dass die Stelen von Piedras Negras Geburt, Thronbesteigung und Tod von Herrschern verzeichnen; Maya-Inschriften werden als Geschichtsquellen lesbar.
  regions: [mesoamerika]
  themes: [schrift-medien, geschichtsschreibung]
  persons: [tatiana-proskouriakoff]
- id: lidar-maya-tiefland
  title: Laserscan-Kartierung im Norden Guatemalas
  date: "2018"
  weight: 3
  kind: entdeckung
  summary: Eine luftgestützte Laservermessung (LiDAR) von über 2.100 Quadratkilometern macht rund 61.000 bis dahin weitgehend unbekannte Bauten sichtbar und verändert die Schätzungen zur Bevölkerungsdichte der Maya.
  regions: [mesoamerika]
  themes: [archaeologie]
  places: [tikal, el-mirador]

