  date: "1142"
  weight: 3
  kind: vertrag
  summary: Die Südlichen Song erkennen die Herrschaft der Jin über Nordchina an und zahlen Tribut; der Fluss Huai wird zur Grenze. Zuvor wird der General Yue Fei hingerichtet.
  regions: [china]
  themes: [politik]
  persons: [yue-fei]
  polities: [song-dynastie, jin-dynastie-jurchen]
- id: einnahme-hangzhous-1276
  title: Einnahme Hangzhous durch die Mongolen
  date: "1276"
  weight: 3
  kind: ereignis
  summary: Die Mongolen unter dem General Bayan nehmen die Hauptstadt der Südlichen Song ein, die Kaiserinwitwe und der junge Kaiser ergeben sich; Getreue setzen den Widerstand im Süden fort.
  regions: [china]
  themes: [krieg-militaer]
  places: [hangzhou]
  persons: [khubilai-khan, wen-tianxiang]
  polities: [song-dynastie, yuan-dynastie]
- id: schlacht-von-yamen
  title: Seeschlacht von Yamen
  date: "1279-03-19"
  weight: 3
  kind: schlacht
  summary: Die Flotte der Yuan vernichtet die letzten Song-Truppen; der Minister Lu Xiufu springt mit dem kindlichen Kaiser ins Meer. Damit endet die Song-Dynastie.
  regions: [china]
  themes: [krieg-militaer]
  places: [yamen]
  polities: [song-dynastie, yuan-dynastie]
