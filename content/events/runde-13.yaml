  start: "1069"
  end: "1085"
  weight: 3
  kind: gesetz
  summary: Kanzler Wang Anshi setzt staatliche Saatkredite für Bauern, eine Neuvermessung des Landes, Geldsteuern statt Frondiensten und lokale Milizen durch; nach dem Tod Kaiser Shenzongs werden die Reformen größtenteils zurückgenommen.
  regions: [china]
  themes: [politik, wirtschaft-handel]
  places: [kaifeng]
  persons: [wang-anshi, sima-guang]
  polities: [song-dynastie]
- id: fall-von-kaifeng
  title: Fall von Kaifeng
  date: "1127"
  weight: 2
  kind: ereignis
  summary: Die Jurchen erobern die Hauptstadt der Song und verschleppen Kaiser Huizong, seinen Sohn Qinzong und Tausende Angehörige des Hofs nach Norden; ein überlebender Prinz begründet im Süden die Südlichen Song.
  regions: [china]
  themes: [krieg-militaer, politik]
  places: [kaifeng]
  persons: [song-huizong]
  polities: [song-dynastie, jin-dynastie-jurchen]
- id: frieden-von-shaoxing
