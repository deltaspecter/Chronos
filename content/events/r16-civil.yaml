  weight: 3
  kind: ereignis
  summary: Mitglieder des Ku-Klux-Klans zünden eine Bombe an einer Schwarzen Kirche in Birmingham, die vier Mädchen tötet.
  regions: [nordamerika]
  themes: [gewalt-genozid]
  places: [birmingham-alabama]
- id: freedom-summer
  title: Freedom Summer
  aliases: [Mississippi Summer Project]
  start: "1964-06"
  end: "1964-08"
  weight: 2
  kind: ereignis
  summary: Hunderte meist weiße Studierende aus dem Norden helfen in Mississippi bei der Wählerregistrierung und in „Freiheitsschulen“; drei Aktivisten – James Chaney, Andrew Goodman und Michael Schwerner – werden im Juni ermordet, im August fordert die Mississippi Freedom Democratic Party vergeblich die Sitze der rein weißen Delegation auf dem Parteitag der Demokraten.
  regions: [nordamerika]
  themes: [gesellschaft, politik]
  persons: [fannie-lou-hamer, lyndon-b-johnson]
  polities: [sncc]
