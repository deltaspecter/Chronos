  summary: Martin Luther King wird in Memphis, wo er streikende Müllarbeiter unterstützt, von James Earl Ray erschossen; in über hundert Städten kommt es zu Unruhen, eine Woche später unterzeichnet Johnson ein Gesetz gegen Diskriminierung auf dem Wohnungsmarkt.
  regions: [nordamerika]
  themes: [gewalt-genozid, politik]
