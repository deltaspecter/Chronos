- id: grosse-gesandtschaft
  title: Große Gesandtschaft
  aliases: [Velikoe posol'stvo, Große Botschaft]
  start: "1697-03"
  end: "1698-08"
  weight: 2
  kind: ereignis
  summary: Eine Delegation von rund 250 Personen unter Franz Lefort reist durch Brandenburg-Preußen, die Niederlande, England und nach Wien, um Verbündete gegen die Osmanen zu werben und Fachleute anzuwerben; Peter reist inkognito mit und arbeitet auf Werften in Amsterdam und Deptford. Der Strelitzenaufstand zwingt ihn zur vorzeitigen Rückkehr.
  regions: [europa, westeuropa, mitteleuropa, britische-inseln]
  themes: [politik, wissenschaft-technik]
  places: [koenigsberg, amsterdam, zaandam, deptford, london, wien]
