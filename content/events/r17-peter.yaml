# Ereignisse: Peter der Große und die Petrinischen Reformen (r17-peter)
- id: strelitzenaufstand-1682
  title: Strelitzenaufstand von 1682
  aliases: [Chowanschtschina, Moskauer Aufstand 1682]
  start: "1682-05-25"
  end: "1682-05-27"
  dateNote: 15.–17. Mai 1682 nach julianischem Kalender; die Unruhen in Moskau hielten bis in den Herbst an.
  weight: 2
  kind: ereignis
  summary: Nach dem Tod Fjodors III. und der Ausrufung des zehnjährigen Peter zum Zaren stürmen Strelitzen, angestachelt durch die Partei der Miloslawskis, den Kreml und töten Angehörige und Anhänger der Familie Naryschkin; Ergebnis ist die Doppelherrschaft Iwans V. und Peters unter der Regentschaft Sofias.
  regions: [russland]
  themes: [politik, gewalt-genozid]
  places: [moskau]
  persons: [peter-der-grosse, sofia-alexejewna, iwan-v, natalja-naryschkina, fjodor-iii]
  polities: [moskauer-reich]
- id: sturz-sofias-1689
  title: Sturz der Regentin Sofia
  start: "1689-08"
  end: "1689-09"
  dateNote: Peter floh in der Nacht vom 7. auf den 8. August 1689 (julianisch) in das Dreifaltigkeitskloster; im September wurde Sofia ins Nowodewitschi-Kloster gebracht.
  weight: 2
  kind: ereignis
  summary: In einer Machtprobe zwischen den Anhängern Sofias und dem Umfeld des siebzehnjährigen Peter laufen Adel, Kirche und Teile der Strelitzen zu Peter über; Sofia wird ins Kloster verbannt, ihr Favorit Wassili Golizyn in den Norden verwiesen.
  regions: [russland]
  themes: [politik]
  places: [moskau]
  persons: [peter-der-grosse, sofia-alexejewna, wassili-golizyn, natalja-naryschkina]
  polities: [moskauer-reich]
