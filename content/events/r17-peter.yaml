  polities: [moskauer-reich, republik-der-vereinigten-niederlande, koenigreich-england, habsburgermonarchie]
- id: strelitzenaufstand-1698
  title: Strelitzenaufstand von 1698
  start: "1698-06"
  end: "1699"
  dateNote: Die Aufständischen wurden am 18. Juni 1698 (julianisch) beim Auferstehungskloster (Neu-Jerusalem) geschlagen; Verhöre und Hinrichtungen zogen sich vom Herbst 1698 bis 1699 hin.
  weight: 2
  kind: ereignis
  summary: Strelitzenregimenter, die an die Westgrenze verlegt worden waren, marschieren auf Moskau und werden von Regierungstruppen unter Patrick Gordon geschlagen; Peter lässt nach seiner Rückkehr Hunderte unter Folter verhören und weit über tausend hinrichten und löst die Strelitzen danach weitgehend auf.
  regions: [russland]
  themes: [politik, gewalt-genozid, krieg-militaer]
  places: [moskau, preobraschenskoje]
  persons: [peter-der-grosse, patrick-gordon, sofia-alexejewna]
  polities: [moskauer-reich]
- id: grosser-nordischer-krieg
  title: Großer Nordischer Krieg
  aliases: [Nordischer Krieg, Great Northern War, Stora nordiska kriget]
  start: "1700"
  end: "1721"
  weight: 1
  kind: krieg
  summary: Krieg einer Koalition aus Russland, Dänemark-Norwegen und Sachsen-Polen, später auch Preußen und Hannover, gegen Schweden um die Vorherrschaft im Ostseeraum; er endet mit dem Verlust der schwedischen Großmachtstellung und dem Aufstieg Russlands zur europäischen Großmacht.
