  title: Asowfeldzüge
  aliases: [Eroberung von Asow 1696]
  start: "1695"
  end: "1696"
  weight: 3
  kind: krieg
  summary: Peters erster eigener Krieg gegen die osmanische Festung Asow am Don scheitert 1695; im Folgejahr fällt die Festung, nachdem eine in Woronesch gebaute Flussflotte sie vom Meer abgeschnitten hat.
