  title: Schlacht bei Marston Moor
  date: "1644-07-02"
  weight: 3
  kind: schlacht
  summary: Parlamentarische und schottische Truppen schlagen westlich von York das royalistische Heer unter Prinz Ruprecht von der Pfalz; Cromwells Reiterei trägt wesentlich zum Sieg bei, der Norden Englands geht für den König verloren.
  regions: [britische-inseln]
  themes: [krieg-militaer]
  places: [marston-moor, york]
  persons: [oliver-cromwell, thomas-fairfax]
- id: gruendung-new-model-army
  title: Aufstellung der New Model Army
  date: "1645-02-15"
  weight: 2
  kind: gruendung
  summary: Das Parlament beschließt ein neues, zentral besoldetes Heer unter Thomas Fairfax; die Self-Denying Ordinance zwingt die meisten Abgeordneten zur Niederlegung ihrer Kommandos, Cromwell wird als Ausnahme Befehlshaber der Reiterei.
  regions: [britische-inseln]
  themes: [krieg-militaer, politik]
  persons: [thomas-fairfax, oliver-cromwell]
  polities: [koenigreich-england]
