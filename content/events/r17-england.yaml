  summary: Cromwell schlägt das schottisch-royalistische Heer des in Schottland gekrönten Karl II., der nach abenteuerlicher Flucht nach Frankreich entkommt; die letzte Schlacht der Bürgerkriege, ein Jahr nach Cromwells Sieg bei Dunbar.
