  summary: Eine Parlamentsmehrheit versucht, den katholischen Thronfolger Jakob per Gesetz von der Nachfolge auszuschließen; Karl II. verhindert dies durch Parlamentsauflösungen. Im Streit entstehen die Parteibezeichnungen Whigs und Tories.
