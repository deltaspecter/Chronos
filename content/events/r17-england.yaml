  title: Putney-Debatten
  start: "1647-10-28"
  end: "1647-11-11"
  weight: 2
  kind: ereignis
  summary: Im Generalrat der New Model Army streiten Offiziere, gewählte Soldatenvertreter (Agitators) und Levellers über das „Agreement of the People“, über das Wahlrecht für alle Männer und die Zukunft des Königtums; die Armeeführung beendet die Debatten nach der Flucht des Königs aus Hampton Court.
  regions: [britische-inseln]
  themes: [politik, verfassung-recht, revolutionen]
