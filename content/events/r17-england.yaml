  title: Schlacht bei Naseby
  date: "1645-06-14"
  weight: 2
  kind: schlacht
  summary: Die New Model Army unter Fairfax und Cromwell vernichtet das Hauptheer Karls I.; erbeutete Briefe des Königs belegen seine Verhandlungen über ausländische und irische Hilfe. Bis 1646 ist der Erste Bürgerkrieg entschieden.
  regions: [britische-inseln]
  themes: [krieg-militaer]
  places: [naseby]
  persons: [karl-i-england, thomas-fairfax, oliver-cromwell]
