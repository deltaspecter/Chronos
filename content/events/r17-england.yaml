  start: "1649-01-20"
  end: "1649-01-30"
  weight: 1
  kind: revolution
  summary: Ein vom Rumpfparlament eingesetzter Hoher Gerichtshof verurteilt Karl I., der die Zuständigkeit des Gerichts bestreitet, als Tyrannen, Verräter und Mörder zum Tode; am 30. Januar 1649 wird er vor dem Banqueting House in Whitehall enthauptet. Im März schafft das Parlament Königtum und Oberhaus ab.
  regions: [britische-inseln, europa]
