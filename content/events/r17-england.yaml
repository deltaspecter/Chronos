  date: "1648-12-06"
  weight: 3
  kind: ereignis
  summary: Soldaten unter Oberst Thomas Pride verwehren über hundert verhandlungsbereiten Abgeordneten den Zutritt zum Unterhaus; das verbleibende Rumpfparlament beschließt, den König vor Gericht zu stellen.
  regions: [britische-inseln]
  themes: [politik, revolutionen]
  places: [westminster-palast]
  polities: [koenigreich-england]
- id: hinrichtung-karls-i
