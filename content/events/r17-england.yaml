  title: Cromwells Feldzug in Irland
  start: "1649-08-15"
  end: "1653"
  weight: 2
  kind: krieg
  summary: Die New Model Army erobert Irland; Cromwell selbst führt den Feldzug bis Mai 1650, seine Nachfolger beenden ihn bis 1653. Krieg, Hunger und Seuchen fordern sehr hohe Opfer, Zehntausende Iren werden ins Ausland verschifft, katholischer Landbesitz wird großflächig enteignet.
