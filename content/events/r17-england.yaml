  weight: 3
  kind: schlacht
  summary: Erste große Feldschlacht des Bürgerkriegs zwischen dem Heer Karls I. und dem des Parlaments unter dem Earl of Essex; sie endet ohne Entscheidung, der König bezieht danach Quartier in Oxford.
