  weight: 1
  kind: gesetz
  summary: Mit der Krone wird Wilhelm III. und Maria II. im Februar 1689 eine Erklärung der Rechte vorgelegt, die im Dezember als Bill of Rights Gesetz wird; sie verbietet der Krone, ohne Parlament Gesetze auszusetzen, Steuern zu erheben oder im Frieden ein stehendes Heer zu halten, verlangt freie Wahlen und Redefreiheit im Parlament und schließt Katholiken vom Thron aus.
