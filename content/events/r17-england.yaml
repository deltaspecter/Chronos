  summary: Nach der Geburt eines katholischen Thronfolgers und einer Einladung führender englischer Politiker landet Wilhelm von Oranien mit einer niederländischen Flotte und einem Heer von rund 15.000 Mann in Devon; Jakobs Armee löst sich durch Überläufer auf, der König flieht im Dezember nach Frankreich.
