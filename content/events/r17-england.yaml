- id: langes-parlament
  title: Zusammentritt des Langen Parlaments
  date: "1640-11-03"
  weight: 2
  kind: ereignis
  summary: Das im November 1640 eröffnete Parlament beseitigt in wenigen Monaten die Instrumente der persönlichen Herrschaft Karls I., lässt Strafford hinrichten und sichert sich gegen eine Auflösung ohne eigene Zustimmung; in wechselnder Gestalt besteht es formal bis 1660.
