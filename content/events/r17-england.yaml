- id: instrument-of-government
  title: Instrument of Government und Protektorat
  date: "1653-12-16"
  weight: 2
  kind: gesetz
  summary: Nachdem Cromwell im April 1653 das Rumpfparlament gewaltsam aufgelöst hat, macht ihn diese von Offizieren entworfene schriftliche Verfassung zum Lord Protector, der mit einem Staatsrat und regelmäßigen Parlamenten regieren soll; 1657 lehnt er die ihm angebotene Königskrone ab.
  regions: [britische-inseln]
