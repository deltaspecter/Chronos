  title: Bischofskriege
  start: "1639"
  end: "1640"
  weight: 3
  kind: krieg
  summary: Karl I. versucht zweimal vergeblich, die schottischen Covenanters militärisch zu unterwerfen; 1640 besetzen die Schotten Nordengland. Um den Krieg zu finanzieren, muss der König nach elf Jahren wieder ein Parlament einberufen.
