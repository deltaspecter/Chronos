- id: belagerung-von-drogheda
  title: Erstürmung von Drogheda
  date: "1649-09-11"
  weight: 2
  kind: schlacht
  summary: Nach Ablehnung der Kapitulationsaufforderung erstürmen Cromwells Truppen die Stadt und töten die Garnison und eine unbekannte Zahl von Zivilisten, darunter katholische Geistliche; Cromwell selbst spricht von etwa 2.000 Getöteten, insgesamt dürften es um die 3.000 gewesen sein. Im Oktober folgt ein ähnliches Blutbad in Wexford.
