  date: "1660-05-29"
  weight: 2
  kind: ereignis
  summary: Nach dem Zerfall des Protektorats und dem Marsch Moncks nach London ruft das Konventionsparlament Karl II. zurück, der in der Erklärung von Breda Amnestie und Gewissensfreiheit in Aussicht stellt; am 29. Mai 1660 zieht er in London ein. Mehrere Königsmörder werden hingerichtet.
  regions: [britische-inseln]
  themes: [politik]
  places: [london]
  persons: [karl-ii-england, george-monck, richard-cromwell]
