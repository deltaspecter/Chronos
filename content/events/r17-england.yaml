- id: irischer-aufstand-1641
  title: Irischer Aufstand von 1641
  date: "1641-10-23"
  weight: 2
  kind: ereignis
  summary: Katholische Iren erheben sich in Ulster gegen Protestanten und englische Herrschaft; tausende Siedler werden getötet oder vertrieben. Übertriebene Berichte über Massaker verschärfen in England die Angst vor einer katholischen Verschwörung und den Streit, wer das Heer zur Niederschlagung befehligen soll.
  regions: [britische-inseln]
  themes: [krieg-militaer, religion, gewalt-genozid]
  places: [dublin]
  polities: [koenigreich-irland]
