  start: "772"
  end: "804"
  weight: 2
  kind: krieg
  summary: In über drei Jahrzehnten wiederholter Feldzüge, Aufstände, Deportationen und Zwangstaufen unterwirft Karl die Sachsen und gliedert ihr Gebiet in das Frankenreich ein.
