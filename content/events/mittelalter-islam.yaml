  start: "797"
  end: "802"
  weight: 3
  kind: ereignis
  summary: Karl schickt Gesandte nach Bagdad; 802 erreicht als Geschenk des Kalifen ein Elefant namens Abul Abaz Aachen. Die Kontakte sind nur aus fränkischen Quellen bekannt.
