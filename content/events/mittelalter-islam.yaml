  weight: 1
  kind: herrschaft
  summary: Papst Leo III. krönt Karl in der Peterskirche in Rom zum Kaiser; erstmals seit über drei Jahrhunderten gibt es im Westen wieder einen Kaiser.
  regions: [italien]
  themes: [politik, religion]
  places: [rom]
  persons: [karl-der-grosse, leo-iii]
  polities: [frankenreich]
