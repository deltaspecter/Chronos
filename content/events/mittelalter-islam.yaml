# --- Frankenreich ---
- id: koenigserhebung-pippins
  title: Königserhebung Pippins
  date: "751"
  weight: 2
  kind: herrschaft
  summary: Der Hausmeier Pippin lässt den letzten Merowingerkönig absetzen und sich mit Zustimmung des Papstes zum König der Franken erheben – Beginn der karolingischen Königsherrschaft.
  regions: [westeuropa]
  themes: [politik, religion]
  persons: [pippin-der-juengere]
  polities: [frankenreich]
- id: salbung-in-saint-denis
  title: Papst Stephan II. salbt Pippin und seine Söhne
  date: "754"
  weight: 3
  kind: ereignis
  summary: In Saint-Denis salbt der Papst Pippin und seine Söhne Karl und Karlmann; Pippin sagt im Gegenzug Hilfe gegen die Langobarden zu.
  regions: [frankreich]
  themes: [religion, politik]
  places: [saint-denis]
  persons: [pippin-der-juengere, karl-der-grosse]
  polities: [frankenreich]
- id: sachsenkriege
