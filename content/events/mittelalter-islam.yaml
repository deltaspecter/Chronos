  date: "814-01-28"
  weight: 2
  kind: ereignis
  summary: Karl stirbt in Aachen und wird noch am selben Tag in der Pfalzkapelle beigesetzt; Nachfolger wird sein Sohn Ludwig der Fromme.
  regions: [mitteleuropa]
  themes: [politik]
  places: [aachen]
  persons: [karl-der-grosse, ludwig-der-fromme, einhard]
  polities: [frankenreich]
- id: vertrag-von-verdun
  title: Vertrag von Verdun
  date: "843-08"
  weight: 2
  kind: vertrag
  summary: Die Enkel Karls des Großen teilen das Frankenreich in ein West-, ein Mittel- und ein Ostreich – eine Teilung, aus der langfristig Frankreich und das römisch-deutsche Reich hervorgingen.
  regions: [westeuropa, mitteleuropa]
  themes: [politik]
  places: [verdun]
  polities: [frankenreich]

