  date: "812"
  weight: 3
  kind: vertrag
  summary: Gesandte des byzantinischen Kaisers Michael I. begrüßen Karl in Aachen als Kaiser; im Gegenzug verzichtet Karl auf Venetien und Dalmatien.
  regions: [mitteleuropa, suedosteuropa]
  themes: [politik]
  places: [aachen]
  persons: [karl-der-grosse]
  polities: [frankenreich, byzantinisches-reich]
- id: tod-karls-des-grossen
