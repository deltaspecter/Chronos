  summary: Felice Orsini und Mitverschwörer werfen in Paris vor der Oper Bomben auf die Kutsche Napoleons III.; der Kaiser bleibt unverletzt, mehrere Menschen sterben. Orsinis Appell zur Befreiung Italiens trägt dazu bei, Napoleon für ein Bündnis mit Piemont zu gewinnen.
