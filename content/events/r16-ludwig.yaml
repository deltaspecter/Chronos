  date: "1714-03-07"
  weight: 3
  kind: vertrag
  summary: Prinz Eugen und Marschall Villars beenden den Krieg zwischen Kaiser und Frankreich; der Kaiser erhält die Spanischen Niederlande, Mailand, Neapel und Sardinien, Frankreich behält Straßburg. Der Friede mit dem Reich folgt im September in Baden (Aargau).
