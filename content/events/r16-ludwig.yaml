- id: gallikanische-artikel-1682
  title: Gallikanische Artikel
  date: "1682-03-19"
  weight: 3
  kind: gesetz
  summary: Eine Versammlung des französischen Klerus erklärt in vier von Bossuet formulierten Artikeln, der König sei in weltlichen Dingen dem Papst nicht unterworfen und die Gewalt des Papstes durch Konzilien und die Gewohnheiten der gallikanischen Kirche begrenzt.
  regions: [frankreich, italien]
  themes: [religion, verfassung-recht]
  places: [paris]
  persons: [bossuet, ludwig-xiv]
  polities: [koenigreich-frankreich]
- id: hof-in-versailles-1682
  title: Übersiedlung des Hofes nach Versailles
  date: "1682-05-06"
  weight: 2
  kind: ereignis
  summary: Ludwig XIV. verlegt Hof und Regierung dauerhaft in das ausgebaute Schloss Versailles, das bis 1789 Sitz der französischen Monarchie bleibt.
  regions: [frankreich]
  themes: [politik, kultur-kunst]
  places: [versailles, paris]
  persons: [ludwig-xiv]
  polities: [koenigreich-frankreich]
- id: edikt-von-fontainebleau
  title: Edikt von Fontainebleau
  aliases: [Widerruf des Edikts von Nantes, Revokation]
  date: "1685-10-18"
  weight: 1
  kind: gesetz
  summary: Ludwig XIV. widerruft das Edikt von Nantes, verbietet den reformierten Gottesdienst, lässt die Kirchen zerstören und weist die Pfarrer aus; den übrigen Reformierten wird die Auswanderung verboten. Dennoch fliehen in den folgenden Jahren schätzungsweise 150.000 bis 200.000 Menschen.
  regions: [frankreich, europa]
  themes: [religion, migration, verfassung-recht]
  places: [fontainebleau]
  persons: [ludwig-xiv, louvois]
  polities: [koenigreich-frankreich]
- id: potsdamer-edikt-1685
  title: Edikt von Potsdam
  date: "1685-11-08"
  weight: 2
  kind: gesetz
  summary: Kurfürst Friedrich Wilhelm von Brandenburg bietet den aus Frankreich geflohenen Reformierten Aufnahme, Steuerfreiheit, Hilfen beim Aufbau von Gewerben und eigene Gemeinden an (nach damaligem julianischem Kalender 29. Oktober).
  regions: [deutschland, frankreich]
  themes: [migration, religion]
  places: [potsdam, berlin]
