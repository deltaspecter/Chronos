  title: Besetzung Straßburgs
  date: "1681-09-30"
  weight: 3
  kind: ereignis
  summary: Französische Truppen zwingen die Reichsstadt Straßburg zur Kapitulation; der Münster wird dem katholischen Kult zurückgegeben, Vauban baut die Stadt zur Festung aus.
  regions: [frankreich, deutschland]
  themes: [politik, krieg-militaer]
  places: [strassburg]
