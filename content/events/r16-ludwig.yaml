  date: "1715-09-01"
  weight: 2
  kind: herrschaft
  summary: Der König stirbt nach 72 Jahren auf dem Thron in Versailles an Wundbrand; Nachfolger wird sein fünfjähriger Urenkel Ludwig XV., für den Philippe von Orléans die Regentschaft übernimmt, nachdem das Pariser Parlement das Testament des Königs aufgehoben hat.
  regions: [frankreich]
  themes: [politik]
