  end: "1697"
  weight: 2
  kind: krieg
  summary: Mit Erbansprüchen Liselottes von der Pfalz als Vorwand rücken französische Truppen ins Reich ein; gegen Frankreich steht bald eine Große Allianz aus Kaiser, Reichsständen, den Niederlanden, England, Spanien und Savoyen. Der Krieg wird in Europa, auf See und in den Kolonien geführt.
