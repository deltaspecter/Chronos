  summary: Nach Missernten infolge eines kalten und nassen Jahres steigen die Getreidepreise drastisch; Hunger und Seuchen töten in Frankreich nach Schätzungen über eine Million Menschen, oft wird eine Zahl um 1,3 Millionen genannt.
