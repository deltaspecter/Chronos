  date: "1697-09-20"
  weight: 3
  kind: vertrag
  summary: Frankreich schließt Frieden mit den Niederlanden, England und Spanien, im Oktober auch mit dem Kaiser; es gibt die meisten Reunionen heraus, behält aber Straßburg und erkennt Wilhelm III. als König von England an. Der Westteil Hispaniolas (Saint-Domingue) bleibt faktisch französisch.
  regions: [westeuropa, mitteleuropa]
