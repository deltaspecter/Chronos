  date: "1598-04-13"
  weight: 2
  kind: gesetz
  summary: Heinrich IV. beendet die Religionskriege, indem er den Reformierten Gewissensfreiheit, begrenzte Kultfreiheit, Zugang zu Ämtern und befristet Sicherheitsplätze gewährt; der Katholizismus bleibt Staatsreligion.
  regions: [frankreich]
  themes: [religion, verfassung-recht]
  places: [nantes]
  persons: [heinrich-iv]
  polities: [koenigreich-frankreich]
- id: fronde
  title: Fronde
  start: "1648"
  end: "1653"
  weight: 2
  kind: revolution
  summary: Aufstände gegen die Regentschaft Annas von Österreich und Kardinal Mazarins, zunächst getragen vom Pariser Parlement (1648/49), dann von Hochadligen um den Prinzen von Condé (1650–1653); der Hof muss im Januar 1649 aus Paris fliehen. Das Scheitern der zerstrittenen Gegner stärkte langfristig die Krone.
  regions: [frankreich]
  themes: [politik, revolutionen]
  places: [paris, saint-germain-en-laye]
  persons: [anna-von-oesterreich, jules-mazarin, grosser-conde, ludwig-xiv]
  polities: [koenigreich-frankreich]
- id: pyrenaeenfrieden
  title: Pyrenäenfrieden
  date: "1659-11-07"
  weight: 2
  kind: vertrag
  summary: Frankreich und Spanien beenden auf der Fasaneninsel im Grenzfluss Bidassoa ihren seit 1635 andauernden Krieg; Frankreich gewinnt das Roussillon und das Artois, Ludwig XIV. heiratet 1660 die Infantin Maria Theresia.
  regions: [frankreich, iberische-halbinsel]
  themes: [politik, krieg-militaer]
  persons: [jules-mazarin, ludwig-xiv, maria-theresia-von-spanien]
  polities: [koenigreich-frankreich, spanische-monarchie]
- id: herrschaftsantritt-ludwig-xiv-1661
  title: Beginn der Selbstregierung Ludwigs XIV.
  date: "1661-03-10"
  weight: 2
  kind: herrschaft
  summary: Am Tag nach dem Tod Mazarins erklärt der 22-jährige König seinen Ministern, er werde künftig selbst regieren und keinen leitenden Minister mehr ernennen.
  regions: [frankreich]
  themes: [politik]
  places: [paris]
  persons: [ludwig-xiv, jules-mazarin]
  polities: [koenigreich-frankreich]
- id: verhaftung-fouquets-1661
  title: Verhaftung Nicolas Fouquets
  date: "1661-09-05"
  weight: 3
  kind: ereignis
  summary: Der Oberintendant der Finanzen wird in Nantes auf Befehl des Königs festgenommen; der folgende Prozess endet 1664 mit Verbannung, die der König in lebenslange Haft umwandelt. Colbert übernimmt die Leitung der Finanzen.
  regions: [frankreich]
  themes: [politik, wirtschaft-handel]
  places: [nantes, vaux-le-vicomte]
  persons: [nicolas-fouquet, jean-baptiste-colbert, ludwig-xiv]
  polities: [koenigreich-frankreich]
- id: compagnie-des-indes-orientales-1664
  title: Gründung der Französischen Ostindienkompanie
  date: "1664"
  weight: 3
  kind: gruendung
  summary: Auf Betreiben Colberts entsteht eine privilegierte Handelsgesellschaft für den Asienhandel nach niederländischem Vorbild; im selben Jahr wird auch eine Westindienkompanie für den Atlantikhandel gegründet.
  regions: [frankreich, indischer-ozean]
  themes: [wirtschaft-handel, handelsnetze]
  persons: [jean-baptiste-colbert]
  polities: [koenigreich-frankreich]
- id: devolutionskrieg
  title: Devolutionskrieg
  start: "1667-05"
  end: "1668-05-02"
  weight: 2
  kind: krieg
  summary: Unter Berufung auf ein brabantisches Erbrecht zugunsten seiner Frau Maria Theresia fällt Ludwig XIV. in die Spanischen Niederlande ein; eine Allianz der Niederlande, Englands und Schwedens drängt zum Frieden.
  regions: [westeuropa]
  themes: [krieg-militaer, politik]
  places: [lille]
  persons: [ludwig-xiv, maria-theresia-von-spanien]
  polities: [koenigreich-frankreich, spanische-monarchie]
- id: frieden-von-aachen-1668
  title: Frieden von Aachen (1668)
  date: "1668-05-02"
  weight: 3
  kind: vertrag
  summary: Spanien tritt im Frieden zum Devolutionskrieg zwölf flandrische Städte und Festungen, darunter Lille, an Frankreich ab; die Franche-Comté erhält es zurück.
  regions: [westeuropa]
  themes: [politik]
  places: [aachen, lille]
  polities: [koenigreich-frankreich, spanische-monarchie]
- id: hollaendischer-krieg
  title: Holländischer Krieg
  start: "1672-04"
  end: "1679"
  weight: 2
  kind: krieg
  summary: Frankreich greift im Bund mit England, Köln und Münster die Republik der Vereinigten Niederlande an; die Niederländer öffnen die Deiche, Wilhelm III. von Oranien wird Statthalter, und Kaiser, Spanien und Brandenburg treten auf ihrer Seite in den Krieg ein.
  regions: [westeuropa, mitteleuropa]
  themes: [krieg-militaer, politik]
  persons: [ludwig-xiv, wilhelm-iii-von-oranien, grosser-conde, louvois]
  polities: [koenigreich-frankreich, republik-der-vereinigten-niederlande, spanische-monarchie, heiliges-roemisches-reich, brandenburg-preussen]
- id: frieden-von-nimwegen
  title: Frieden von Nimwegen
  start: "1678-08-10"
  end: "1679-02-05"
  weight: 3
  kind: vertrag
  summary: Eine Reihe von Verträgen beendet den Holländischen Krieg; die Niederlande verlieren kein Gebiet, Spanien tritt die Franche-Comté und weitere Grenzorte an Frankreich ab.
  regions: [westeuropa]
  themes: [politik]
  places: [nimwegen]
  polities: [koenigreich-frankreich, republik-der-vereinigten-niederlande, spanische-monarchie, heiliges-roemisches-reich]
- id: reunionen
  title: Reunionen
  start: "1679"
  end: "1684-08-15"
  weight: 2
  kind: ereignis
  summary: Eigens eingerichtete Kammern in Metz, Breisach und Besançon erklären Gebiete, die einst von Orten unter französischer Herrschaft abhängig gewesen waren, für französisch; Truppen besetzen sie. Der Regensburger Stillstand von 1684 erkennt die Erwerbungen vorläufig für 20 Jahre an.
  regions: [frankreich, deutschland]
  themes: [politik, verfassung-recht]
  places: [strassburg]
  persons: [ludwig-xiv]
  polities: [koenigreich-frankreich, heiliges-roemisches-reich]
