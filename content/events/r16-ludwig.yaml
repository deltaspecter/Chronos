  title: Verwüstung der Pfalz
  start: "1688-12"
  end: "1693"
  weight: 2
  kind: ereignis
  summary: Um eine Sperrzone vor der Grenze zu schaffen, lassen französische Heerführer auf Befehl aus Versailles Städte und Dörfer in Pfalz und Baden niederbrennen, darunter 1689 Mannheim, Heidelberg, Speyer und Worms; Heidelberg und sein Schloss werden 1693 erneut zerstört.
  regions: [deutschland]
  themes: [krieg-militaer, gewalt-genozid]
