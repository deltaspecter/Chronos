- id: kongress-von-troppau
  title: Kongress von Troppau
  start: "1820-10"
  end: "1820-12"
  weight: 3
  kind: ereignis
  summary: Unter dem Eindruck der Revolutionen in Spanien, Portugal und Neapel beanspruchen Österreich, Russland und Preußen im Troppauer Protokoll das Recht, gegen revolutionär veränderte Staaten einzuschreiten; Großbritannien und Frankreich schließen sich nicht an.
