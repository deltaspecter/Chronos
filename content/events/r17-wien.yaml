- id: kongress-von-verona
  title: Kongress von Verona
  start: "1822-10"
  end: "1822-12"
  weight: 3
  kind: ereignis
  summary: Letzter der großen Kongresse; die Ostmächte unterstützen eine französische Intervention gegen die liberale Regierung in Spanien, während Großbritannien unter seinem neuen Außenminister Canning auf Distanz geht – das Ende des gemeinsamen Kongresssystems.
