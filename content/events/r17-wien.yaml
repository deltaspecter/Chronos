- id: abdankung-napoleons-1814
  title: Erste Abdankung Napoleons
  date: "1814-04-06"
  weight: 2
  kind: ereignis
  summary: Nach dem Einzug der Verbündeten in Paris dankt Napoleon in Fontainebleau ab; der Vertrag von Fontainebleau überlässt ihm die Insel Elba als souveränes Fürstentum, in Paris kehren die Bourbonen mit Ludwig XVIII. zurück.
  regions: [frankreich]
  themes: [politik]
  places: [fontainebleau, paris, elba]
  persons: [napoleon-bonaparte, ludwig-xviii, talleyrand]
  polities: [erstes-franzoesisches-kaiserreich, frankreich-restauration]
- id: erster-pariser-frieden
  title: Erster Pariser Frieden
  date: "1814-05-30"
  weight: 2
  kind: vertrag
  summary: Die Verbündeten schließen mit dem bourbonischen Frankreich einen milden Frieden – Frankreich behält im Wesentlichen die Grenzen von 1792, zahlt keine Kriegsentschädigung und erhält die meisten Kolonien zurück; ein Kongress in Wien soll die übrigen Fragen regeln.
  regions: [europa, frankreich]
  themes: [politik, verfassung-recht]
  places: [paris]
  persons: [talleyrand, castlereagh, klemens-von-metternich, ludwig-xviii]
  polities: [frankreich-restauration, vereinigtes-koenigreich, russisches-kaiserreich, habsburgermonarchie, koenigreich-preussen]
- id: geheimbuendnis-januar-1815
  title: Geheimbündnis vom 3. Januar 1815
  date: "1815-01-03"
  weight: 3
  kind: vertrag
  summary: Auf dem Höhepunkt der polnisch-sächsischen Krise verpflichten sich Österreich, Großbritannien und Frankreich in einem geheimen Defensivbündnis zu gegenseitigem Beistand gegen Russland und Preußen; kurz darauf lenken beide Mächte ein.
  regions: [europa]
  themes: [politik]
  places: [wien]
  persons: [klemens-von-metternich, castlereagh, talleyrand]
  polities: [habsburgermonarchie, vereinigtes-koenigreich, frankreich-restauration]
- id: erklaerung-sklavenhandel-1815
  title: Erklärung des Wiener Kongresses gegen den Sklavenhandel
  date: "1815-02-08"
  weight: 2
  kind: vertrag
  summary: Auf britischen Druck erklären die acht Signatarmächte des Pariser Friedens den transatlantischen Sklavenhandel für unvereinbar mit den Grundsätzen der Menschlichkeit und versprechen seine Abschaffung, ohne jedoch einen Termin festzulegen; die Erklärung wird der Schlussakte beigefügt.
  regions: [europa, atlantik, westafrika]
  themes: [sklaverei-unfreiheit, verfassung-recht]
  places: [wien]
  persons: [castlereagh, william-wilberforce]
  polities: [vereinigtes-koenigreich, frankreich-restauration, koenigreich-portugal]
- id: herrschaft-der-hundert-tage
  title: Herrschaft der Hundert Tage
  start: "1815-03-01"
  end: "1815-07-08"
  dateNote: Gezählt wird meist vom Einzug in Paris am 20. März bis zur Rückkehr Ludwigs XVIII. am 8. Juli; Napoleon landete am 1. März bei Antibes.
  weight: 2
  kind: herrschaft
  summary: Napoleon verlässt Elba, landet an der Mittelmeerküste und übernimmt ohne Kampf wieder die Macht in Paris; die in Wien versammelten Mächte erklären ihn am 13. März für vogelfrei und erneuern ihr Kriegsbündnis, bis er bei Waterloo geschlagen wird.
  regions: [frankreich, westeuropa]
  themes: [politik, krieg-militaer]
  places: [elba, paris, waterloo, wien]
  persons: [napoleon-bonaparte, ludwig-xviii, wellington, gebhard-leberecht-von-bluecher]
  polities: [erstes-franzoesisches-kaiserreich, frankreich-restauration]
- id: deutsche-bundesakte
  title: Deutsche Bundesakte
  date: "1815-06-08"
  weight: 2
  kind: vertrag
  summary: Die deutschen Fürsten und Freien Städte gründen den Deutschen Bund als lockeren Staatenbund mit einer Bundesversammlung in Frankfurt unter österreichischem Vorsitz; Artikel 13 verspricht landständische Verfassungen, Artikel 16 regelt Religionsgleichheit der Christen und vertagt die Rechte der Juden.
  regions: [deutschland, mitteleuropa]
  themes: [verfassung-recht, politik]
  places: [wien, frankfurt]
  persons: [klemens-von-metternich, karl-august-von-hardenberg, wilhelm-von-humboldt]
  polities: [deutscher-bund, habsburgermonarchie, koenigreich-preussen, koenigreich-sachsen, koenigreich-bayern]
- id: schlussakte-wiener-kongress
  title: Schlussakte des Wiener Kongresses
  date: "1815-06-09"
  weight: 1
  kind: vertrag
  summary: Die Wiener Kongressakte fasst in 121 Artikeln die territorialen Regelungen des Kongresses zusammen – von Polen, Sachsen und den Niederlanden über den Deutschen Bund bis zu Italien und der Schweiz – und ist bis 1914 die Grundlage der europäischen Staatenordnung.
  regions: [europa]
  themes: [verfassung-recht, politik]
  places: [wien]
  persons: [klemens-von-metternich, castlereagh, talleyrand, karl-august-von-hardenberg, karl-robert-von-nesselrode]
  polities: [habsburgermonarchie, vereinigtes-koenigreich, russisches-kaiserreich, koenigreich-preussen, frankreich-restauration, kongresspolen, deutscher-bund]
- id: heilige-allianz
  title: Heilige Allianz
  date: "1815-09-26"
  weight: 2
  kind: vertrag
  summary: Auf Initiative Alexanders I. versprechen der Zar, Kaiser Franz I. und Friedrich Wilhelm III., ihre Herrschaft nach den Grundsätzen der christlichen Religion zu führen und einander als Brüder beizustehen; fast alle christlichen Monarchen Europas treten bei, nicht aber Großbritannien und der Papst.
  regions: [europa]
  themes: [politik, religion]
  places: [paris]
  persons: [alexander-i, franz-ii, friedrich-wilhelm-iii, klemens-von-metternich]
  polities: [russisches-kaiserreich, habsburgermonarchie, koenigreich-preussen]
- id: zweiter-pariser-frieden
  title: Zweiter Pariser Frieden
  date: "1815-11-20"
  weight: 2
  kind: vertrag
  summary: Nach den Hundert Tagen muss Frankreich weitere Grenzgebiete wie Saarlouis und Landau abtreten, eine Kriegsentschädigung von 700 Millionen Francs zahlen und eine Besatzung von bis zu fünf Jahren hinnehmen.
  regions: [frankreich, europa]
  themes: [politik, verfassung-recht]
  places: [paris]
  persons: [ludwig-xviii, castlereagh, wellington]
  polities: [frankreich-restauration, vereinigtes-koenigreich, russisches-kaiserreich, habsburgermonarchie, koenigreich-preussen]
- id: quadrupelallianz-1815
  title: Quadrupelallianz
  date: "1815-11-20"
  weight: 2
  kind: vertrag
  summary: Am Tag des Zweiten Pariser Friedens erneuern Großbritannien, Russland, Österreich und Preußen ihr Bündnis gegen eine Rückkehr Napoleons und vereinbaren in Artikel VI regelmäßige Treffen der Herrscher oder Minister – die Grundlage des Kongresssystems.
