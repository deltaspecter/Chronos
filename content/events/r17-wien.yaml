- id: kongress-von-laibach
  title: Kongress von Laibach
  start: "1821-01"
  end: "1821-05"
  weight: 3
  kind: ereignis
  summary: Fortsetzung von Troppau unter Beteiligung König Ferdinands von Neapel; die Ostmächte ermächtigen Österreich zum militärischen Eingreifen, worauf österreichische Truppen die Verfassungsbewegungen in Neapel und Piemont niederwerfen.
