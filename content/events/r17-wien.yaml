# Ereignisse: Wiener Kongress
- id: vertrag-von-chaumont
  title: Vertrag von Chaumont
  date: "1814-03"
  dateNote: Auf den 1. März 1814 datiert, nach verbreiteter Angabe einige Tage später unterzeichnet.
  weight: 3
  kind: vertrag
  summary: Großbritannien, Russland, Österreich und Preußen verpflichten sich, den Krieg gegen Napoleon gemeinsam bis zum Sieg zu führen und ihr Bündnis zwanzig Jahre lang aufrechtzuerhalten; Großbritannien sagt hohe Subsidien zu.
  regions: [europa, frankreich]
  themes: [politik, krieg-militaer]
