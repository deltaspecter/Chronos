- id: karlsbader-beschluesse
  title: Karlsbader Beschlüsse
  date: "1819-09-20"
  dateNote: Im August 1819 in Karlsbad ausgehandelt, am 20. September vom Bundestag in Frankfurt angenommen.
  weight: 2
  kind: gesetz
  summary: Nach der Ermordung des Schriftstellers August von Kotzebue setzt Metternich im Deutschen Bund Pressezensur, die Überwachung der Universitäten, das Verbot der Burschenschaften und eine Untersuchungskommission gegen „demagogische Umtriebe“ durch.
  regions: [deutschland]
  themes: [politik, schrift-medien]
  places: [frankfurt]
