- id: kongress-von-aachen
  title: Kongress von Aachen
  start: "1818-09"
  end: "1818-11"
  weight: 3
  kind: ereignis
  summary: Erster Kongress der Großmächte nach 1815; beschließt den vorzeitigen Abzug der Besatzungstruppen aus Frankreich und nimmt Frankreich in den Kreis der Großmächte auf, aus der Quadrupel- wird faktisch eine Quintupelallianz.
