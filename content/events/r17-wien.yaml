- id: franzoesische-intervention-spanien-1823
  title: Französische Intervention in Spanien
  start: "1823-04"
  end: "1823-10"
  weight: 3
  kind: krieg
  summary: Ein französisches Heer, die sogenannten „Hunderttausend Söhne des heiligen Ludwig“, beendet das liberale Verfassungsregime in Spanien und setzt Ferdinand VII. wieder als absoluten König ein; Großbritannien und die USA wenden sich gegen eine Ausweitung der Intervention auf Lateinamerika.
  regions: [iberische-halbinsel, frankreich]
  themes: [krieg-militaer, revolutionen]
  persons: [george-canning]
