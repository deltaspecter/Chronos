- id: kulturkampf
  title: Kulturkampf
  start: "1871"
  end: "1887"
  dateNote: Die Kampfgesetze entstanden 1871–1875; die Friedensgesetze von 1886/87 bauten sie großenteils ab.
  weight: 2
  kind: entwicklung
  summary: Auseinandersetzung des preußischen Staats und des Reichs unter Bismarck mit der katholischen Kirche und der Zentrumspartei um Schulaufsicht, Priesterausbildung und Zivilehe; Hunderte Pfarreien blieben zeitweise unbesetzt, das katholische Milieu festigte sich aber.
