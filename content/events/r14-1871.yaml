  weight: 3
  kind: vertrag
  summary: In Versailles vereinbaren der Norddeutsche Bund und Baden, Hessen, Bayern und Württemberg deren Beitritt zu einem Deutschen Bund, der zum 1. Januar 1871 entsteht; Bayern und Württemberg erhalten Sonderrechte.
