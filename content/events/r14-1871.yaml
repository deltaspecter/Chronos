  title: Frankfurter Frieden
  date: "1871-05-10"
  weight: 2
  kind: vertrag
  summary: Frankreich tritt das Elsass ohne Belfort und den Nordosten Lothringens mit Metz an das Deutsche Reich ab und verpflichtet sich zu einer Kriegsentschädigung von fünf Milliarden Francs; bis zur Zahlung bleiben deutsche Truppen im Land.
  regions: [frankreich, deutschland]
  themes: [politik]
