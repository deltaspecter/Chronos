  date: "1871-04-16"
  dateNote: Verkündet am 16. April, in Kraft seit dem 4. Mai 1871.
  weight: 2
  kind: gesetz
  summary: Die vom ersten Reichstag beschlossene Verfassung übernimmt im Wesentlichen die norddeutsche Bundesverfassung – mit Kaiser, Bundesrat, einem nach allgemeinem Männerwahlrecht gewählten Reichstag und einem nur dem Kaiser verantwortlichen Reichskanzler; einen Grundrechtekatalog enthält sie nicht.
