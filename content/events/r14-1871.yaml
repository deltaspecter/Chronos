  title: Pariser Kommune
  aliases: [Commune de Paris]
  start: "1871-03-18"
  end: "1871-05-28"
  weight: 2
  kind: revolution
  summary: Nach dem Waffenstillstand erhebt sich Paris gegen die Regierung Thiers und wählt einen eigenen Gemeinderat mit radikal-demokratischen und sozialistischen Zielen; in der „Blutigen Woche“ im Mai schlagen Regierungstruppen die Kommune nieder, Schätzungen der Todesopfer reichen von mehreren Tausend bis über 20.000.
