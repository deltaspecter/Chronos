  date: "1870-08-18"
  weight: 3
  kind: schlacht
  summary: Die verlustreichste Schlacht des Kriegs – die deutschen Armeen erleiden schwere Verluste, drängen die französische Rheinarmee aber in die Festung Metz zurück, wo sie bis Oktober eingeschlossen bleibt.
