  date: "1862-09-30"
  weight: 3
  kind: ereignis
  summary: Eine Woche nach seiner Ernennung erklärt Bismarck vor der Budgetkommission des Abgeordnetenhauses, die großen Fragen der Zeit würden nicht durch Reden und Mehrheitsbeschlüsse, sondern durch Eisen und Blut entschieden; die Rede empört selbst Konservative.
