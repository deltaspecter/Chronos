- id: indemnitaetsgesetz-1866
  title: Indemnitätsgesetz
  date: "1866-09-03"
  dateNote: Annahme im preußischen Abgeordnetenhaus; das Gesetz wurde wenige Tage später verkündet.
  weight: 3
  kind: gesetz
  summary: Das Abgeordnetenhaus billigt nachträglich die ohne Haushaltsgesetz geleisteten Staatsausgaben seit 1862 und beendet so den Verfassungskonflikt; über die Zustimmung spaltet sich der Liberalismus, aus dem rechten Flügel entsteht die Nationalliberale Partei.
  regions: [deutschland]
  themes: [politik, verfassung-recht]
  places: [berlin]
