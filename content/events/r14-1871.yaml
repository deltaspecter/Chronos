  summary: Bismarck kürzt den Bericht über das Gespräch Wilhelms I. mit dem französischen Botschafter Benedetti in Bad Ems so, dass er wie eine schroffe Abweisung wirkt, und gibt ihn an die Presse; sechs Tage später erklärt Frankreich Preußen den Krieg.
  regions: [deutschland, frankreich]
