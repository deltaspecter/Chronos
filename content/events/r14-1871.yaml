  polities: [koenigreich-preussen]
- id: verfassung-norddeutscher-bund
  title: Verfassung des Norddeutschen Bundes
  date: "1867-04-16"
  dateNote: Vom konstituierenden Reichstag beschlossen; in Kraft seit dem 1. Juli 1867.
  weight: 3
  kind: gesetz
  summary: Der nach allgemeinem, gleichem Männerwahlrecht gewählte konstituierende Reichstag nimmt die von Bismarck entworfene Verfassung an; Bundespräsidium, Bundesrat, Reichstag und ein Bundeskanzler bilden das Modell der späteren Reichsverfassung.
  regions: [deutschland]
  themes: [verfassung-recht, politik]
  places: [berlin]
  persons: [otto-von-bismarck, wilhelm-i]
  polities: [norddeutscher-bund, koenigreich-preussen]
