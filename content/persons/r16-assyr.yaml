  name: Hormuzd Rassam
  born: "1826"
  died: "1910-09-16"
  roles: [Ausgräber, Diplomat]
  summary: Aus Mossul stammender assyrischer Christ, zunächst Mitarbeiter Layards, der 1853/54 in Ninive den Nordpalast Assurbanipals mit den Reliefs der Löwenjagd und vielen Tafeln der Bibliothek entdeckte; sein Anteil wurde von britischen Zeitgenossen oft heruntergespielt.
  regions: [mesopotamien, britische-inseln]
  themes: [archaeologie]
  places: [ninive]
  related: [austen-henry-layard]
