  died: "-727"
  roles: [König von Assyrien, König von Babylon]
  summary: Assyrischer König (745–727 v. Chr.), wohl ein Usurpator, der die Provinzverwaltung neu ordnete, ein stehendes Heer aufbaute, Massendeportationen zum System machte und große Teile der Levante sowie 729 v. Chr. Babylon unmittelbar unter assyrische Herrschaft brachte; in der Bibel auch Pul genannt.
