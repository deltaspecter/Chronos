- id: paul-emile-botta
  name: Paul-Émile Botta
  born: "1802-12-06"
  died: "1870-03-29"
  roles: [Diplomat, Ausgräber]
  summary: Französischer Konsul in Mossul, der 1843 in Khorsabad den Palast Sargons II. freilegte und damit die erste große assyrische Palastanlage entdeckte; er hielt den Ort zunächst für Ninive. Seine Funde bildeten den Grundstock der assyrischen Sammlung des Louvre.
  regions: [mesopotamien, frankreich]
  themes: [archaeologie]
  places: [dur-scharrukin]
- id: austen-henry-layard
  name: Austen Henry Layard
  born: "1817-03-05"
  died: "1894-07-05"
  roles: [Ausgräber, Diplomat, Politiker]
  summary: Britischer Reisender und Archäologe, der ab 1845 in Nimrud und dann auf dem Ruinenhügel Kuyunjik in Ninive grub, Palastreliefs und Kolossalfiguren ins British Museum brachte und mit seinen Büchern eine europäische Assyrien-Begeisterung auslöste; später Politiker und Botschafter.
  regions: [mesopotamien, britische-inseln]
  themes: [archaeologie]
  places: [kalchu, ninive]
  related: [hormuzd-rassam, paul-emile-botta]
