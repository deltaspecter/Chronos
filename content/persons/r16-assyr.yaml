  died: "-824"
  roles: [König von Assyrien]
  summary: Sohn Assurnasirpals II. und assyrischer König (858–824 v. Chr.), der fast jedes Jahr Krieg führte, 853 v. Chr. bei Qarqar auf eine syrisch-levantinische Koalition traf und auf dem Schwarzen Obelisken den Tribut König Jehus von Israel darstellen ließ; am Ende seiner Regierung erschütterte ein Aufstand das Reich.
