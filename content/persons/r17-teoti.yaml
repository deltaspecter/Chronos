# Personen: Teotihuacan (Runde 17)
- id: jatzom-kuy
  name: Jatz'om Kuy
  aliases: [Speerwerfer-Eule, Spearthrower Owl, „Eulen-Speerschleuder“]
  died: "439"
  roles: [Herrscher]
  certainty: unsicher
  summary: In Maya-Inschriften genannter Herrscher, dessen Namenszeichen eine Eule mit Speerschleuder zeigt; laut einer Inschrift in Tikal kam er 374 an die Macht, sein Sohn Yax Nuun Ahiin wurde 379 König von Tikal. Ob er in Teotihuacan selbst regierte, ist umstritten.
  regions: [mesoamerika]
  themes: [politik]
  places: [teotihuacan, tikal]
  related: [yax-nuun-ahiin-i, sihyaj-kahk]
- id: yax-nuun-ahiin-i
  name: Yax Nuun Ahiin I.
  aliases: [Yax Nuun Ayiin, Curl Nose, Curl Snout]
  died: "~404"
  roles: [König von Tikal]
  summary: Herrscher von Tikal ab 379, als Sohn Jatz'om Kuys nach der „Ankunft“ Sihyaj K'ahk's eingesetzt; auf Stele 31 und älteren Monumenten in Kriegertracht im Stil Teotihuacans dargestellt.
  regions: [mesoamerika]
  themes: [politik]
  places: [tikal]
  related: [jatzom-kuy, sihyaj-kahk, chak-tok-ichaak-i]
- id: chak-tok-ichaak-i
  name: Chak Tok Ich'aak I.
  aliases: [Jaguar Paw, Großer Jaguarpranke]
  died: "378-01"
  roles: [König von Tikal]
  summary: König von Tikal, der laut den Inschriften am Tag der Ankunft Sihyaj K'ahk's im Januar 378 starb; mit ihm endete die ältere Linie der Dynastie vorübergehend.
  regions: [mesoamerika]
  themes: [politik]
  places: [tikal]
  related: [sihyaj-kahk]
- id: kinich-yax-kuk-mo
  name: K'inich Yax K'uk' Mo'
  aliases: [Yax K'uk' Mo']
  died: "~437"
  roles: [König von Copán, Dynastiegründer]
  summary: Begründer der klassischen Dynastie von Copán (426/427), der später mit den Brillenaugen des Sturmgottes von Teotihuacan dargestellt wurde; Isotopenuntersuchungen seines mutmaßlichen Skeletts sprechen eher für eine Herkunft aus dem zentralen Maya-Tiefland.
  regions: [mesoamerika]
  themes: [politik]
  places: [copan]
