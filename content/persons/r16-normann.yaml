  aliases: [Godwine, Earl Godwin]
  died: "1053"
  roles: [Earl von Wessex]
  summary: Unter Knut dem Großen aufgestiegener Earl von Wessex, der mächtigste Mann Englands unter Eduard dem Bekenner und Vater Harolds, Tostigs und der Königin Edith. 1051 wurde er mit seiner Familie verbannt, kehrte 1052 mit Waffengewalt zurück und erzwang seine Wiedereinsetzung.
  regions: [britische-inseln]
