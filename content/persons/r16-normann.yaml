  name: Edgar Ætheling
  aliases: [Edgar Atheling, Eadgar]
  born: "~1052"
  roles: [Thronprätendent]
  summary: Großneffe Eduards des Bekenners und letzter männlicher Angehöriger des westsächsischen Königshauses; nach Hastings von den Großen in London zum König ausgerufen, unterwarf er sich jedoch Wilhelm. Er beteiligte sich an den Aufständen von 1069 und lebte bis weit ins 12. Jahrhundert; sein Todesjahr ist nicht sicher bekannt.
  regions: [britische-inseln]
  themes: [politik]
  places: [london]
