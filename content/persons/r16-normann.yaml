  name: Morcar von Northumbrien
  aliases: [Morcar]
  roles: [Earl von Northumbrien]
  summary: Bruder Edwins von Mercia, den die aufständischen Northumbrier 1065 an Stelle Tostigs zum Earl wählten. Nach der Eroberung schloss er sich 1071 dem Widerstand in Ely an, geriet in Gefangenschaft und blieb bis zum Tod Wilhelms 1087 in Haft; sein Todesjahr ist unbekannt.
