  aliases: [Odo of Bayeux, Odo von Conteville]
  born: "~1035?"
  died: "1097"
  roles: [Bischof von Bayeux, Earl von Kent]
  summary: Halbbruder Wilhelms des Eroberers, seit etwa 1049 Bischof von Bayeux, Teilnehmer der Schlacht bei Hastings und danach Earl von Kent und einer der reichsten Grundherren Englands. Er gilt als wahrscheinlicher Auftraggeber des Teppichs von Bayeux. 1082 ließ Wilhelm ihn verhaften; er starb auf dem Weg zum Ersten Kreuzzug in Palermo.
