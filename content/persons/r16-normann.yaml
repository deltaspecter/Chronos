  aliases: [Eadwine]
  died: "1071"
  roles: [Earl von Mercia]
  summary: Seit 1062 Earl von Mercia und Bruder Morcars; beide unterlagen am 20. September 1066 bei Fulford dem norwegischen Heer. Nach Hastings unterwarf er sich Wilhelm, rebellierte aber 1068 und erneut 1071 und wurde auf der Flucht von eigenen Gefolgsleuten getötet.
