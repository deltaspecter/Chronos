# Personen: Die normannische Eroberung Englands 1066
- id: eduard-der-bekenner
  name: Eduard der Bekenner
  aliases: [Edward the Confessor, Eadweard, Eduard III.]
  born: "~1004"
  died: "1066-01-05"
  roles: [König von England]
  summary: Sohn Æthelreds II. und Emmas von der Normandie, der während der dänischen Herrschaft über England rund 25 Jahre im Exil, vor allem in der Normandie, lebte und 1042 König wurde. Seine Ehe mit Edith, der Tochter Godwins, blieb kinderlos; sein Tod im Januar 1066 löste die Thronfolgekrise aus. 1161 wurde er heiliggesprochen.
  regions: [britische-inseln, frankreich]
  themes: [politik, religion]
  places: [westminster-abbey]
  related: [emma-von-der-normandie, godwin-von-wessex, harold-godwinson, wilhelm-der-eroberer]
- id: emma-von-der-normandie
  name: Emma von der Normandie
  aliases: [Ælfgifu, Emma of Normandy]
  born: "~985"
  died: "1052"
  roles: [Königin von England]
  summary: Tochter Herzog Richards I. der Normandie, nacheinander mit Æthelred II. und Knut dem Großen verheiratet und Mutter der Könige Harthaknut und Eduard des Bekenners; über sie war das englische Königshaus mit den normannischen Herzögen verwandt, worauf Wilhelm später seinen Anspruch stützte. Die Schrift Encomium Emmae Reginae entstand in ihrem Auftrag.
  regions: [britische-inseln, frankreich]
  themes: [politik]
  related: [eduard-der-bekenner, knut-der-grosse]
