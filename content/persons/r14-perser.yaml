  themes: [imperien, politik]
  places: [susa, persepolis]
  related: [xerxes-i, themistokles]
- id: kallias-ii
  name: Kallias (Sohn des Hipponikos)
  aliases: [Kallias]
  roles: [Diplomat]
  summary: Reicher athenischer Adliger, den Herodot als Gesandten in Susa erwähnt; nach späteren Quellen handelte er um 449 v. Chr. mit dem Großkönig den nach ihm benannten Frieden aus, dessen Existenz umstritten ist.
  regions: [griechenland, iran]
  themes: [politik]
  places: [athen, susa]
  related: [artaxerxes-i]
