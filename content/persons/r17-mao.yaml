  name: Lin Biao
  born: "1907-12-05"
  died: "1971-09-13"
  roles: [Marschall, Verteidigungsminister]
  summary: Erfolgreicher Feldherr des Bürgerkriegs, der 1959 Peng Dehuai als Verteidigungsminister ablöste, den Mao-Kult in der Armee förderte und 1969 als Maos Nachfolger in das Parteistatut geschrieben wurde; starb 1971 beim Absturz seines Flugzeugs in der Mongolei, nachdem er offenbar aus China geflohen war.
  regions: [china]
  themes: [krieg-militaer, politik]
  places: [oendoerkhaan]
