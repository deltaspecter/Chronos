# Personen: Maos China (1949–1976)
- id: liu-shaoqi
  name: Liu Shaoqi
  born: "1898-11-24"
  died: "1969-11-12"
  roles: [Staatspräsident der Volksrepublik China, stellvertretender Parteivorsitzender]
  summary: Führender Parteiorganisator und ab 1959 Staatspräsident, der nach dem Großen Sprung mit Deng Xiaoping eine pragmatische Erholungspolitik betrieb; in der Kulturrevolution als „Chinas Chruschtschow“ verfemt, 1968 aus der Partei ausgeschlossen, starb er 1969 in Haft in Kaifeng; 1980 rehabilitiert.
  regions: [china]
  themes: [politik]
  places: [peking, kaifeng]
- id: deng-xiaoping
  name: Deng Xiaoping
  aliases: [Teng Hsiao-p'ing]
  born: "1904-08-22"
  died: "1997-02-19"
  roles: [Generalsekretär der KP Chinas, stellvertretender Ministerpräsident]
  summary: Als Generalsekretär 1956–1966 an der Anti-Rechts-Kampagne und der Wirtschaftserholung nach dem Großen Sprung beteiligt; in der Kulturrevolution zweimal gestürzt (1966/67 und 1976), setzte er sich nach Maos Tod als führender Politiker durch und leitete ab 1978 die Reform- und Öffnungspolitik ein.
  regions: [china]
  themes: [politik, wirtschaft-handel]
  places: [peking]
