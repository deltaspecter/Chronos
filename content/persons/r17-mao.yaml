  born: "1914"
  died: "1991-05-14"
  roles: [Schauspielerin, Politikerin]
  summary: Frühere Schauspielerin aus Shanghai und seit 1938 Maos Ehefrau, die in der Kulturrevolution die Kulturpolitik bestimmte („Musterrevolutionsopern“) und zur führenden Figur der „Viererbande“ wurde; 1976 verhaftet, 1981 zum Tode verurteilt (in lebenslange Haft umgewandelt), starb sie 1991 durch Suizid.
  regions: [china]
  themes: [politik, kultur-kunst]
  places: [shanghai, peking]
