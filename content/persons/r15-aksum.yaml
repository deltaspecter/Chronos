  summary: Aksumitischer Heerführer, der um 535 die Herrschaft in Himyar an sich riss und sich gegen Kaleb behauptete; ließ 548 den Damm von Marib ausbessern und empfing Gesandte aus Byzanz und Persien. Die islamische Überlieferung verbindet ihn mit dem Zug gegen Mekka im „Jahr des Elefanten“.
