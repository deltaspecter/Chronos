- id: gewalt-genozid
  title: Massengewalt und Genozid
  icon: flame
  summary: Völkermorde, Verfolgung und Massenverbrechen – ihre Voraussetzungen, Täter, Opfer und Aufarbeitung.
  body: |
    Die Darstellung von Völkermorden verlangt besondere Sorgfalt: Sie stützt sich auf Täterdokumente, Zeugnisse von Überlebenden und die Ergebnisse von Gerichtsverfahren und Forschung. CHRONOS stellt die Perspektive und die Namen der Opfer, wo möglich, gleichberechtigt neben die Analyse der Täter.
