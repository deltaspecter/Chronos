# --- Primärquellen ---
- id: q-kolumbus-bordbuch
  kind: primaer
  authors: ["Kolumbus, Christoph"]
  title: Diario de a bordo (Bordbuch der ersten Reise)
  written: an Bord, August 1492 – März 1493
  note: Tägliche Aufzeichnungen der ersten Reise; das Original ist verloren, erhalten ist nur eine teils wörtliche, teils zusammenfassende Abschrift von Bartolomé de las Casas.
- id: q-kolumbus-brief-1493
  kind: primaer
  authors: ["Kolumbus, Christoph"]
  title: Brief über die erste Reise (an Luis de Santángel)
  written: auf der Rückfahrt, datiert 15. Februar 1493
  note: Erster Bericht über die Fahrt, 1493 in Barcelona gedruckt und in lateinischer Übersetzung rasch in ganz Europa verbreitet.
- id: q-kapitulationen-santa-fe
  kind: primaer
  authors: ["Isabella I. von Kastilien", "Ferdinand II. von Aragon"]
  title: Capitulaciones de Santa Fe
  written: Santa Fe bei Granada, 17. April 1492
  note: Vertrag der Katholischen Könige mit Kolumbus, der ihm für den Erfolg die Titel Admiral, Vizekönig und Gouverneur sowie einen Anteil an den Erträgen zusicherte.
- id: q-inter-caetera
  kind: primaer
  authors: ["Alexander VI., Papst"]
  title: Inter caetera
  written: Rom, datiert 4. Mai 1493
  note: Päpstliche Bulle, die den Katholischen Königen alle Länder westlich einer Linie 100 Leguas westlich der Azoren und Kapverden zur Herrschaft und Mission zusprach.
- id: q-vertrag-tordesillas
  kind: primaer
  authors: ["Krone Kastilien", "Krone Portugal"]
  title: Vertrag von Tordesillas
  written: Tordesillas, 7. Juni 1494
  note: Vertrag zwischen Kastilien und Portugal, der die Trennlinie auf 370 Leguas westlich der Kapverdischen Inseln verschob.
- id: q-ramon-pane
  kind: primaer
  authors: ["Pané, Ramón"]
  title: Relación acerca de las antigüedades de los indios
  written: Hispaniola, um 1498
  note: Bericht eines Ordensbruders aus dem Gefolge des Kolumbus über Glauben und Mythen der Taíno; das Original ist verloren, der Text ist in italienischer Übersetzung in der 1571 gedruckten Kolumbus-Biografie seines Sohnes Fernando erhalten.
- id: q-gesetze-burgos
  kind: primaer
  authors: ["Ferdinand II. von Aragon"]
  title: Leyes de Burgos (Ordenanzas para el tratamiento de los indios)
  written: Burgos, 27. Dezember 1512
  note: Erste allgemeine Ordnung der spanischen Krone für die Behandlung der Indigenen in der Karibik, die die Zwangsarbeit regelte, aber nicht abschaffte.
- id: q-requerimiento
  kind: primaer
  authors: ["López de Palacios Rubios, Juan"]
  title: Requerimiento
  written: Kastilien, 1513
  note: Juristisch formulierte Aufforderung an indigene Völker, sich der Kirche und der spanischen Krone zu unterwerfen, die vor Angriffen verlesen werden sollte – oft in einer für die Angesprochenen unverständlichen Sprache.
- id: q-las-casas-brevisima
  kind: primaer
  authors: ["Las Casas, Bartolomé de"]
  title: Brevísima relación de la destrucción de las Indias
  written: 1542 verfasst, 1552 in Sevilla gedruckt
  note: Anklageschrift des Dominikaners gegen die Gewalt der spanischen Eroberer, die in viele Sprachen übersetzt und von Spaniens Gegnern propagandistisch genutzt wurde.
- id: q-las-casas-historia
  kind: primaer
  authors: ["Las Casas, Bartolomé de"]
  title: Historia de las Indias
  written: ab etwa 1527 bis in die 1560er-Jahre, erst 1875–1876 gedruckt
  note: Umfangreiche Geschichte der ersten Jahrzehnte spanischer Herrschaft in der Karibik, gestützt auf eigene Erfahrung und auf Papiere des Kolumbus.
- id: q-mundus-novus
  kind: primaer
  authors: ["Vespucci, Amerigo (zugeschrieben)"]
  title: Mundus Novus
  written: um 1503 gedruckt
  note: Unter Vespuccis Namen veröffentlichter Brief über eine Fahrt entlang der Küste Südamerikas, der die entdeckten Länder als neue Welt bezeichnete; ob Vespucci ihn so verfasst hat, ist umstritten.
- id: q-waldseemueller-1507
  kind: primaer
  authors: ["Waldseemüller, Martin", "Ringmann, Matthias"]
  title: Cosmographiae Introductio, mit der Weltkarte Universalis Cosmographia
  written: Saint-Dié, 1507
  note: Einführung in die Kosmografie und große Weltkarte, auf der der Name America zum ersten Mal erscheint; von der Karte ist nur ein Exemplar erhalten.
