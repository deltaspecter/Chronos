# Quellen und Literatur: Die Einigung Italiens (Risorgimento)

# --- Primärquellen ---
- id: q-mazzini-istruzione-1831
  kind: primaer
  authors: ["Mazzini, Giuseppe"]
  title: Istruzione generale per gli affratellati nella Giovine Italia
  written: Marseille, 1831
  note: Gründungsprogramm des Geheimbunds „Junges Italien“, das ein einiges, unabhängiges und republikanisches Italien als Ziel nennt und Erziehung und Aufstand als Mittel bestimmt.
- id: q-statuto-albertino
  kind: primaer
  authors: ["Karl Albert von Sardinien"]
  title: Statuto Albertino
  subtitle: Statuto fondamentale della Monarchia di Savoia
  written: Turin, 4. März 1848
  note: Von König Karl Albert gewährte Verfassung des Königreichs Sardinien-Piemont, die nach 1861 als Verfassung des Königreichs Italien bis 1946/48 in Kraft blieb.
- id: q-dunant-1862
  kind: primaer
  authors: ["Dunant, Henry"]
  title: Un souvenir de Solférino
  place: Genf
  publisher: Imprimerie Jules-Guillaume Fick
  year: 1862
  written: Genf, 1862 (Erlebnisse vom Juni 1859)
  note: Bericht des Genfer Kaufmanns über das Leiden der Verwundeten nach der Schlacht von Solferino, mit dem Vorschlag freiwilliger Hilfsgesellschaften und eines internationalen Abkommens – Ausgangspunkt des Roten Kreuzes.
- id: q-cavour-rede-1861
  kind: primaer
  authors: ["Cavour, Camillo Benso di"]
  title: Rede in der Abgeordnetenkammer über Rom als Hauptstadt
  written: Turin, 25. und 27. März 1861
  note: Parlamentsreden, in denen Cavour Rom zur künftigen Hauptstadt Italiens erklärte und dem Papst Unabhängigkeit nach der Formel „freie Kirche im freien Staat“ anbot.
- id: q-gramsci-quaderni
  kind: primaer
  authors: ["Gramsci, Antonio"]
  editors: ["Gerratana, Valentino"]
  title: Quaderni del carcere
  subtitle: Edizione critica dell'Istituto Gramsci
  volume: 4 Bde.
  place: Turin
  publisher: Einaudi
  year: 1975
  written: Haft in Turi und Formia, 1929–1935
  note: Im Gefängnis verfasste Notizhefte Gramscis; das Heft 19 über das Risorgimento enthält seine Deutung der Einigung als „passive Revolution“ und die Kritik an der Aktionspartei.

