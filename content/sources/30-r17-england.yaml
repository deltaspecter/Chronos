# Quellen und Literatur: Englische Revolution und Glorious Revolution (r17-england)

# --- Primärquellen ---
- id: q-depositions-1641
  kind: primaer
  authors: ["Protestantische Zeuginnen und Zeugen in Irland"]
  title: The 1641 Depositions (Zeugenaussagen zum irischen Aufstand)
  written: Irland, 1641–1654
  note: Rund 8.000 eidliche Aussagen vor allem protestantischer Siedler über Gewalt, Plünderung und Vertreibung im Aufstand von 1641, heute im Trinity College Dublin aufbewahrt; wertvoll, aber parteiisch und oft auf Hörensagen gestützt.
- id: q-putney-debatten
  kind: primaer
  authors: ["Clarke, William"]
  title: Mitschrift der Debatten des Generalrats der Armee in Putney
  written: Putney bei London, 28. Oktober bis Anfang November 1647
  note: Vom Armeesekretär William Clarke stenografisch festgehaltene Diskussion zwischen Offizieren, Soldatenvertretern und Levellern über Wahlrecht, Volkssouveränität und die Zukunft der Monarchie.
- id: q-agreement-of-the-people
  kind: primaer
  authors: ["Levellers"]
  title: An Agreement of the People
  written: London, Oktober/November 1647 (weitere Fassungen 1648 und 1649)
  note: Verfassungsentwurf der Levellers, der die Souveränität des Volkes, regelmäßig gewählte Parlamente und unveräußerliche Rechte etwa der Gewissensfreiheit forderte.
- id: q-eikon-basilike
  kind: primaer
  authors: ["Karl I. (zugeschrieben)"]
  title: "Eikon Basilike: The Pourtraicture of His Sacred Majestie in His Solitudes and Sufferings"
  written: London, erschienen um den 30. Januar 1649
  note: Angeblich vom König selbst verfasste Andachts- und Rechtfertigungsschrift, die Karl I. als Märtyrer darstellte und in zahlreichen Auflagen verbreitet wurde; der Anteil des Geistlichen John Gauden an der Abfassung ist umstritten.
- id: q-cromwell-drogheda
  kind: primaer
  authors: ["Cromwell, Oliver"]
  title: Brief an William Lenthall, Sprecher des Parlaments, über die Einnahme von Drogheda
  written: Dublin, 17. September 1649
  note: Bericht Cromwells über die Erstürmung Droghedas, in dem er die Tötung der Verteidiger als gerechtes Gericht Gottes rechtfertigte; vom Parlament gedruckt verbreitet.
- id: q-hobbes-leviathan
  kind: primaer
  authors: ["Hobbes, Thomas"]
  title: "Leviathan, or the Matter, Forme and Power of a Common-Wealth Ecclesiasticall and Civill"
  written: Paris/London, 1651
  note: Staatsphilosophisches Hauptwerk, das unter dem Eindruck des Bürgerkriegs die unbedingte Unterwerfung unter einen souveränen Herrscher als einzigen Ausweg aus dem Krieg aller gegen alle begründete.
- id: q-bill-of-rights-1689
  kind: primaer
  authors: ["Parlament von England"]
  title: "An Act Declaring the Rights and Liberties of the Subject and Settling the Succession of the Crown (Bill of Rights)"
  written: Westminster, 16. Dezember 1689
  note: Gesetzliche Fassung der Declaration of Rights vom Februar 1689; zählt die Rechtsbrüche Jakobs II. auf, erklärt Suspendierung von Gesetzen, Steuern und ein stehendes Heer ohne Zustimmung des Parlaments für ungesetzlich und schließt Katholiken von der Thronfolge aus.
- id: q-toleration-act
  kind: primaer
  authors: ["Parlament von England"]
  title: "An Act for Exempting Their Majesties' Protestant Subjects Dissenting from the Church of England from the Penalties of Certain Laws (Toleration Act)"
  written: Westminster, Mai 1689
  note: Gewährte protestantischen Dissenters, die bestimmte Eide leisteten, freie Gottesdienste, schloss Katholiken und Antitrinitarier aber aus und ließ ihre Benachteiligung im öffentlichen Leben bestehen.
- id: q-locke-toleranz
  kind: primaer
  authors: ["Locke, John"]
  title: Epistola de Tolerantia (Brief über die Toleranz)
  written: Gouda, 1689 (englische Übersetzung von William Popple, London 1689)
  note: Im niederländischen Exil verfasste Schrift, die Staat und Kirche trennte und Glaubenszwang als zwecklos und unrechtmäßig verwarf – Katholiken und Atheisten nahm Locke allerdings von der Duldung aus.

