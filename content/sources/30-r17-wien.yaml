- id: q-schlussakte-1815
  kind: primaer
  title: Schlussakte des Wiener Kongresses (Acte final du Congrès de Vienne)
  written: Wien, 9. Juni 1815
  note: Französisch abgefasster Vertrag der acht Signatarmächte des Pariser Friedens mit 121 Artikeln und zahlreichen Anlagen, darunter die Deutsche Bundesakte und die Erklärung gegen den Sklavenhandel.
- id: q-bundesakte-1815
  kind: primaer
  title: Deutsche Bundesakte
  written: Wien, 8. Juni 1815
  note: Gründungsvertrag des Deutschen Bundes mit 20 Artikeln, abgedruckt u. a. in der Dokumentensammlung von Ernst Rudolf Huber.
- id: q-erklaerung-sklavenhandel-1815
  kind: primaer
  title: Erklärung der Mächte über die Abschaffung des Negerhandels
  written: Wien, 8. Februar 1815
  note: Gemeinsame Erklärung der acht Mächte, die den Sklavenhandel als Verstoß gegen Menschlichkeit und allgemeine Moral verurteilt, seine Abschaffung aber jedem Staat zu einem selbst gewählten Zeitpunkt überlässt; der zeitgenössische Titel verwendet die damals übliche, heute rassistische Bezeichnung.
- id: q-heilige-allianz-1815
  kind: primaer
  title: Vertrag der Heiligen Allianz
  written: Paris, 26. September 1815
  note: Von Zar Alexander I. entworfene, von ihm, Kaiser Franz I. und König Friedrich Wilhelm III. unterzeichnete Erklärung, die Politik nach den Geboten der christlichen Religion auszurichten.
- id: q-quadrupelallianz-1815
  kind: primaer
  title: Vertrag der Quadrupelallianz
  written: Paris, 20. November 1815
  note: Bündnisvertrag Großbritanniens, Russlands, Österreichs und Preußens, dessen Artikel VI periodische Zusammenkünfte der Herrscher oder ihrer Minister vorsah.
- id: q-castlereagh-1820
  kind: primaer
  authors: ["Castlereagh, Robert Stewart, Viscount"]
  title: State Paper vom 5. Mai 1820
  written: London, 5. Mai 1820
  note: Vertrauliche Denkschrift des britischen Außenministers an die Verbündeten, die ein allgemeines Recht der Allianz zur Intervention in innere Angelegenheiten anderer Staaten zurückwies.
