  note: Verbot sozialdemokratische Vereine, Versammlungen und Schriften; bis 1890 mehrfach verlängert.
- id: q-kaiserliche-botschaft-1881
  kind: primaer
  title: Kaiserliche Botschaft zur Sozialversicherung
  written: 17. November 1881
  note: Von Bismarck formulierte, von Wilhelm I. verlesene Botschaft an den Reichstag, die eine staatliche Versicherung der Arbeiter gegen Krankheit, Unfall, Alter und Invalidität ankündigte.

