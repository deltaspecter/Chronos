- id: q-erziehungsedikt
  kind: primaer
  title: Kaiserliches Erziehungsedikt (Kyōiku Chokugo)
  written: 30. Oktober 1890
  note: Kurzer Erlass, der Loyalität gegenüber dem Kaiser und konfuzianische Tugenden zur Grundlage der Schulbildung machte; in den Schulen regelmäßig feierlich verlesen.
- id: q-fukuzawa-1872
  kind: primaer
  authors: ["Fukuzawa Yukichi"]
  title: Gakumon no susume (Ermunterung zum Lernen)
  written: 1872–1876
  note: Vielgelesene Schriftenreihe, die mit dem Satz beginnt, der Himmel erschaffe keinen Menschen über und keinen unter einem anderen, und zu praktischem westlichem Wissen aufrief.

