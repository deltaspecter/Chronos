- id: q-cornerstone-speech
  kind: primaer
  authors: ["Stephens, Alexander H."]
  title: Rede in Savannah („Cornerstone Speech“)
  written: 21. März 1861
  note: Rede des Vizepräsidenten der Konföderation, der die Sklaverei und die angebliche Ungleichheit der Rassen als „Eckstein“ des neuen Staates bezeichnete.
- id: q-emancipation-proclamation
  kind: primaer
  authors: ["Lincoln, Abraham"]
  title: Emancipation Proclamation (Emanzipationsproklamation)
  written: Washington, 1. Januar 1863
  note: Erklärte die Versklavten in den aufständischen Gebieten für frei und erlaubte die Aufnahme schwarzer Soldaten in die Unionsarmee.
- id: q-gettysburg-address
  kind: primaer
  authors: ["Lincoln, Abraham"]
  title: Gettysburg Address
  written: Gettysburg, 19. November 1863
  note: Kurze Rede bei der Einweihung des Soldatenfriedhofs, die den Krieg als Bewährungsprobe einer Regierung „des Volkes, durch das Volk und für das Volk“ deutete.

