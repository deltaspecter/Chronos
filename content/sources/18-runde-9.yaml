- id: q-bulletins
  kind: primaer
  title: Bulletins de la Grande Armée
  written: 1805–1815
  note: Von Napoleon selbst redigierte Kriegsberichte, die in Frankreich und den verbündeten Staaten verbreitet wurden – ein Instrument der Propaganda.
