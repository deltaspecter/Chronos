- id: q-sonthonax-1793
  kind: primaer
  authors: ["Sonthonax, Léger-Félicité"]
  title: Proklamation über die allgemeine Freiheit in der Nordprovinz von Saint-Domingue
  written: Cap-Français, 29. August 1793
  note: Erklärung des französischen Zivilkommissars, die allen Versklavten der Nordprovinz die Freiheit zusprach – ein halbes Jahr vor dem Abolitionsdekret des Pariser Konvents.
- id: q-verfassung-1801
  kind: primaer
  title: Verfassung der französischen Kolonie Saint-Domingue
  written: Juli 1801
  note: Unter Toussaint Louverture erarbeitete Verfassung, die die Sklaverei für immer abschaffte und Toussaint zum Gouverneur auf Lebenszeit machte.
- id: q-haiti-unabhaengigkeit
  kind: primaer
  title: Unabhängigkeitserklärung Haitis
  written: Gonaïves, 1. Januar 1804
  note: Von Jean-Jacques Dessalines und seinen Generälen verkündete Erklärung; der erhaltene Druck wurde erst 2010 in den britischen National Archives wiederentdeckt.

