- id: q-koran
  kind: primaer
  title: Der Koran
  written: 7. Jahrhundert; nach islamischer Überlieferung unter dem Kalifen Uthman (644–656) zu einem verbindlichen Text zusammengestellt
  note: Die heilige Schrift des Islam in 114 Suren, nach islamischem Glauben die an Muhammad offenbarte Rede Gottes; zugleich die älteste und wichtigste Quelle für die Frühzeit des Islam.
- id: q-ibn-ishaq
  kind: primaer
  authors: ["Ibn Ishaq"]
  title: Sirat Rasul Allah (Das Leben des Gesandten Gottes)
  written: Mitte des 8. Jahrhunderts; überliefert in der Bearbeitung Ibn Hischams (gest. um 833)
  note: Älteste erhaltene Lebensbeschreibung Muhammads, rund 120 Jahre nach seinem Tod verfasst; sammelt mündliche Überlieferungen unterschiedlicher Verlässlichkeit.
- id: q-gemeindeordnung-medina
  kind: primaer
  title: Gemeindeordnung von Medina
  written: wohl 620er-Jahre; überliefert bei Ibn Ishaq und Abu Ubaid
  note: Vereinbarung zwischen Muhammad, seinen Anhängern und den Stämmen und jüdischen Gruppen Medinas; ihre Echtheit wird von den meisten Forschenden angenommen.
- id: q-doctrina-jacobi
  kind: primaer
  title: Doctrina Jacobi nuper baptizati
  written: um 634
  note: Griechische Streitschrift aus Palästina, die als eines der frühesten nichtmuslimischen Zeugnisse von einem bei den „Sarazenen“ aufgetretenen Propheten berichtet.

