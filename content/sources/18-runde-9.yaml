- id: gibbon-1776
  kind: sekundaer
  authors: ["Gibbon, Edward"]
  title: The History of the Decline and Fall of the Roman Empire
  place: London
  publisher: Strahan & Cadell
  year: 1776–1789
  note: Sechsbändiges Hauptwerk der aufklärerischen Geschichtsschreibung, das den Niedergang Roms unter anderem dem Christentum und der „Barbarei“ zuschrieb.
- id: q-ammianus
  kind: primaer
  authors: ["Ammianus Marcellinus"]
  title: Res gestae
  written: um 390
  note: Lateinisches Geschichtswerk eines Offiziers aus Antiochia; die erhaltenen Bücher reichen bis zur Schlacht von Adrianopel 378.
- id: q-augustinus-civitas
  kind: primaer
  authors: ["Augustinus von Hippo"]
  title: De civitate Dei (Vom Gottesstaat)
  written: 413–426
  note: Antwort des Bischofs von Hippo auf den Vorwurf, die Abkehr von den alten Göttern habe die Plünderung Roms 410 verschuldet.
- id: q-salvian
  kind: primaer
  authors: ["Salvian von Marseille"]
  title: De gubernatione Dei (Über die Weltregierung Gottes)
  written: um 440
  note: Bußpredigt eines gallischen Priesters, die römische Steuerlast und Ungerechtigkeit anprangert und behauptet, manche Römer flöhen lieber zu den „Barbaren“.
- id: q-priskos
  kind: primaer
  authors: ["Priskos von Panion"]
  title: Geschichtswerk (Fragmente), darunter der Bericht über die Gesandtschaft an den Hof Attilas
  written: nach 472
  note: Nur in Auszügen erhalten; schildert eine oströmische Gesandtschaft zu Attila im Jahr 449.
- id: q-eugippius
  kind: primaer
  authors: ["Eugippius"]
  title: Vita Sancti Severini (Leben des heiligen Severin)
  written: 511
  note: Lebensbeschreibung eines Heiligen in Noricum an der Donau, die das allmähliche Ende römischer Ordnung in einer Grenzprovinz schildert.
- id: q-jordanes
  kind: primaer
  authors: ["Jordanes"]
  title: Getica (Gotengeschichte)
  written: 551
  note: Geschichte der Goten in Konstantinopel, die auf einem verlorenen Werk Cassiodors beruht; ihre Herkunftserzählungen gelten als wenig verlässlich.

