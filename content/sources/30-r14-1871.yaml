# Quellen und Literatur: Die deutsche Reichsgründung 1871

# --- Primärquellen ---
- id: q-bismarck-1862
  kind: primaer
  authors: ["Bismarck, Otto von"]
  title: Rede vor der Budgetkommission des preußischen Abgeordnetenhauses („Blut-und-Eisen-Rede“)
  written: Berlin, 30. September 1862
  note: Ansprache des neu ernannten Ministerpräsidenten im Heereskonflikt, nur in Protokoll- und Presseberichten überliefert; berühmt durch den Satz, die großen Fragen der Zeit würden durch Eisen und Blut entschieden.
- id: q-emser-depesche-1870
  kind: primaer
  authors: ["Abeken, Heinrich", "Bismarck, Otto von"]
  title: Emser Depesche
  written: Bad Ems und Berlin, 13. Juli 1870
  note: Telegramm des Legationsrats Abeken an Bismarck über die Unterredung König Wilhelms I. mit dem französischen Botschafter Benedetti, das Bismarck gekürzt und verschärft an Presse und Gesandtschaften weitergab.
- id: q-favre-1870
  kind: primaer
  authors: ["Favre, Jules"]
  title: Rundschreiben des Außenministers der Regierung der Nationalen Verteidigung an die diplomatischen Vertreter Frankreichs
  written: Paris, 6. September 1870
  note: Erklärung der neuen republikanischen Regierung, Frankreich werde keinen Zoll seines Gebiets und keinen Stein seiner Festungen abtreten.
- id: q-reichsverfassung-1871
  kind: primaer
  title: Verfassung des Deutschen Reichs vom 16. April 1871
  written: Berlin, 16. April 1871 (Reichsgesetzblatt 1871)
  note: Verfassung des Kaiserreichs, die im Kern die Verfassung des Norddeutschen Bundes von 1867 übernahm und Kaiser, Bundesrat und Reichstag als Organe festlegte; galt bis 1918.
- id: q-marx-1871
  kind: primaer
  authors: ["Marx, Karl"]
  title: Der Bürgerkrieg in Frankreich
  subtitle: Adresse des Generalrats der Internationalen Arbeiterassoziation
  written: London, Mai 1871
  note: Zeitgenössische Deutung der Pariser Kommune aus sozialistischer Sicht, verfasst unmittelbar nach ihrer Niederschlagung.
- id: q-renan-1882
  kind: primaer
  authors: ["Renan, Ernest"]
  title: Qu’est-ce qu’une nation?
  written: Paris, Vortrag an der Sorbonne, 11. März 1882
  note: Vortrag des französischen Gelehrten, der die Nation als Willensgemeinschaft und nicht als Abstammungs- oder Sprachgemeinschaft bestimmte – auch eine Antwort auf die deutsche Begründung der Annexion Elsass-Lothringens.
- id: q-bismarck-gedanken-erinnerungen
  kind: primaer
  authors: ["Bismarck, Otto von"]
  title: Gedanken und Erinnerungen
  place: Stuttgart
  publisher: Cotta
  year: 1898
  written: Friedrichsruh, nach 1890
  note: Nach seiner Entlassung diktierte Erinnerungen Bismarcks, die seine Politik rückblickend als planvoll darstellen und mit großer Vorsicht zu lesen sind.

