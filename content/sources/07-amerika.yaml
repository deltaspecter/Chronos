- id: q-maya-inschriften
  kind: primaer
  title: Hieroglypheninschriften der klassischen Maya
  written: etwa 250–909
  note: Inschriften auf Stelen, Altären, Treppen, Türstürzen, Keramik und Wandmalereien. Sie nennen Herrscher, Geburten, Thronbesteigungen, Kriege und Rituale, jeweils nach dem Maya-Kalender datiert. Sammelnachweise bei Martin/Grube.
- id: q-dresdner-kodex
  kind: primaer
  title: Codex Dresdensis (Dresdner Maya-Handschrift)
  written: wahrscheinlich 13.–15. Jahrhundert
  note: Faltbuch aus Rindenpapier mit astronomischen Tafeln (u. a. Venus- und Finsternistafeln) und Wahrsagekalendern; Sächsische Landesbibliothek – Staats- und Universitätsbibliothek Dresden, Mscr.Dresd.R.310. Eine von nur vier erhaltenen vorspanischen Maya-Handschriften; die Datierung ist umstritten.
- id: q-landa
  kind: primaer
  authors: ["Landa, Diego de"]
  title: Relación de las cosas de Yucatán
  written: um 1566
  note: Bericht des Franziskaners und späteren Bischofs von Yucatán, der 1562 in Maní Maya-Handschriften verbrennen ließ. Sein Versuch, ein Maya-„Alphabet“ aufzuzeichnen, wurde im 20. Jahrhundert zu einem Schlüssel der Entzifferung.

