  note: Der zweite Teil („El señorío de los Incas“) behandelt Geschichte und Verwaltung des Inka-Reiches nach Befragungen in Cusco.
- id: q-xerez
  kind: primaer
  authors: ["Xerez, Francisco de"]
  title: Verdadera relación de la conquista del Perú
  written: Sevilla 1534
  note: Bericht des Sekretärs Francisco Pizarros, Augenzeuge der Gefangennahme Atahualpas in Cajamarca; eine Rechtfertigungsschrift aus Sicht der Eroberer.
- id: q-garcilaso
  kind: primaer
  authors: ["Garcilaso de la Vega, „El Inca“"]
  title: Comentarios reales de los Incas
  written: Lissabon 1609 (erster Teil)
  note: Werk des Sohnes eines spanischen Konquistadors und einer Inka-Adligen; idealisiert das Inka-Reich aus der Rückschau und aus Spanien.
- id: q-guaman-poma
  kind: primaer
  authors: ["Guaman Poma de Ayala, Felipe"]
  title: El primer nueva corónica y buen gobierno
  written: um 1615
  note: Fast 1.200 Seiten umfassende Handschrift eines andinen Autors mit fast 400 Zeichnungen, an den spanischen König gerichtet; Königliche Bibliothek Kopenhagen (GKS 2232 4°). Eine der wenigen indigenen Darstellungen der Inka-Zeit und der Kolonialherrschaft.
