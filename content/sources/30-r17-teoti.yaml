  title: Wandmalereien von Teotihuacan
  written: Teotihuacan, etwa 3.–7. Jahrhundert
  note: Auf Kalkputz gemalte Bilder in Wohnkomplexen und Tempeln (u. a. Tepantitla, Tetitla, Atetelco) mit Gottheiten, Priestern, Kriegern, Tieren und Zeichen; die wichtigste bildliche Selbstdarstellung der Stadt, da längere Texte fehlen.
- id: q-tikal-stele-31
  kind: primaer
  title: Stele 31 von Tikal
  written: Tikal, 445 n. Chr.
  note: Unter König Sihyaj Chan K'awiil II. errichtetes Monument, dessen Inschrift die Ankunft Sihyaj K'ahk's 378, die Einsetzung Yax Nuun Ahiins und den Tod Jatz'om Kuys nennt; die Seiten zeigen Yax Nuun Ahiin in Kriegertracht im Stil Teotihuacans.
