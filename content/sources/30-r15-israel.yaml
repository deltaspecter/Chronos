# --- Primärquellen ---
- id: q-herzl-1896
  kind: primaer
  authors: ["Herzl, Theodor"]
  title: Der Judenstaat
  subtitle: Versuch einer modernen Lösung der Judenfrage
  place: Leipzig und Wien
  year: 1896
  written: Wien, 1895/96
  note: Programmschrift des Wiener Journalisten, die den Antisemitismus in Europa als unlösbar beschreibt und einen eigenen Staat für die Juden fordert; Ausgangspunkt des politischen Zionismus.
- id: q-balfour-1917
  kind: primaer
  authors: ["Balfour, Arthur James"]
  title: Balfour-Deklaration
  written: London, 2. November 1917
  note: Brief des britischen Außenministers an Lord Walter Rothschild, in dem die Regierung ihr Wohlwollen für eine „nationale Heimstätte für das jüdische Volk“ in Palästina erklärt, unter Wahrung der Rechte der nichtjüdischen Bevölkerung.
- id: q-mandat-palaestina-1922
  kind: primaer
  authors: ["Völkerbund"]
  title: Mandat für Palästina
  written: London, 24. Juli 1922 (Bestätigung durch den Völkerbundsrat)
  note: Mandatstext, der Großbritannien die Verwaltung Palästinas übertrug und die Balfour-Deklaration in seine Präambel aufnahm.
- id: q-peel-1937
  kind: primaer
  authors: ["Palestine Royal Commission"]
  title: Palestine Royal Commission Report
  subtitle: Cmd. 5479
  place: London
  publisher: His Majesty’s Stationery Office
  year: 1937
  written: London, Juli 1937
  note: Bericht der Peel-Kommission, der das Mandat für undurchführbar erklärte und erstmals eine Teilung Palästinas empfahl.
- id: q-weissbuch-1939
  kind: primaer
  authors: ["Britische Regierung"]
  title: Palestine – Statement of Policy (Weißbuch)
  subtitle: Cmd. 6019
  place: London
  publisher: His Majesty’s Stationery Office
  year: 1939
  written: London, Mai 1939
  note: Regierungserklärung, die die jüdische Einwanderung auf 75.000 Personen in fünf Jahren begrenzte und einen unabhängigen Staat Palästina binnen zehn Jahren in Aussicht stellte.
- id: q-un-res-181
  kind: primaer
  authors: ["Generalversammlung der Vereinten Nationen"]
  title: Resolution 181 (II) – Künftige Regierung Palästinas
  written: Lake Success, New York, 29. November 1947
  note: Teilungsplan, der einen jüdischen und einen arabischen Staat in Wirtschaftsunion sowie ein international verwaltetes Jerusalem vorsah.
- id: q-israel-unabhaengigkeit-1948
  kind: primaer
  authors: ["Jüdischer Volksrat"]
  title: Erklärung über die Gründung des Staates Israel
  written: Tel Aviv, 14. Mai 1948
  note: Von David Ben-Gurion verlesene Unabhängigkeitserklärung, die sich auf die historische Verbindung des jüdischen Volkes zum Land, den Holocaust und den UN-Beschluss beruft.
- id: q-un-res-194
  kind: primaer
  authors: ["Generalversammlung der Vereinten Nationen"]
  title: Resolution 194 (III) – Palästina, Fortschrittsbericht des UN-Vermittlers
  written: Paris, 11. Dezember 1948
  note: Resolution, deren Absatz 11 die Rückkehr rückkehrwilliger Flüchtlinge, die in Frieden mit ihren Nachbarn leben wollen, oder ihre Entschädigung forderte.
- id: q-zurayk-1948
  kind: primaer
  authors: ["Zurayk, Constantin"]
  title: Ma'na an-Nakba (Die Bedeutung der Katastrophe)
  place: Beirut
  year: 1948
  written: Beirut, August 1948
  note: Schrift des syrischen Historikers, die die arabische Niederlage von 1948 als „Nakba“ deutete und damit den Begriff prägte.
