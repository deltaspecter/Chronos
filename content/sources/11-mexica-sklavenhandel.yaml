  title: The Interesting Narrative of the Life of Olaudah Equiano, or Gustavus Vassa, the African
  written: London 1789
  note: Autobiografie eines ehemals Versklavten, der sich freikaufte und in London zu einer Stimme der Abolitionsbewegung wurde; eines der einflussreichsten Zeugnisse der Zeit.
- id: q-brookes
  kind: primaer
  title: Description of a Slave Ship (Plan des Sklavenschiffs „Brooks“)
  written: 1788/89
  note: Von Abolitionisten in Plymouth und London verbreitete Zeichnung, die zeigt, wie Hunderte Menschen im Unterdeck eines Liverpooler Sklavenschiffs zusammengepfercht wurden; eine der wirkungsvollsten Bildquellen der Abolitionsbewegung.
- id: q-afonso-kongo
  kind: primaer
  authors: ["Afonso I. (Nzinga Mbemba), König von Kongo"]
  title: Briefe an König João III. von Portugal
  written: "1526"
  note: Der christliche König des Kongo beklagt, dass portugiesische Händler Menschen aus seinem Reich, darunter Adlige, rauben und versklaven, und verlangt Kontrolle über den Handel.
- id: q-code-noir
  kind: primaer
  title: Code noir (Ordonnance sur les esclaves des îles de l'Amérique)
  written: "1685"
  note: Französisches Edikt, das die Sklaverei in den Kolonien rechtlich regelte und Versklavte als bewegliches Eigentum definierte.
