- id: q-cortes
  kind: primaer
  authors: ["Cortés, Hernán"]
  title: Cartas de relación
  written: 1519–1526
  note: Fünf Berichtsbriefe an Kaiser Karl V., in denen Cortés sein eigenmächtiges Vorgehen rechtfertigt; der zweite und dritte Brief erschienen schon 1522/23 im Druck.
- id: q-diaz-del-castillo
  kind: primaer
  authors: ["Díaz del Castillo, Bernal"]
  title: Historia verdadera de la conquista de la Nueva España
  written: um 1568 abgeschlossen, gedruckt 1632
  note: Erinnerungen eines Teilnehmers der Eroberung, Jahrzehnte später im Alter niedergeschrieben – lebendig, aber nicht immer zuverlässig.
- id: q-florentiner-kodex
  kind: primaer
  authors: ["Bernardino de Sahagún", "Nahua-Mitarbeiter"]
  title: Historia general de las cosas de Nueva España (Florentiner Kodex)
  written: um 1575–1577
  note: Zweisprachige Enzyklopädie (Nahuatl und Spanisch) mit über 2.000 Bildern, erarbeitet von dem Franziskaner Sahagún mit indigenen Gelehrten und Schreibern; Buch XII schildert die Eroberung aus Sicht von Nahua aus Tlatelolco. Biblioteca Medicea Laurenziana, Florenz.
- id: q-codex-mendoza
  kind: primaer
  title: Codex Mendoza
  written: um 1541/42
  note: Bilderhandschrift indigener Maler mit spanischen Erläuterungen, die Geschichte, Tributlisten und Alltagsleben der Mexica darstellt; Bodleian Library, Oxford.

