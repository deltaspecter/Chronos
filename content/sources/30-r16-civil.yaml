# Quellen und Literatur: Die Bürgerrechtsbewegung in den USA (r16-civil)

# --- Primärquellen ---
- id: q-plessy-1896
  kind: primaer
  authors: ["Supreme Court of the United States"]
  title: Plessy v. Ferguson, 163 U.S. 537
  written: Washington, D.C., 18. Mai 1896
  note: Urteil des Obersten Gerichtshofs, das die Rassentrennung in Eisenbahnwagen Louisianas für verfassungsgemäß erklärte, sofern die Einrichtungen „gleichwertig“ seien – Grundlage der Doktrin „separate but equal“.
- id: q-wells-1892
  kind: primaer
  authors: ["Wells, Ida B."]
  title: Southern Horrors
  subtitle: Lynch Law in All Its Phases
  place: New York
  year: 1892
  written: New York, 1892
  note: Flugschrift der Journalistin Ida B. Wells, die anhand von Zeitungsberichten zeigte, dass Lynchmorde in den Südstaaten meist mit erfundenen Vergewaltigungsvorwürfen gerechtfertigt wurden.
- id: q-du-bois-1903
  kind: primaer
  authors: ["Du Bois, W. E. B."]
  title: The Souls of Black Folk
  subtitle: Essays and Sketches
  place: Chicago
  publisher: A. C. McClurg
  year: 1903
  written: Atlanta, 1897–1903
  note: Essaysammlung des Soziologen W. E. B. Du Bois, die das „doppelte Bewusstsein“ Schwarzer Amerikaner beschrieb und die Anpassungsstrategie Booker T. Washingtons kritisierte.
- id: q-brown-1954
  kind: primaer
  authors: ["Supreme Court of the United States"]
  title: Brown v. Board of Education of Topeka, 347 U.S. 483
  written: Washington, D.C., 17. Mai 1954
  note: Einstimmiges Urteil unter dem Vorsitz von Earl Warren, das die Rassentrennung an öffentlichen Schulen für verfassungswidrig erklärte.
- id: q-king-birmingham-1963
  kind: primaer
  authors: ["King, Martin Luther, Jr."]
  title: Letter from Birmingham Jail
  written: Birmingham, Alabama, 16. April 1963
  note: Im Gefängnis verfasster offener Brief, in dem King auf die Kritik weißer Geistlicher antwortete und gewaltfreie direkte Aktionen sowie das Brechen ungerechter Gesetze rechtfertigte.
- id: q-king-1963
  kind: primaer
  authors: ["King, Martin Luther, Jr."]
  title: I Have a Dream
  written: Washington, D.C., Lincoln Memorial, 28. August 1963
  note: Rede zum Abschluss des Marschs auf Washington für Arbeit und Freiheit.
- id: q-civil-rights-act-1964
  kind: primaer
  authors: ["Congress of the United States"]
  title: Civil Rights Act of 1964
  written: Washington, D.C., unterzeichnet am 2. Juli 1964
  note: Bundesgesetz, das Diskriminierung nach Rasse, Hautfarbe, Religion, Geschlecht oder nationaler Herkunft in öffentlichen Einrichtungen und im Arbeitsleben verbot.
- id: q-hamer-1964
  kind: primaer
  authors: ["Hamer, Fannie Lou"]
  title: Aussage vor dem Beglaubigungsausschuss des Parteitags der Demokraten
  written: Atlantic City, 22. August 1964
  note: Im Fernsehen übertragene Schilderung, wie Hamer nach ihrem Versuch, sich als Wählerin registrieren zu lassen, ihre Arbeit verlor und im Gefängnis von Winona (Mississippi) schwer misshandelt wurde.
- id: q-malcolm-x-1965
  kind: primaer
  authors: ["Malcolm X", "Haley, Alex"]
  title: The Autobiography of Malcolm X
  place: New York
  publisher: Grove Press
  year: 1965
  written: New York, 1963–1965
  note: Gemeinsam mit dem Journalisten Alex Haley verfasste Lebensgeschichte, kurz nach Malcolm X’ Ermordung erschienen; ein vielgelesenes, aber stark stilisiertes Selbstzeugnis.
- id: q-johnson-1965
  kind: primaer
  authors: ["Johnson, Lyndon B."]
  title: Special Message to the Congress – The American Promise
  written: Washington, D.C., 15. März 1965
  note: Fernsehansprache vor beiden Kammern des Kongresses nach dem „Bloody Sunday“ von Selma, in der Johnson ein Wahlrechtsgesetz forderte und die Worte „We shall overcome“ aufgriff.
- id: q-voting-rights-act-1965
  kind: primaer
  authors: ["Congress of the United States"]
  title: Voting Rights Act of 1965
  written: Washington, D.C., unterzeichnet am 6. August 1965
  note: Bundesgesetz, das Lese- und Schreibtests als Wahlvoraussetzung verbot und Bezirke mit niedriger Wahlbeteiligung der Aufsicht des Bundes unterstellte.

