# --- Primärquellen ---
- id: q-chronik-754
  kind: primaer
  authors: ["Anonymus"]
  title: Chronik von 754 (Mozarabische Chronik)
  written: al-Andalus, um 754
  note: Lateinische Chronik eines unter muslimischer Herrschaft lebenden Christen, der früheste ausführliche Bericht über den Untergang des Westgotenreichs und die ersten Jahrzehnte von al-Andalus.
- id: q-chronik-alfons-iii
  kind: primaer
  authors: ["Anonymus"]
  title: Chronik Alfons' III.
  written: Königreich Asturien, um 880–910
  note: Am asturischen Hof entstandene Chronik, die das Königreich als Fortsetzung des Westgotenreichs darstellt und die Schlacht von Covadonga als Beginn der Befreiung Hispaniens schildert.
- id: q-ibn-hazm-halsband
  kind: primaer
  authors: ["Ibn Hazm"]
  title: Das Halsband der Taube (Tauq al-hamama)
  written: Játiva (Xàtiva), um 1022
  note: Abhandlung über die Liebe mit zahlreichen Erinnerungen des Autors an das Córdoba der späten Kalifatszeit und dessen Zerstörung im Bürgerkrieg nach 1009.
- id: q-cantar-de-mio-cid
  kind: primaer
  authors: ["Anonymus"]
  title: Cantar de mio Cid
  written: Kastilien, um 1200; einzige Handschrift aus dem 14. Jahrhundert mit einem Kolophon des Schreibers Per Abbat
  note: Altspanisches Heldenepos über Rodrigo Díaz, das ihn als treuen Vasallen und Eroberer Valencias idealisiert; Abfassungszeit und Verfasser sind umstritten.
- id: q-kapitulation-granada
  kind: primaer
  authors: ["Ferdinand II. von Aragon", "Isabella I. von Kastilien", "Muhammad XII. (Boabdil)"]
  title: Kapitulationen von Granada
  written: Santa Fe bei Granada, 25. November 1491
  note: Übergabevertrag, der den Muslimen Granadas Religionsausübung, eigene Richter, Besitz und das Recht auf Auswanderung zusicherte; die Zusagen wurden ab 1499 gebrochen.
- id: q-alhambra-edikt
  kind: primaer
  authors: ["Ferdinand II. von Aragon", "Isabella I. von Kastilien"]
  title: Edikt über die Ausweisung der Juden (Alhambra-Edikt)
  written: Granada, 31. März 1492
  note: Erlass, der allen Juden in Kastilien und Aragon befahl, binnen vier Monaten zum Christentum überzutreten oder das Land zu verlassen; begründet wird er mit dem angeblichen Einfluss der Juden auf die Conversos.
- id: q-bando-expulsion-1609
  kind: primaer
  authors: ["Philipp III. von Spanien"]
  title: Ausweisungsdekret gegen die Morisken des Königreichs Valencia
  written: Valencia, verkündet 22. September 1609
  note: Erste der Verordnungen, mit denen die spanische Krone 1609–1614 die Morisken der einzelnen Königreiche des Landes verwies.
- id: q-maqqari
  kind: primaer
  authors: ["al-Maqqari"]
  title: Nafh at-tib
  written: Kairo, um 1630
  note: Späte, umfangreiche Kompilation des aus Tlemcen stammenden Gelehrten über Geschichte, Literatur und Gelehrte von al-Andalus, die viele verlorene ältere Texte bewahrt.
