- id: q-polybios
  kind: primaer
  authors: ["Polybios"]
  title: Historien
  written: 2. Jh. v. Chr.
  note: Griechischer Geschichtsschreiber und Zeitgenosse des Dritten Punischen Krieges; Buch 6 enthält die berühmte Analyse der römischen Verfassung als „Mischverfassung“. Von 40 Büchern sind die Bücher 1–5 vollständig erhalten, die übrigen in Auszügen.
- id: q-livius
  kind: primaer
  authors: ["Livius, Titus"]
  title: Ab urbe condita
  written: ca. 27 v. Chr. – 17 n. Chr.
  note: Römische Geschichte von der Gründung an in 142 Büchern, erhalten sind die Bücher 1–10 und 21–45. Für die Frühzeit stark von späterer Überlieferung und Deutung geprägt.
- id: q-sallust
  kind: primaer
  authors: ["Sallustius Crispus, Gaius"]
  title: De coniuratione Catilinae / Bellum Iugurthinum
  written: ca. 42–40 v. Chr.
  note: Monografien eines Zeitgenossen, der den Verfall der Republik moralisch deutet (Ehrgeiz und Habgier der Nobilität).
- id: q-plutarch
  kind: primaer
  authors: ["Plutarch"]
  title: Parallelbiographien (Vitae parallelae)
  written: um 100 n. Chr.
  note: Biografien griechischer und römischer Staatsmänner, u. a. der Gracchen, des Marius, Sulla, Pompeius, Caesar, Cato und Antonius. Plutarch zielt auf moralische Charakterbilder, nicht auf vollständige Ereignisgeschichte.
- id: q-appian
  kind: primaer
  authors: ["Appian von Alexandria"]
  title: Römische Geschichte (Bürgerkriege; Libyké)
  written: 2. Jh. n. Chr.
  note: Die Bücher über die Bürgerkriege sind die wichtigste zusammenhängende Darstellung der Zeit von den Gracchen bis 35 v. Chr.; die Libyké behandelt die Kriege gegen Karthago.
- id: q-caesar-bg
  kind: primaer
  authors: ["Caesar, Gaius Iulius"]
  title: Commentarii de bello Gallico / de bello civili
  written: 58–ca. 45 v. Chr.
  note: Caesars eigene Berichte über den Gallischen Krieg und den Bürgerkrieg – unverzichtbare, aber parteiische Quellen, die auch der Selbstdarstellung dienten.
- id: q-sueton
  kind: primaer
  authors: ["Suetonius Tranquillus, Gaius"]
  title: De vita Caesarum (Kaiserviten)
  written: um 120 n. Chr.
  note: Biografien Caesars und der Kaiser bis Domitian; Sueton hatte als kaiserlicher Sekretär Zugang zu Archiven, sammelte aber auch Anekdoten und Gerüchte.
- id: q-cicero-briefe
  kind: primaer
  authors: ["Cicero, Marcus Tullius"]
  title: Briefe (Ad Atticum, Ad familiares u. a.) und Reden
  written: 68–43 v. Chr.
  note: Über 900 Briefe von und an Cicero geben einen einzigartigen, zeitgenössischen Einblick in die Politik der späten Republik.
- id: q-res-gestae
  kind: primaer
  authors: ["Augustus"]
  title: Res Gestae Divi Augusti
  written: 14 n. Chr. (letzte Fassung)
  note: Tatenbericht des Augustus, ursprünglich auf Bronzetafeln vor seinem Mausoleum in Rom; erhalten vor allem durch die zweisprachige Inschrift am Tempel der Roma und des Augustus in Ankyra (Ankara), das „Monumentum Ancyranum“.
- id: q-cassius-dio
  kind: primaer
  authors: ["Cassius Dio"]
  title: Römische Geschichte
  written: frühes 3. Jh. n. Chr.
  note: Griechisch verfasste Gesamtgeschichte Roms; für die späte Republik und Augustus (Bücher 36–56) weitgehend erhalten.
- id: q-tacitus-annalen
  kind: primaer
  authors: ["Tacitus, Publius Cornelius"]
  title: Annalen
  written: um 110–120 n. Chr.
  note: Geschichte der julisch-claudischen Kaiser; das erste Buch enthält eine kritische Rückschau auf die Herrschaft des Augustus.
