# --- Primärquellen ---
- id: q-bankettstele-assurnasirpal
  kind: primaer
  authors: ["Assurnasirpal II."]
  title: Bankettstele aus Kalchu (Nimrud)
  written: Kalchu, um 879 v. Chr.
  note: Steininschrift, die den Bau der neuen Hauptstadt und ein zehntägiges Fest zur Einweihung des Palastes mit nach eigener Angabe 69.574 Gästen beschreibt; ediert in RIMA 2.
- id: q-kurkh-monolith
  kind: primaer
  authors: ["Salmanassar III."]
  title: Monolith von Kurkh
  written: Assyrien, um 852 v. Chr.
  note: Stele mit Bericht über die ersten Regierungsjahre Salmanassars III., darunter die Schlacht von Qarqar 853 v. Chr. mit einer Aufzählung der gegnerischen Koalition; heute im British Museum, ediert in RIMA 3.
- id: q-sanherib-prisma
  kind: primaer
  authors: ["Sanherib"]
  title: Annalen Sanheribs (Taylor-, Chicago- und Jerusalem-Prisma)
  written: Ninive, um 691–689 v. Chr.
  note: Tönerne Prismen mit dem Tatenbericht Sanheribs, darunter der Feldzug von 701 v. Chr. gegen Juda und die Einschließung Hiskias in Jerusalem; ediert in RINAP 3/1.
- id: q-chronik-fall-ninive
  kind: primaer
  title: Babylonische Chronik zum Fall Ninives (Chronik 3)
  written: Babylonien, 6. Jh. v. Chr. oder später
  note: Knapper babylonischer Jahresbericht über die Jahre 616–609 v. Chr. mit den Eroberungen von Assur, Ninive und Harran durch Babylonier und Meder; ediert bei Grayson 1975.
- id: q-lachisch-reliefs
  kind: primaer
  title: Lachisch-Reliefs aus dem Südwestpalast in Ninive
  written: Ninive, um 700 v. Chr.
  note: Bildfolge aus einem Raum des Palastes Sanheribs, die Belagerung und Einnahme der judäischen Stadt Lachisch 701 v. Chr., die Bestrafung von Gefangenen und den Abzug der Deportierten zeigt; heute im British Museum.
- id: q-bibel-koenige-nahum
  kind: primaer
  title: Hebräische Bibel – 2. Buch der Könige (Kap. 15–20), Jesaja 36–37, Nahum
  written: Juda, 7.–5. Jh. v. Chr. (Entstehung und Redaktion umstritten)
  note: Biblische Darstellungen der assyrischen Feldzüge gegen Israel und Juda, des Falls Samarias und der Belagerung Jerusalems; das Buch Nahum feiert den Untergang Ninives als Strafe Gottes.
- id: q-layard-1849
  kind: primaer
  authors: ["Layard, Austen Henry"]
  title: Nineveh and Its Remains
  place: London
  publisher: John Murray
  year: 1849
  written: London, 1849
  note: Populärer Bericht des britischen Ausgräbers über seine Grabungen in Nimrud und Kuyunjik (Ninive) 1845–1847, der die assyrische Kunst in Europa bekannt machte; Layard hielt Nimrud zunächst für Ninive.
