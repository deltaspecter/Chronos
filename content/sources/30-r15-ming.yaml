# --- Primärquellen ---
- id: q-ma-huan
  kind: primaer
  authors: ["Ma Huan"]
  title: Yingya shenglan (Gesamtschau der Küsten des Ozeans)
  written: China, Entwurf ab 1416, Endfassung um 1451
  note: Bericht eines muslimischen Dolmetschers, der an drei Fahrten Zheng Hes teilnahm und Häfen, Waren, Sitten und Herrscher der besuchten Länder von Champa bis Mekka beschreibt.
- id: q-changle-inschrift
  kind: primaer
  authors: ["Zheng He u. a."]
  title: Inschrift im Tempel der Himmelskönigin in Changle
  written: Changle (Fujian), Xuande 6 (1431/32)
  note: Vor der siebten Fahrt von Zheng He und seinen Mitkommandanten gestiftete Steininschrift, die der Seegöttin Tianfei dankt und die bisherigen Fahrten aufzählt.
- id: q-huang-ming-zuxun
  kind: primaer
  authors: ["Hongwu-Kaiser"]
  title: Huang Ming zuxun (Ahnenvermächtnis der Ming)
  written: Nanjing, Endfassung 1395
  note: Anweisungen des Dynastiegründers an seine Nachfolger, unter anderem mit einer Liste von Nachbarländern, die nicht angegriffen werden sollten.
- id: q-mingshi
  kind: primaer
  authors: ["Zhang Tingyu (Leitung)"]
  title: Mingshi (Geschichte der Ming)
  written: Peking, unter der Qing-Dynastie, 1739 vorgelegt
  note: Offizielle Dynastiegeschichte der Ming, von Gelehrten der Nachfolgedynastie zusammengestellt; Hauptquelle für viele Zahlenangaben, etwa zur Größe der Flotten Zheng Hes.
- id: q-ricci-trigault
  kind: primaer
  authors: ["Ricci, Matteo", "Trigault, Nicolas"]
  title: De Christiana expeditione apud Sinas
  written: Augsburg 1615 (nach Riccis italienischen Aufzeichnungen bis 1610)
  note: Von Nicolas Trigault bearbeitete und ins Lateinische übersetzte Erinnerungen Riccis an die Jesuitenmission in China; prägte für lange Zeit das europäische Chinabild.
- id: q-tiangong-kaiwu
  kind: primaer
  authors: ["Song Yingxing"]
  title: Tiangong kaiwu (Die Erschließung der Dinge durch die Werke der Natur)
  written: China, 1637
  note: Illustriertes Handbuch der Techniken von Landwirtschaft und Handwerk, darunter Seidenweberei, Bergbau und die Porzellanherstellung in Jingdezhen.
- id: q-xiyouji
  kind: primaer
  title: Xiyouji (Die Reise nach Westen)
  written: China, früheste erhaltene Druckausgabe Nanjing 1592
  note: Roman über die Pilgerfahrt des Mönchs Xuanzang nach Indien mit dem Affenkönig Sun Wukong; die übliche Zuschreibung an Wu Cheng'en ist unsicher.
