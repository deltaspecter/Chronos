# Quellen und Literatur: Die Wikinger

# --- Primärquellen ---
- id: q-angelsaechsische-chronik
  kind: primaer
  title: Angelsächsische Chronik (Anglo-Saxon Chronicle)
  written: England, ab dem späten 9. Jahrhundert, in mehreren Fassungen fortgeführt bis ins 12. Jahrhundert
  note: Jahrweise geführte Chronik in altenglischer Sprache, die unter Alfred dem Großen in Wessex zusammengestellt und in Klöstern fortgesetzt wurde; wichtigste Erzählquelle für die skandinavischen Angriffe auf England, aber aus westsächsischer Sicht geschrieben.
- id: q-alkuin-brief-793
  kind: primaer
  authors: ["Alkuin"]
  title: Brief an König Æthelred von Northumbrien über den Überfall auf Lindisfarne
  written: "793"
  note: Alkuin deutet den Angriff auf das Kloster Lindisfarne als Strafe Gottes für die Sünden der Northumbrier und betont, eine solche Fahrt übers Meer habe man nicht für möglich gehalten.
- id: q-annales-bertiniani
  kind: primaer
  title: Annales Bertiniani (Annalen von Saint-Bertin)
  written: Westfrankenreich, 830–882
  note: Fortsetzung der fränkischen Reichsannalen; berichtet zu 839 von Gesandten des byzantinischen Kaisers, die sich „Rhos“ nannten und am Hof Ludwigs des Frommen als Schweden erkannt wurden, sowie von den Wikingerzügen gegen das Westfrankenreich.
- id: q-ibn-fadlan
  kind: primaer
  authors: ["Ahmad ibn Fadlan"]
  title: Risala (Reisebericht über die Gesandtschaft zu den Wolgabulgaren)
  written: Bagdad, nach 922
  note: Bericht eines Mitglieds der abbasidischen Gesandtschaft an den Herrscher der Wolgabulgaren 921–922; enthält die ausführlichste zeitgenössische Beschreibung von „Rus“-Händlern an der Wolga und einer Schiffsbestattung, aus der Sicht eines muslimischen Gelehrten.
- id: q-jelling-stein
  kind: primaer
  authors: ["Harald Blauzahn"]
  title: Großer Runenstein von Jelling
  written: Jelling (Jütland), um 965
  note: Von Harald Blauzahn für seine Eltern Gorm und Thyra errichteter Runenstein, dessen Inschrift verkündet, Harald habe ganz Dänemark und Norwegen gewonnen und die Dänen zu Christen gemacht; eine Seite zeigt die älteste Christusdarstellung Skandinaviens.
- id: q-islendingabok
  kind: primaer
  authors: ["Ari Þorgilsson"]
  title: Íslendingabók (Buch der Isländer)
  written: Island, um 1122–1133
  note: Knappe Geschichte Islands von der Landnahme bis ins frühe 12. Jahrhundert; älteste erzählende Quelle zur Besiedlung, zum Althing und zur Annahme des Christentums um 1000, aber rund 250 Jahre nach der Landnahme verfasst.
- id: q-vinland-sagas
  kind: primaer
  title: Grænlendinga saga und Eiríks saga rauða (Vinland-Sagas)
  written: Island, 13. Jahrhundert (Handschriften des 14. und 15. Jahrhunderts)
  note: Zwei isländische Sagas über die Besiedlung Grönlands und die Fahrten nach Vinland, die sich in Einzelheiten widersprechen und erst mehr als 200 Jahre nach den Ereignissen niedergeschrieben wurden.
- id: q-nestorchronik
  kind: primaer
  title: Erzählung der vergangenen Jahre (Povest' vremennych let, „Nestorchronik“)
  written: Kiew, frühes 12. Jahrhundert
  note: Altrussische Chronik, die die Anfänge der Rus mit der Berufung des Warägers Rurik nach Nowgorod erzählt und auch die Verträge der Rus mit Byzanz von 911 und 944 überliefert; ihre Frühgeschichte ist eine spätere, legendarisch gefärbte Konstruktion.

