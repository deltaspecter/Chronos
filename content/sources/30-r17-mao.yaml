# Quellen und Literatur: Maos China (1949–1976)

# --- Primärquellen ---
- id: q-mao-1957
  kind: primaer
  authors: ["Mao Zedong"]
  title: Über die richtige Behandlung der Widersprüche im Volke
  written: Peking, Rede vom 27. Februar 1957; überarbeitet veröffentlicht im Juni 1957
  note: Rede vor der Obersten Staatskonferenz, in der Mao die Losung „Lasst hundert Blumen blühen“ erläuterte; die gedruckte Fassung wurde nach Beginn der Anti-Rechts-Kampagne verschärft.
- id: q-peng-1959
  kind: primaer
  authors: ["Peng Dehuai"]
  title: Brief an Mao Zedong
  written: Lushan, 14. Juli 1959
  note: Persönlicher Brief des Verteidigungsministers, der Übertreibungen und „kleinbürgerlichen Fanatismus“ im Großen Sprung vorsichtig kritisierte; Mao ließ ihn verteilen und machte ihn zum Anlass von Pengs Sturz.
- id: q-zk-1966
  kind: primaer
  authors: ["Zentralkomitee der Kommunistischen Partei Chinas"]
  title: Beschluss über die Große Proletarische Kulturrevolution („16 Punkte“)
  written: Peking, 8. August 1966
  note: Programmdokument der Kulturrevolution, das die Massen aufrief, „Machthaber in der Partei, die den kapitalistischen Weg gehen“, zu entlarven und die „Vier Alten“ zu beseitigen.
- id: q-mao-yulu-1964
  kind: primaer
  authors: ["Mao Zedong"]
  title: Worte des Vorsitzenden Mao Tse-tung („Mao-Bibel“)
  written: Peking, Allgemeine Politische Abteilung der Volksbefreiungsarmee, 1964 (erweiterte Ausgabe 1965)
  note: Von der Armee unter Lin Biao zusammengestellte Zitatsammlung, die in der Kulturrevolution in Hunderten Millionen Exemplaren verbreitet wurde und zum Symbol des Mao-Kults wurde.
- id: q-shanghai-1972
  kind: primaer
  authors: ["Regierung der Vereinigten Staaten", "Regierung der Volksrepublik China"]
  title: Gemeinsames Kommuniqué („Shanghai-Kommuniqué“)
  written: Shanghai, 28. Februar 1972
  note: Abschlusserklärung des Nixon-Besuchs, in der beide Seiten ihre gegensätzlichen Positionen nebeneinanderstellten und die USA anerkannten, dass die Chinesen auf beiden Seiten der Taiwanstraße an einem einzigen China festhielten.
- id: q-resolution-1981
  kind: primaer
  authors: ["Zentralkomitee der Kommunistischen Partei Chinas"]
  title: Beschluss über einige Fragen der Geschichte unserer Partei seit Gründung der Volksrepublik China
  written: Peking, 27. Juni 1981 (6. Plenum des XI. Zentralkomitees)
  note: Offizielle Bewertung der Mao-Zeit, die Mao große Verdienste zuschrieb, den Großen Sprung als schweren Fehler und die Kulturrevolution als schwersten Rückschlag seit 1949 verurteilte und die Verantwortung dafür vor allem Mao, Lin Biao und der „Viererbande“ zuwies.
- id: q-li-zhisui-1994
  kind: primaer
  authors: ["Li, Zhisui"]
  title: The Private Life of Chairman Mao
  subtitle: The Memoirs of Mao's Personal Physician
  place: New York
  publisher: Random House
  year: 1994
  note: Erinnerungen von Maos Leibarzt (1954–1976), wertvoll als Innenansicht des Hofes, in Einzelheiten aber umstritten.
- id: q-chang-1991
  kind: primaer
  authors: ["Chang, Jung"]
  title: Wild Swans
  subtitle: Three Daughters of China
  place: London
  publisher: HarperCollins
  year: 1991
  note: Familienerinnerungen über drei Generationen, darunter die Erfahrungen der Autorin als Rotgardistin und „hinaufgeschickte“ Jugendliche in Sichuan.

