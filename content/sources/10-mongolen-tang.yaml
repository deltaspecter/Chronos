- id: q-geheime-geschichte
  kind: primaer
  title: Die Geheime Geschichte der Mongolen
  written: "13. Jahrhundert (Kolophon: „Jahr der Ratte“, wohl 1228 oder 1240)"
  note: Einzige erhaltene mongolische Erzählung aus der Zeit des Reiches über Herkunft und Leben Dschingis Khans, überliefert in chinesischer Umschrift. Englische Übersetzung mit Kommentar – Igor de Rachewiltz, The Secret History of the Mongols (Leiden – Brill, 2004).
- id: q-juwaini
  kind: primaer
  authors: ["Ata-Malik Dschuwaini"]
  title: Tarich-i Dschahangusch (Geschichte des Welteroberers)
  written: um 1260
  note: Persische Geschichte der mongolischen Eroberungen eines Beamten im Dienst der Mongolen; schildert die Zerstörung der Städte Chorasans mit sehr hohen, kaum überprüfbaren Opferzahlen.
- id: q-raschid-ad-din
  kind: primaer
  authors: ["Raschid ad-Din"]
  title: Dschami at-tawarich (Sammlung der Chroniken)
  written: um 1300–1310
  note: Universalgeschichte des Wesirs der Ilchane in Iran, auf Grundlage mongolischer Überlieferungen; eine der ersten Weltgeschichten überhaupt.
- id: q-carpini
  kind: primaer
  authors: ["Johannes de Plano Carpini"]
  title: Historia Mongalorum
  written: "1247"
  note: Bericht des Franziskaners, den Papst Innozenz IV. 1245 an den Hof des Großkhans sandte; beschreibt Lebensweise und Kriegführung der Mongolen.
- id: q-rubruk
  kind: primaer
  authors: ["Wilhelm von Rubruk"]
  title: Itinerarium
  written: um 1255
  note: Bericht des flämischen Franziskaners über seine Reise nach Karakorum 1253–1255, mit genauen Beobachtungen zu Hof, Religionen und Alltag.

