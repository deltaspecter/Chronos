# --- Primärquellen ---
- id: q-gruendungsurkunde-cluny
  kind: primaer
  authors: ["Wilhelm I. von Aquitanien"]
  title: Gründungsurkunde des Klosters Cluny
  written: Bourges, 11. September 910 (Datierung teils auch auf 909)
  note: Schenkungsurkunde, mit der Herzog Wilhelm das Kloster den Aposteln Petrus und Paulus übertrug und es dem Schutz des Papstes unterstellte, frei von jeder weltlichen und bischöflichen Gewalt.
- id: q-humbert-adversus-simoniacos
  kind: primaer
  authors: ["Humbert von Silva Candida"]
  title: Drei Bücher gegen die Simonisten (Libri tres adversus simoniacos)
  written: Rom, um 1057/58
  note: Kampfschrift des Kardinals Humbert, die Weihen simonistischer Geistlicher für ungültig erklärte und die Einsetzung von Geistlichen durch Laien grundsätzlich angriff.
- id: q-papstwahldekret-1059
  kind: primaer
  authors: ["Nikolaus II."]
  title: Papstwahldekret
  written: Lateransynode, Rom, April 1059
  note: Synodalbeschluss, der den Kardinalbischöfen die führende Rolle bei der Papstwahl zusprach und die Mitwirkung des deutschen Königs nur noch vage als Ehrenrecht erwähnte.
- id: q-dictatus-papae
  kind: primaer
  authors: ["Gregor VII."]
  title: Dictatus Papae
  written: Rom, 1075 (im Register zwischen Briefen vom März 1075 eingetragen)
  note: Liste von 27 knappen Leitsätzen über die Vorrechte des Papstes, überliefert im Original des päpstlichen Registers; Zweck und Entstehung sind umstritten.
- id: q-heinrich-iv-brief-1076
  kind: primaer
  authors: ["Heinrich IV."]
  title: Brief an Hildebrand („Heinricus non usurpative …“)
  written: Worms, Januar 1076 (überarbeitete Fassung wohl Frühjahr 1076)
  note: Absageschreiben des Königs an Gregor VII. nach der Wormser Synode, in dem er den Papst als falschen Mönch anredet und zum Herabsteigen vom Stuhl Petri auffordert.
- id: q-bann-heinrichs-iv-1076
  kind: primaer
  authors: ["Gregor VII."]
  title: Bannsentenz gegen Heinrich IV. (Gebet an den Apostel Petrus)
  written: Fastensynode, Rom, Februar 1076
  note: Als Gebet an Petrus formulierter Urteilsspruch, mit dem Gregor dem König die Herrschaft untersagte, die Untertanen von ihren Eiden löste und ihn exkommunizierte; im Register Gregors VII. überliefert.
- id: q-gregor-brief-canossa-1077
  kind: primaer
  authors: ["Gregor VII."]
  title: Brief an die deutschen Fürsten über die Ereignisse von Canossa
  written: Canossa, Ende Januar 1077
  note: Rechenschaftsbericht des Papstes, nach dem der König drei Tage lang barfuß und im Büßergewand vor dem Burgtor ausharrte, bevor er vom Bann gelöst wurde.
- id: q-lampert-annalen
  kind: primaer
  authors: ["Lampert von Hersfeld"]
  title: Annalen
  written: Kloster Hersfeld, um 1077/79
  note: Ausführliche, königsfeindliche Darstellung der Jahre bis 1077 durch einen Mönch; Hauptquelle für die dramatische Ausmalung des Bußgangs von Canossa.
- id: q-bruno-sachsenkrieg
  kind: primaer
  authors: ["Bruno von Merseburg"]
  title: Buch vom Sachsenkrieg (De bello Saxonico)
  written: Sachsen, um 1082
  note: Parteischrift aus dem Umfeld der aufständischen Sachsen gegen Heinrich IV., die zahlreiche Briefe und Dokumente wiedergibt.
- id: q-vita-heinrici-iv
  kind: primaer
  title: Lebensbeschreibung Kaiser Heinrichs IV. (Vita Heinrici IV. imperatoris)
  written: wohl Lüttich, kurz nach 1106
  note: Anonyme, dem Kaiser zugeneigte Klageschrift auf seinen Tod, die seine Freigebigkeit und seine Leiden unter dem Verrat des Sohnes hervorhebt.
- id: q-eadmer-historia-novorum
  kind: primaer
  authors: ["Eadmer von Canterbury"]
  title: Historia novorum in Anglia
  written: Canterbury, um 1095–1123
  note: Darstellung der jüngsten Ereignisse in England durch einen Mönch aus dem Umfeld Erzbischof Anselms, mit Schwerpunkt auf dessen Konflikten mit den Königen.
- id: q-wormser-konkordat
  kind: primaer
  authors: ["Heinrich V.", "Calixt II."]
  title: Wormser Konkordat (Heinricianum und Calixtinum)
  written: Worms, 23. September 1122
  note: Zwei wechselseitig ausgestellte Urkunden, in denen der Kaiser auf die Investitur mit Ring und Stab verzichtete und der Papst dem Kaiser Mitwirkung bei Wahl und Belehnung der Bischöfe im Reich zugestand.
