# --- Primärquellen ---
- id: q-busbecq
  kind: primaer
  authors: ["Busbecq, Ogier Ghiselin de"]
  title: Legationis Turcicae epistolae quattuor (Türkische Briefe)
  written: "Istanbul, Amasya und Wien, 1555–1562; vollständig gedruckt Paris 1589"
  note: Vier lateinische Briefe des habsburgischen Gesandten am Hof Süleymans, die den Hof, das Heer und das Alltagsleben im Osmanischen Reich beschreiben und in Europa viel gelesen wurden.
- id: q-mustafa-ali-nushat
  kind: primaer
  authors: ["Mustafa Âli"]
  title: Nushatü's-selatin (Rat für Sultane)
  written: "Istanbul, 1581"
  note: Osmanische Ratgeberschrift, in der der Historiker und Beamte Mustafa Âli Missstände in Verwaltung und Ämtervergabe beklagt und an der idealisierten Ordnung der Süleyman-Zeit misst.
- id: q-tezkiretul-bunyan
  kind: primaer
  authors: ["Sai Mustafa Çelebi"]
  title: Tezkiretü'l-bünyan (Denkschrift über die Bauten)
  written: "Istanbul, 1580er Jahre"
  note: Lebensbeschreibung und Werkliste des Architekten Sinan, aufgezeichnet nach dessen eigenen Erzählungen.
- id: q-kitab-i-bahriye
  kind: primaer
  authors: ["Piri Reis"]
  title: Kitab-ı Bahriye (Buch der Seefahrt)
  written: "Gallipoli, 1521, überarbeitet 1526"
  note: Segelhandbuch mit Karten und Beschreibungen der Küsten und Häfen des Mittelmeers, das der osmanische Seeoffizier Süleyman widmete.
- id: q-seydi-ali-reis
  kind: primaer
  authors: ["Seydi Ali Reis"]
  title: Mir'atü'l-memalik (Spiegel der Länder)
  written: "Istanbul, 1557"
  note: Reisebericht eines osmanischen Admirals, der 1554 mit seiner Flotte an die Küste Gujarats verschlagen wurde und über Indien, Zentralasien und Iran nach Istanbul zurückkehrte.
- id: q-ebussuud-fetwas
  kind: primaer
  authors: ["Ebussuud Efendi"]
  title: Fetwas (Rechtsgutachten)
  written: "Istanbul, um 1545–1574"
  note: Tausende Rechtsgutachten des obersten Muftis, überliefert in Sammelhandschriften, darunter Gutachten zum Bodenrecht, zu frommen Stiftungen und gegen die Kızılbaş.
- id: q-tahrir-defterleri
  kind: primaer
  title: Tahrir defterleri (osmanische Steuer- und Katasterregister)
  written: "Osmanisches Reich, 15. und 16. Jahrhundert"
  note: Register, in denen die Verwaltung Provinz für Provinz Haushalte, Dörfer, Abgaben und die Vergabe von Timar-Pfründen verzeichnete; heute vor allem in den Staatsarchiven in Istanbul und Ankara.
- id: q-huerrem-briefe
  kind: primaer
  authors: ["Hürrem Sultan"]
  title: Briefe an Sultan Süleyman und an König Sigismund II. August von Polen
  written: "Istanbul, um 1530–1558"
  note: Erhaltene Briefe der Gemahlin Süleymans, die Einblick in ihre persönliche Beziehung zum Sultan und in ihre diplomatische Rolle geben.
