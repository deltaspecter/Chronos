- id: q-pyramidentexte
  kind: primaer
  title: Pyramidentexte
  written: ab der späten 5. Dynastie (Unas, um 2350 v. Chr.)
  note: Älteste religiöse Textsammlung Ägyptens; Sprüche für das Fortleben des Königs, in den Grabkammern der Pyramiden von Sakkara eingemeißelt.
- id: q-palermostein
  kind: primaer
  title: Palermostein (Annalenstein)
  written: 5. Dynastie (um 2400 v. Chr.)
  note: Fragment einer Königsannale mit Jahresereignissen und Nilhochwasserständen von der Frühzeit bis in die 5. Dynastie; das größte Fragment befindet sich in Palermo.
- id: q-manetho
  kind: primaer
  authors: ["Manetho"]
  title: Aigyptiaka
  written: 3. Jh. v. Chr.
  note: Ägyptische Geschichte eines Priesters aus Sebennytos in griechischer Sprache; nur in Auszügen späterer Autoren (Iosephus, Iulius Africanus, Eusebios) erhalten. Grundlage der bis heute verwendeten Dynastienzählung.
- id: q-herodot
  kind: primaer
  authors: ["Herodot"]
  title: Historien
  written: um 430 v. Chr.
  note: Buch 2 behandelt Ägypten, die Bücher 1 und 3–9 u. a. das Perserreich und die Perserkriege. Herodot stützt sich auf eigene Reisen und mündliche Berichte; die Glaubwürdigkeit einzelner Angaben ist im Einzelfall zu prüfen.
