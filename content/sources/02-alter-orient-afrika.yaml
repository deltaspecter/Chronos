- id: q-sumerische-koenigsliste
  kind: primaer
  title: Sumerische Königsliste
  written: überliefert in Abschriften vor allem des frühen 2. Jahrtausends v. Chr.
  note: Liste von Königen und Städten von der „Herabkunft des Königtums vom Himmel“ bis zur Isin-Dynastie; für die Frühzeit legendär, mit teils Zehntausende Jahre langen Regierungen. Text in Übersetzung im ETCSL (Nr. 2.1.1).
- id: q-gilgamesch
  kind: primaer
  title: Gilgamesch-Epos
  written: sumerische Einzeldichtungen ab ca. 2100 v. Chr.; „Standardfassung“ (Zwölftafelepos) des 1. Jahrtausends v. Chr.
  note: Dichtung um den legendären König von Uruk; Hinweis auf die Stadtmauer Uruks.
