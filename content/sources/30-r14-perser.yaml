# Quellen und Literatur: Die Perserkriege

# --- Primärquellen ---
- id: q-xerxes-daiva-inschrift
  kind: primaer
  authors: ["Xerxes I."]
  title: Daiva-Inschrift des Xerxes (XPh)
  written: Persepolis, nach 486 v. Chr.
  note: Dreisprachige Gründungsinschrift aus Persepolis (Altpersisch, Elamisch, Babylonisch), in der Xerxes die Länder seines Reiches aufzählt, darunter Gruppen von Ioniern, und die Zerstörung eines Heiligtums falscher Götter (daiva) verkündet; Griechenlandfeldzug und Niederlagen erwähnt sie nicht.
- id: q-dareios-naqsch-e-rostam
  kind: primaer
  authors: ["Dareios I."]
  title: Grabinschriften des Dareios in Naqsch-e Rostam (DNa, DNb)
  written: Naqsch-e Rostam (Persis), um 500–486 v. Chr.
  note: Inschriften an der Felsfassade des Königsgrabes; sie zählen die dem König untertanen Länder auf, darunter die Yauna (Ionier), und beschreiben die Tugenden des idealen Herrschers.
- id: q-schlangensaeule
  kind: primaer
  title: Schlangensäule von Delphi
  written: Delphi, kurz nach 479 v. Chr.
  note: Bronzenes Siegesweihgeschenk der Griechen nach Plataiai, auf dessen Windungen die Namen von 31 Gemeinwesen stehen, die gegen die Perser gekämpft hatten; unter Konstantin nach Konstantinopel gebracht, der Rest steht heute im Hippodrom von Istanbul.
- id: q-themistokles-dekret
  kind: primaer
  title: Themistokles-Dekret von Troizen
  written: Inschrift des 3. Jh. v. Chr., angeblich Beschluss von 480 v. Chr.
  note: 1959 in Troizen gefundene Inschrift, die den athenischen Beschluss zur Räumung Attikas und zur Bemannung der Flotte wiedergeben will; ob sie ein echtes Dokument von 480 v. Chr. oder eine spätere Rekonstruktion bewahrt, ist umstritten.
- id: q-diodor
  kind: primaer
  authors: ["Diodor von Sizilien"]
  title: Bibliotheke (Historische Bibliothek)
  written: 1. Jh. v. Chr.
  note: Universalgeschichte, deren Bücher 11 und 12 die Zeit nach 480 v. Chr. behandeln; Diodor schöpft vor allem aus dem verlorenen Werk des Ephoros und überliefert als einzige erzählende Quelle Bestimmungen des Kalliasfriedens.
- id: q-plutarch-malignitate
  kind: primaer
  authors: ["Plutarch"]
  title: Über die Böswilligkeit Herodots (De Herodoti malignitate)
  written: um 100 n. Chr.
  note: Streitschrift, in der Plutarch Herodot vorwirft, die Leistungen griechischer Städte, besonders seiner Heimat Boiotien, herabgesetzt und den Barbaren zu viel Sympathie entgegengebracht zu haben.

