- id: stora-1993
  kind: sekundaer
  authors: ["Stora, Benjamin"]
  title: Histoire de la guerre d'Algérie (1954–1962)
  place: Paris
  publisher: La Découverte
  year: 1993
- id: evans-2012
  kind: sekundaer
  authors: ["Evans, Martin"]
  title: Algeria
  subtitle: France's Undeclared War
  place: Oxford
  publisher: Oxford University Press
  year: 2012
- id: connelly-2002
  kind: sekundaer
  authors: ["Connelly, Matthew"]
  title: A Diplomatic Revolution
  subtitle: Algeria's Fight for Independence and the Origins of the Post-Cold War Era
  place: New York
  publisher: Oxford University Press
  year: 2002
- id: branche-2001
  kind: sekundaer
  authors: ["Branche, Raphaëlle"]
  title: La torture et l'armée pendant la guerre d'Algérie 1954–1962
  place: Paris
  publisher: Gallimard
  year: 2001
- id: q-fln-1954
  kind: primaer
  authors: ["Front de Libération Nationale"]
  title: Proklamation vom 1. November 1954
  written: Algerien, 1. November 1954
  note: Flugblatt, mit dem sich die FLN in der Nacht der ersten Anschläge an das algerische Volk wandte und als Ziel die „nationale Unabhängigkeit“ und die Wiederherstellung eines souveränen algerischen Staats nannte.
- id: q-alleg-1958
  kind: primaer
  authors: ["Alleg, Henri"]
  title: La Question
  written: Paris, 1958
  note: Bericht des kommunistischen Journalisten über seine Folterung durch französische Fallschirmjäger 1957, in Haft geschrieben und herausgeschmuggelt; das Buch wurde kurz nach Erscheinen beschlagnahmt.
- id: q-fanon-1961
  kind: primaer
  authors: ["Fanon, Frantz"]
  title: Les Damnés de la terre
  written: Paris, 1961
  note: Kampfschrift des aus Martinique stammenden Psychiaters, der sich der FLN angeschlossen hatte; mit einem Vorwort von Jean-Paul Sartre. Auf Deutsch als „Die Verdammten dieser Erde“ erschienen.
- id: q-evian-1962
  kind: primaer
  title: Abkommen von Évian (Accords d'Évian)
  written: Évian-les-Bains, 18. März 1962
  note: Vereinbarungen zwischen der französischen Regierung und der algerischen Exilregierung über einen Waffenstillstand ab dem 19. März 1962 und eine Volksabstimmung über die Unabhängigkeit.

