- id: q-kennedy-1962
  kind: primaer
  authors: ["Kennedy, John F."]
  title: Radio and Television Report to the American People on the Soviet Arms Buildup in Cuba
  written: Washington, 22. Oktober 1962
  note: Fernsehansprache, in der Kennedy die Entdeckung der Raketenstellungen öffentlich machte und eine „Quarantäne“ – eine Seeblockade – gegen Waffenlieferungen nach Kuba ankündigte.
- id: q-chruschtschow-1962
  kind: primaer
  authors: ["Chruschtschow, Nikita"]
  title: Briefe an Präsident Kennedy vom 26. und 27. Oktober 1962
  written: Moskau, 26./27. Oktober 1962
  note: Der erste, persönlich gehaltene Brief bot den Abzug der Raketen gegen ein Nichtangriffsversprechen an; der zweite, öffentlich verlesene forderte zusätzlich den Abzug amerikanischer Raketen aus der Türkei.
- id: q-kennedy-tapes
  kind: edition
  editors: ["May, Ernest R.", "Zelikow, Philip D."]
  title: The Kennedy Tapes
  subtitle: Inside the White House during the Cuban Missile Crisis
  place: Cambridge, Mass.
  publisher: Belknap Press of Harvard University Press
  year: 1997
  note: Abschriften der heimlich mitgeschnittenen Beratungen Kennedys mit seinem Krisenstab (ExComm).

# --- Algerienkrieg ---
