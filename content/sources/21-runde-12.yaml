- id: q-unsc-83
  kind: primaer
  authors: ["Sicherheitsrat der Vereinten Nationen"]
  title: Resolution 83 (1950)
  written: New York, 27. Juni 1950
  note: Empfiehlt den Mitgliedstaaten, der Republik Korea die Hilfe zu leisten, die nötig ist, um den bewaffneten Angriff abzuwehren; zustande gekommen, weil die Sowjetunion den Sicherheitsrat damals boykottierte.
- id: q-nsc-68
  kind: primaer
  authors: ["National Security Council"]
  title: "NSC 68 – United States Objectives and Programs for National Security"
  written: Washington, 14. April 1950
  note: Geheime Grundsatzdenkschrift, die eine massive Aufrüstung gegen die Sowjetunion forderte; erst der Koreakrieg machte die geforderten Mittel politisch durchsetzbar.
- id: q-waffenstillstand-korea
  kind: primaer
  title: Waffenstillstandsabkommen von Panmunjom (Korean Armistice Agreement)
  written: Panmunjom, 27. Juli 1953
  note: Von den Oberbefehlshabern der UN-Truppen, der nordkoreanischen Armee und der chinesischen „Volksfreiwilligen“ unterzeichnet, nicht aber von Südkorea; ein Friedensvertrag wurde nie geschlossen.

