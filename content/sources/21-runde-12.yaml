- id: q-nkrumah-1957
  kind: primaer
  authors: ["Nkrumah, Kwame"]
  title: Rede zur Unabhängigkeit Ghanas
  written: Accra, 6. März 1957
  note: Um Mitternacht auf dem Old Polo Ground gehaltene Ansprache, in der Nkrumah die Unabhängigkeit Ghanas mit der Befreiung ganz Afrikas verknüpfte.
- id: q-macmillan-1960
  kind: primaer
  authors: ["Macmillan, Harold"]
  title: Rede vor dem südafrikanischen Parlament („Wind of Change“)
  written: Kapstadt, 3. Februar 1960
  note: Der britische Premierminister erklärte, ein „Wind des Wandels“ wehe durch den Kontinent, und distanzierte sich vorsichtig von der Apartheidpolitik.
- id: q-lumumba-1960
  kind: primaer
  authors: ["Lumumba, Patrice"]
  title: Rede zur Unabhängigkeit des Kongo
  written: Léopoldville, 30. Juni 1960
  note: Nicht im Protokoll vorgesehene Rede des Premierministers, der in Anwesenheit des belgischen Königs Baudouin an Zwangsarbeit, Demütigung und Gewalt der Kolonialzeit erinnerte.
- id: q-un-res-1514
  kind: primaer
  authors: ["Generalversammlung der Vereinten Nationen"]
  title: "Resolution 1514 (XV) – Erklärung über die Gewährung der Unabhängigkeit an koloniale Länder und Völker"
  written: New York, 14. Dezember 1960
  note: Ohne Gegenstimme bei neun Enthaltungen – darunter die Kolonialmächte Großbritannien, Frankreich, Belgien, Portugal und Spanien sowie die USA – angenommene Erklärung, die Kolonialherrschaft als Verstoß gegen die Menschenrechte verurteilt.
- id: elkins-2005
  kind: sekundaer
  authors: ["Elkins, Caroline"]
  title: Imperial Reckoning
  subtitle: The Untold Story of Britain's Gulag in Kenya
  place: New York
  publisher: Henry Holt
  year: 2005
