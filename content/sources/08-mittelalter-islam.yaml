- id: q-einhard
  kind: primaer
  authors: ["Einhard"]
  title: Vita Karoli Magni (Das Leben Karls des Großen)
  written: zwischen etwa 817 und 830
  note: Biografie aus der Feder eines Gelehrten am Hof Karls, nach dem Vorbild der Kaiserviten Suetons. Wertvoll durch die persönliche Kenntnis des Autors, aber eine stilisierte Lobschrift; die genaue Abfassungszeit ist umstritten.
- id: q-reichsannalen
  kind: primaer
  title: Annales regni Francorum (Fränkische Reichsannalen)
  written: im Umfeld des Hofes, etwa 788–829
  note: Jahrweise geführte Hofgeschichtsschreibung, die Misserfolge oft verschweigt. Eine überarbeitete Fassung („Einhardsannalen“) ergänzt manche dieser Lücken.
- id: q-admonitio-generalis
  kind: primaer
  title: Admonitio generalis
  written: "789"
  note: Umfangreiches Kapitular Karls des Großen zur Reform von Kirche, Bildung und Lebensführung; verlangt unter anderem Schulen an Klöstern und Bischofssitzen.
- id: q-capitulatio-saxonia
  kind: primaer
  title: Capitulatio de partibus Saxoniae
  written: wahrscheinlich 782 oder um 785
  note: Kapitular für das eroberte Sachsen, das unter anderem die Verweigerung der Taufe und heidnische Bräuche mit dem Tod bedrohte; die Datierung ist umstritten.
- id: q-notker
  kind: primaer
  authors: ["Notker Balbulus"]
  title: Gesta Karoli Magni imperatoris
  written: 883–887
  note: Anekdotensammlung eines Mönchs aus St. Gallen für Kaiser Karl III.; zeigt das bereits legendenhafte Bild Karls zwei Generationen nach seinem Tod.

