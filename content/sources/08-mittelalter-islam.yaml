- id: q-ibn-an-nadim
  kind: primaer
  authors: ["Ibn an-Nadim"]
  title: Kitab al-Fihrist (Verzeichnis)
  written: 987/988
  note: Katalog der in Bagdad bekannten arabischen Bücher eines Buchhändlers, einschließlich der Übersetzungen aus dem Griechischen, Syrischen und Persischen.
- id: q-al-khwarizmi
  kind: primaer
  authors: ["Muhammad ibn Musa al-Khwarizmi"]
  title: Al-Kitab al-mukhtasar fi hisab al-dschabr wa-l-muqabala
  written: um 820–830
  note: Lehrbuch des Rechnens durch „Ergänzen und Ausgleichen“, dem Kalifen al-Ma'mun gewidmet; von „al-dschabr“ leitet sich das Wort „Algebra“ ab.
