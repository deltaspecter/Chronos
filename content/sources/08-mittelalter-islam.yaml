- id: q-tabari
  kind: primaer
  authors: ["at-Tabari"]
  title: Tarikh ar-rusul wa-l-muluk (Geschichte der Propheten und Könige)
  written: abgeschlossen um 915
  note: Universalgeschichte des in Bagdad lebenden Gelehrten, die viele ältere Überlieferungen mit Angabe der Gewährsleute zusammenstellt; Hauptquelle für die frühe Abbasidenzeit. Englische Übersetzung in 40 Bänden (State University of New York Press, 1985–2007).
- id: q-yaqubi
