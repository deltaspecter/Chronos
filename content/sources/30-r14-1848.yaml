# --- Primärquellen ---
- id: q-offenburger-programm
  kind: primaer
  authors: ["Hecker, Friedrich", "Struve, Gustav"]
  title: Die Forderungen des Volkes
  written: Offenburg, 12. September 1847
  note: Auf einer Versammlung badischer Demokraten beschlossenes Programm, das Pressefreiheit, Volksbewaffnung, Geschworenengerichte, eine gerechte Besteuerung und eine Volksvertretung beim Deutschen Bund forderte.
- id: q-mannheimer-petition
  kind: primaer
  title: Petition der Mannheimer Volksversammlung
  written: Mannheim, 27. Februar 1848
  note: Kurz nach der Pariser Februarrevolution verabschiedete Forderung nach Volksbewaffnung, Pressefreiheit, Schwurgerichten und einem deutschen Parlament – das Muster der „Märzforderungen“.
- id: q-fw4-berliner
  kind: primaer
  authors: ["Friedrich Wilhelm IV."]
  title: An meine lieben Berliner
  written: Berlin, Nacht vom 18. zum 19. März 1848
  note: Aufruf des Königs nach den Barrikadenkämpfen, der den Abzug der Truppen in Aussicht stellte, sobald die Barrikaden geräumt seien.
- id: q-fw4-deutsche-nation
  kind: primaer
  authors: ["Friedrich Wilhelm IV."]
  title: An mein Volk und an die deutsche Nation
  written: Berlin, 21. März 1848
  note: Proklamation, in der der König sich an die Spitze der nationalen Bewegung zu stellen versprach und erklärte, Preußen gehe fortan in Deutschland auf.
- id: q-fw4-bunsen
  kind: primaer
  authors: ["Friedrich Wilhelm IV."]
  title: Brief an Christian Carl Josias von Bunsen
  written: Dezember 1848
  note: Privatbrief, in dem der König eine vom Parlament angebotene Kaiserkrone als von der Revolution befleckten „Reif aus Dreck und Letten“ verhöhnte.
- id: q-palacky-1848
  kind: primaer
  authors: ["Palacký, František"]
  title: Schreiben an den Fünfzigerausschuss in Frankfurt
  written: Prag, 11. April 1848
  note: Absage des tschechischen Historikers an die Einladung, an den Vorbereitungen des deutschen Parlaments teilzunehmen; begründet mit der tschechischen Nationalität und dem Wert eines föderalen Österreich für die kleinen Völker Mitteleuropas.
- id: q-petofi-nemzeti-dal
  kind: primaer
  authors: ["Petőfi, Sándor"]
  title: Nemzeti dal (Nationallied)
  written: Pest, März 1848
  note: Am 15. März 1848 in Pest öffentlich vorgetragenes Gedicht, das zum Lied der ungarischen Revolution wurde.
- id: q-abolitionsdekret-1848
  kind: primaer
  title: Dekret der Provisorischen Regierung über die Abschaffung der Sklaverei in den Kolonien
  written: Paris, 27. April 1848
  note: Von Victor Schœlcher vorbereitetes Dekret, das die Sklaverei in allen französischen Kolonien und Besitzungen abschaffte.
- id: q-grundrechte-1848
  kind: primaer
  title: Gesetz, betreffend die Grundrechte des deutschen Volkes
  written: Frankfurt am Main, 27. Dezember 1848
  note: Von der Nationalversammlung beschlossener und als Reichsgesetz verkündeter Grundrechtskatalog, später Abschnitt VI der Reichsverfassung.
- id: q-paulskirchenverfassung
  kind: primaer
  title: Verfassung des Deutschen Reiches
  written: Frankfurt am Main, 28. März 1849
  note: Von der Nationalversammlung beschlossene Reichsverfassung mit Erbkaisertum, Reichstag aus zwei Kammern und Grundrechtskatalog; trat nie in Kraft.
- id: q-tocqueville-souvenirs
  kind: primaer
  authors: ["Tocqueville, Alexis de"]
  title: Souvenirs
  written: Frankreich, 1850–1851; veröffentlicht 1893
  note: Erinnerungen des liberalen Abgeordneten und kurzzeitigen Außenministers an die Februarrevolution und die Junikämpfe in Paris.
- id: q-schurz-lebenserinnerungen
  kind: primaer
  authors: ["Schurz, Carl"]
  title: Lebenserinnerungen
  written: USA, erschienen 1906–1912
  note: Autobiografie eines Bonner Studenten, der 1849 in Baden kämpfte, aus Rastatt entkam und später in den USA Senator und Innenminister wurde.
