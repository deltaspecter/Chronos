# Quellen und Literatur: Die normannische Eroberung Englands 1066

# --- Primärquellen ---
- id: q-teppich-von-bayeux
  kind: primaer
  title: Teppich von Bayeux (Bayeux Tapestry)
  written: Wahrscheinlich England (Canterbury?), um 1070–1080, im Auftrag Bischof Odos von Bayeux
  note: Rund 68 Meter langer und etwa einen halben Meter hoher, mit Wollfäden bestickter Leinenstreifen mit lateinischen Beischriften, der die Vorgeschichte und den Verlauf der Eroberung bis zur Schlacht bei Hastings erzählt; das Ende ist verloren.
- id: q-gesta-guillelmi
  kind: primaer
  authors: ["Wilhelm von Poitiers"]
  title: Gesta Guillelmi ducis Normannorum et regis Anglorum
  written: Normandie, um 1071–1077
  note: Lobschrift eines Kaplans Herzog Wilhelms, der dessen Thronanspruch und Feldzug ausführlich rechtfertigt; nur unvollständig überliefert, der Schluss fehlt.
- id: q-gesta-normannorum-ducum
  kind: primaer
  authors: ["Wilhelm von Jumièges"]
  title: Gesta Normannorum ducum
  written: Normandie, um 1050–1070, später von Ordericus Vitalis und Robert von Torigni erweitert
  note: Geschichte der Herzöge der Normandie von Rollo bis Wilhelm, deren letzter Teil die Eroberung Englands kurz und aus normannischer Sicht schildert.
- id: q-orderic-historia-ecclesiastica
  kind: primaer
  authors: ["Ordericus Vitalis"]
  title: Historia ecclesiastica
  written: Kloster Saint-Évroult (Normandie), um 1114–1141
  note: Umfangreiche Kirchen- und Weltgeschichte eines in England geborenen Mönchs mit englischer Mutter und normannischem Vater, der die Härte der Eroberung, besonders die Verheerung des Nordens, scharf kritisiert.
- id: q-domesday-book
  kind: primaer
  title: Domesday Book
  written: England, 1086–um 1087, auf Grundlage der Erhebung Wilhelms I.
  note: Ergebnis einer landesweiten Erhebung über Grundbesitz, Abgabenpflicht, Ressourcen und Bevölkerung Englands, in zwei Bänden (Great und Little Domesday) überliefert; der Name Domesday ist erst im 12. Jahrhundert belegt.

