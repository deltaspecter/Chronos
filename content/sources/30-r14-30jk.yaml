# Quellen und Literatur: Der Dreißigjährige Krieg und der Westfälische Frieden

# --- Primärquellen und Editionen ---
- id: q-instrumentum-pacis-osnabrugense
  kind: primaer
  title: Instrumentum Pacis Osnabrugense
  subtitle: Friedensvertrag zwischen Kaiser und Reich und der Krone Schweden
  written: Osnabrück ausgehandelt, unterzeichnet in Münster am 24. Oktober 1648
  note: Lateinischer Friedensvertrag (IPO) zwischen Kaiser Ferdinand III., den Reichsständen und Schweden, der unter anderem die Religionsverhältnisse im Reich, das Normaljahr 1624 und die schwedischen Gebietsgewinne regelte.
- id: q-instrumentum-pacis-monasteriense
  kind: primaer
  title: Instrumentum Pacis Monasteriense
  subtitle: Friedensvertrag zwischen Kaiser und Reich und der Krone Frankreich
  written: Münster, 24. Oktober 1648
  note: Lateinischer Friedensvertrag (IPM) zwischen dem Kaiser, den Reichsständen und Frankreich, der Frankreich die Bistümer Metz, Toul und Verdun bestätigte und ihm habsburgische Rechte im Elsass übertrug.
- id: q-restitutionsedikt-1629
  kind: primaer
  authors: ["Ferdinand II."]
  title: Restitutionsedikt
  written: Wien, 6. März 1629
  note: Kaiserlicher Erlass, der die Rückgabe aller seit dem Passauer Vertrag von 1552 von Protestanten eingezogenen geistlichen Güter an die katholische Kirche anordnete.
- id: q-prager-frieden-1635
  kind: primaer
  title: Prager Frieden
  written: Prag, 30. Mai 1635
  note: Friedensvertrag zwischen Kaiser Ferdinand II. und Kurfürst Johann Georg I. von Sachsen, dem sich fast alle Reichsstände anschlossen; er setzte das Restitutionsedikt faktisch aus und verbot Sonderbündnisse.
- id: q-grimmelshausen-simplicissimus
  kind: primaer
  authors: ["Grimmelshausen, Hans Jakob Christoffel von"]
  title: Der Abentheurliche Simplicissimus Teutsch
  written: Nürnberg, erschienen 1668 (Titelblatt 1669)
  note: Roman in Ich-Form über einen Jungen, der im Krieg aufwächst; literarische Verarbeitung von Gewalterfahrungen durch einen Autor, der selbst als Kind in den Krieg geriet und als Soldat und Regimentsschreiber diente.
- id: q-gryphius-thraenen
  kind: primaer
  authors: ["Gryphius, Andreas"]
  title: Thränen des Vatterlandes. Anno 1636
  written: Sonett, erstmals gedruckt 1637, später überarbeitet
  note: Berühmtes Barocksonett über die Verwüstung Deutschlands durch Krieg, Brand, Seuchen und Hunger.
- id: peters-1993
  kind: edition
  editors: ["Peters, Jan"]
  title: Ein Söldnerleben im Dreißigjährigen Krieg
  subtitle: Eine Quelle zur Sozialgeschichte
  place: Berlin
  publisher: Akademie Verlag
  year: 1993
  note: Edition des Tagebuchs eines einfachen Söldners, der von 1625 bis 1649 in bayerischen, kaiserlichen und schwedischen Diensten stand; der Verfasser wurde später als Peter Hagendorf identifiziert.
- id: acta-pacis-westphalicae
  kind: edition
  editors: ["Braubach, Max", "Repgen, Konrad"]
  title: Acta Pacis Westphalicae
  place: Münster
  publisher: Aschendorff
  year: 1962 ff.
  note: Große Edition der Verhandlungsakten, Korrespondenzen und Protokolle des Westfälischen Friedenskongresses, herausgegeben von der Vereinigung zur Erforschung der Neueren Geschichte.

