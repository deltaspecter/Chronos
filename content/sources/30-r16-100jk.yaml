# Quellen und Literatur: Der Hundertjährige Krieg (Runde 16, r16-100jk)

# --- Primärquellen ---
- id: q-froissart
  kind: primaer
  authors: ["Froissart, Jean"]
  title: Chroniques
  written: Hennegau, Paris und England, um 1370 bis nach 1400
  note: Umfangreichste erzählende Chronik des Krieges bis um 1400, aus der Sicht ritterlicher Ehre geschrieben; für die frühen Jahre stützt sich Froissart stark auf Jean le Bel und wurde mehrfach überarbeitet.
- id: q-prozess-jeanne-d-arc
  kind: primaer
  authors: []
  title: Akten des Verurteilungsprozesses gegen Jeanne d'Arc
  written: Rouen, Januar bis Mai 1431
  note: Protokolle der Verhöre und Urteile des Inquisitionsprozesses unter Bischof Pierre Cauchon, überliefert in französischer Mitschrift und späterer lateinischer Fassung; sie geben Jeannes Antworten in den Formulierungen der Notare wieder.
- id: q-nullitaetsprozess
  kind: primaer
  authors: []
  title: Akten des Nullitätsprozesses (Rehabilitierungsprozess) für Jeanne d'Arc
  written: Paris, Rouen, Orléans und Domrémy, 1455–1456
  note: Zeugenaussagen von über hundert Personen aus Jeannes Heimat, ihren Feldzügen und dem Prozess von 1431, gesammelt mit dem Ziel, das Urteil aufzuheben – daher selbst parteiisch.
- id: q-vertrag-troyes
  kind: primaer
  authors: []
  title: Vertrag von Troyes
  written: Troyes, 21. Mai 1420
  note: Vertrag zwischen Karl VI. von Frankreich und Heinrich V. von England, der Heinrich zum Regenten und Erben der französischen Krone bestimmte und den Dauphin Karl ausschloss.
- id: q-christine-ditie
  kind: primaer
  authors: ["Christine de Pizan"]
  title: Le Ditié de Jehanne d'Arc
  written: Juli 1429
  note: Gedicht der Schriftstellerin Christine de Pizan nach der Krönung in Reims – das einzige zu Jeannes Lebzeiten verfasste literarische Werk über sie.
- id: q-journal-bourgeois
  kind: primaer
  authors: []
  title: Journal d'un bourgeois de Paris
  written: Paris, 1405–1449
  note: Tagebuchartige Aufzeichnungen eines anonymen, burgundisch gesinnten Pariser Geistlichen über Bürgerkrieg, Teuerung, englische Herrschaft und Jeanne d'Arc.
- id: q-gesta-henrici-quinti
  kind: primaer
  authors: []
  title: Gesta Henrici Quinti
  written: England, um 1416–1417
  note: Lateinischer Bericht eines anonymen Kaplans aus dem Gefolge Heinrichs V. über den Feldzug von 1415, der den Sieg von Azincourt als Gottesurteil für den englischen König deutet.

