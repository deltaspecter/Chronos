# --- Primärquellen ---
- id: q-friedrich-histoire-guerre
  kind: primaer
  authors: ["Friedrich II. von Preußen"]
  title: Histoire de la guerre de sept ans
  written: Potsdam, um 1763/64; postum 1788 gedruckt
  note: Darstellung des Kriegs aus der Feder des preußischen Königs, die seine Entscheidungen rechtfertigt und das Bild des Kriegs in Preußen nachhaltig prägte.
- id: q-braeker-lebensgeschichte
  kind: primaer
  authors: ["Bräker, Ulrich"]
  title: Lebensgeschichte und Natürliche Ebentheuer des Armen Mannes im Tockenburg
  written: Toggenburg (Schweiz), 1780er Jahre; gedruckt Zürich 1789
  note: Autobiografie eines Schweizer Kleinbauernsohns, der in die preußische Armee gepresst wurde und in der Schlacht bei Lobositz 1756 desertierte – eines der seltenen Selbstzeugnisse eines einfachen Soldaten.
- id: q-gleim-kriegslieder
  kind: primaer
  authors: ["Gleim, Johann Wilhelm Ludwig"]
  title: Preussische Kriegslieder in den Feldzügen 1756 und 1757 von einem Grenadier
  written: Halberstadt / Berlin, 1758
  note: Patriotische Gedichtsammlung, die einem fiktiven Grenadier in den Mund gelegt ist und die Verehrung Friedrichs II. schon während des Kriegs literarisch formte.
- id: q-voltaire-candide
  kind: primaer
  authors: ["Voltaire"]
  title: Candide ou l'Optimisme
  written: Genf, 1759
  note: Satirischer Roman, der die Grausamkeit des Kriegs verspottet und den Kolonialkonflikt in Kanada als Streit um ein paar Morgen Schnee abtut.
- id: q-lessing-minna
  kind: primaer
  authors: ["Lessing, Gotthold Ephraim"]
  title: Minna von Barnhelm, oder das Soldatenglück
  written: Berlin / Hamburg, 1763–1767
  note: Lustspiel, das unmittelbar nach Kriegsende spielt und die Lage abgedankter Offiziere sowie das Verhältnis von Preußen und Sachsen verarbeitet.
- id: q-ghulam-husain-siyar
  kind: primaer
  authors: ["Ghulam Husain Khan Tabatabai"]
  title: Siyar al-Muta'akhkhirin
  written: Bengalen, um 1780/81
  note: Persischsprachige Chronik eines Angehörigen der nordindischen Elite, die den Niedergang der Moguln und den Aufstieg der Ostindien-Kompanie in Bengalen aus indischer Sicht schildert.
- id: q-frieden-paris-1763
  kind: primaer
  title: Definitivfrieden von Paris zwischen Großbritannien, Frankreich und Spanien
  written: Paris, 10. Februar 1763
  note: Vertrag, der den Krieg in Übersee beendete und die Gebietsverschiebungen in Nordamerika, der Karibik, Westafrika und Indien festschrieb.
- id: q-frieden-hubertusburg
  kind: primaer
  title: Friedensverträge von Hubertusburg
  written: Schloss Hubertusburg (Sachsen), 15. Februar 1763
  note: Verträge Preußens mit Österreich und mit Sachsen, die den Krieg in Mitteleuropa auf der Grundlage des Vorkriegsstands beendeten.
