- id: q-thukydides
  kind: primaer
  authors: ["Thukydides"]
  title: Geschichte des Peloponnesischen Krieges
  written: spätes 5. Jahrhundert v. Chr.
  note: Darstellung des Krieges zwischen Athen und Sparta durch einen athenischen Strategen; enthält die Leichenrede des Perikles und den Melierdialog. Die Reden sind vom Autor gestaltet, nicht wörtlich überliefert.
- id: q-athenaion-politeia
  kind: primaer
  authors: ["Aristoteles (Schule des Aristoteles)"]
  title: Athenaion Politeia (Der Staat der Athener)
  written: um 330–322 v. Chr.
  note: Darstellung der Verfassungsgeschichte und der Institutionen Athens, fast vollständig erst 1890 auf einem Papyrus aus Ägypten wiederentdeckt.
- id: q-pseudo-xenophon
  kind: primaer
  authors: ["Pseudo-Xenophon („Der Alte Oligarch“)"]
  title: Athenaion Politeia (Die Verfassung der Athener)
  written: wohl 420er Jahre v. Chr.
  note: Kurze, kritische Schrift eines unbekannten Gegners der Demokratie, der dennoch erklärt, warum sie aus Sicht der einfachen Bürger folgerichtig funktioniere – das älteste erhaltene Prosawerk Athens.

