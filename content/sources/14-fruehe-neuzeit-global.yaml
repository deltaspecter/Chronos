- id: q-buke-shohatto
  kind: primaer
  title: Buke shohatto (Gesetze für die Kriegerhäuser)
  written: 1615, mehrfach überarbeitet
  note: Regeln des Shogunats für die Daimyō über Burgenbau, Heiraten, Lebensführung und – in der Fassung von 1635 – die Pflicht zum Wechselaufenthalt in Edo.
- id: q-sakoku-edikte
