- id: q-qianlong-edikt
  kind: primaer
  authors: ["Kaiser Qianlong"]
  title: Edikt an König Georg III. von Großbritannien
  written: "1793"
  note: Antwort auf die britische Gesandtschaft unter Lord Macartney, in der der Kaiser britische Forderungen nach Handelserleichterungen und einer ständigen Gesandtschaft zurückweist; oft als Zeichen chinesischer Abschottung zitiert, was die Forschung heute relativiert.
- id: q-lin-zexu-brief
  kind: primaer
  authors: ["Lin Zexu"]
  title: Brief an Königin Victoria
  written: "1839"
  note: Schreiben des kaiserlichen Kommissars in Kanton, der Großbritannien aufforderte, den Opiumhandel zu unterbinden, da es den Opiumkonsum im eigenen Land verbiete.
- id: q-vertrag-nanking
  kind: primaer
  title: Vertrag von Nanking
  written: 29. August 1842
  note: Friedensvertrag nach dem Ersten Opiumkrieg – Abtretung Hongkongs, Öffnung von fünf Häfen für den Handel, Entschädigungszahlungen; der erste der „ungleichen Verträge“.

