- id: q-kaempfer
  kind: primaer
  authors: ["Kaempfer, Engelbert"]
  title: Geschichte und Beschreibung von Japan
  written: Aufenthalt 1690–1692; englisch London 1727, deutsch Lemgo 1777–1779
  note: Bericht des westfälischen Arztes der Niederländischen Ostindien-Kompanie in Dejima, der zweimal an den Hof des Shōgun reiste; prägte das europäische Japanbild für über hundert Jahre.

