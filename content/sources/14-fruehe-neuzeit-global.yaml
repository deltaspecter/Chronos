- id: q-baburnama
  kind: primaer
  authors: ["Babur"]
  title: Baburnama (Erinnerungen Baburs)
  written: um 1520–1530
  note: Autobiografie des Reichsgründers in Tschagatai-Türkisch, mit Beobachtungen zu Politik, Natur und Gesellschaft – eine der frühesten Autobiografien der islamischen Welt.
- id: q-akbarnama
  kind: primaer
  authors: ["Abu'l-Fazl"]
  title: Akbarnama mit Ain-i Akbari
  written: um 1590–1602
  note: Offizielle Geschichte der Herrschaft Akbars in persischer Sprache aus der Feder seines Vertrauten; der Teil „Ain-i Akbari“ beschreibt Verwaltung, Steuern und Gesellschaft des Reiches. Eine Lobschrift, aber auch eine reiche statistische Quelle.
- id: q-bernier
  kind: primaer
  authors: ["Bernier, François"]
  title: Histoire de la dernière révolution des États du Grand Mogol
  written: Paris 1670–1671
  note: Bericht eines französischen Arztes, der etwa zwölf Jahre im Mogulreich lebte und den Thronkampf nach 1657 miterlebte; sein Bild einer Herrschaft ohne Privateigentum an Land prägte europäische Vorstellungen von „orientalischer Despotie“.

