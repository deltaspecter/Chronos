# Quellen und Literatur: Peloponnesischer Krieg

# --- Primärquellen ---
- id: q-xenophon-hellenika
  kind: primaer
  authors: ["Xenophon"]
  title: Hellenika (Griechische Geschichte)
  written: Athen bzw. Exil auf der Peloponnes, 1. Hälfte des 4. Jahrhunderts v. Chr.
  note: Fortsetzung des Thukydides von 411 bis 362 v. Chr. durch einen Zeitgenossen mit spartafreundlicher Haltung; Hauptquelle für das Kriegsende, Aigospotamoi, die Kapitulation Athens und die Herrschaft der Dreißig.
- id: q-aristophanes
  kind: primaer
  authors: ["Aristophanes"]
  title: Komödien (u. a. Acharner, Ritter, Frieden, Lysistrate, Frösche)
  written: Athen, 425–405 v. Chr.
  note: Während des Krieges an den Dionysosfesten aufgeführte Stücke, die Politiker wie Kleon verspotten, das Leiden der vertriebenen Landbevölkerung und die Kriegsmüdigkeit zeigen; als Komödien überzeichnet und nur mit Vorsicht als Tatsachenquelle zu lesen.
- id: q-hellenika-oxyrhynchia
  kind: primaer
  authors: ["Unbekannter Historiker"]
  title: Hellenika Oxyrhynchia
  written: 4. Jahrhundert v. Chr.; Papyrusfunde aus Oxyrhynchos (Ägypten), veröffentlicht ab 1908
  note: Bruchstücke eines verlorenen Geschichtswerks, das ebenfalls an Thukydides anschloss; es weicht in Einzelheiten, etwa zur Schlacht bei Notion, von Xenophon ab und war wohl über den Historiker Ephoros eine mittelbare Vorlage Diodors.

