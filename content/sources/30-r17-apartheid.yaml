# --- Primärquellen ---
- id: q-freedom-charter-1955
  kind: primaer
  authors: ["Congress of the People"]
  title: The Freedom Charter
  written: Kliptown bei Johannesburg, 26. Juni 1955
  note: Programm, das der vom ANC und seinen Verbündeten einberufene Volkskongress verabschiedete; es fordert gleiche Rechte für alle Bewohner Südafrikas und wurde zur Grundlage der Politik des ANC.
- id: q-mandela-1964
  kind: primaer
  authors: ["Mandela, Nelson"]
  title: Erklärung von der Anklagebank im Rivonia-Prozess („I am prepared to die“)
  written: Pretoria, Oberster Gerichtshof, 20. April 1964
  note: Mehrstündige Verteidigungsrede, in der Mandela den Übergang des ANC zur Sabotage begründete und sein Ideal einer demokratischen, freien Gesellschaft darlegte.
- id: q-mandela-1994
  kind: primaer
  authors: ["Mandela, Nelson"]
  title: Long Walk to Freedom
  subtitle: The Autobiography of Nelson Mandela
  place: Boston
  publisher: Little, Brown
  year: 1994
  note: Autobiografie, zum Teil heimlich auf Robben Island entworfen; wichtige, aber rückblickend gestaltete Selbstdarstellung.
- id: q-biko-1978
  kind: primaer
  authors: ["Biko, Steve"]
  editors: ["Stubbs, Aelred"]
  title: I Write What I Like
  place: London
  publisher: Bowerdean Press
  year: 1978
  note: Postum veröffentlichte Sammlung von Aufsätzen, die Biko großenteils unter dem Pseudonym „Frank Talk“ im Rundbrief der Studentenorganisation SASO schrieb, ergänzt um Interviews und Prozessaussagen.
- id: q-trc-1998
  kind: primaer
  authors: ["Truth and Reconciliation Commission of South Africa"]
  title: Truth and Reconciliation Commission of South Africa Report
  volume: 1–5
  place: Kapstadt
  publisher: Juta
  year: 1998
  written: Kapstadt, 1998 (Bände 6 und 7 folgten 2003)
  note: Abschlussbericht der Wahrheits- und Versöhnungskommission mit Analysen der schweren Menschenrechtsverletzungen 1960–1994 und Zusammenfassungen von Opferaussagen.
- id: tutu-1999
  kind: primaer
  authors: ["Tutu, Desmond"]
  title: No Future without Forgiveness
  place: London
  publisher: Rider
  year: 1999
  note: Rückblick des Vorsitzenden der Wahrheits- und Versöhnungskommission auf deren Arbeit und ihre theologisch begründete Idee der Versöhnung.
