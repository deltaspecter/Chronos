# Quellen und Literatur: Der Buddha und die Entstehung des Buddhismus

# --- Primärquellen ---
- id: q-mahaparinibbana-sutta
  kind: primaer
  authors: ["Anonym (Pali-Kanon)"]
  title: Mahāparinibbāna-Sutta
  subtitle: Die Lehrrede vom großen Verlöschen (Dīgha-Nikāya 16)
  written: Mündlich überliefert ab dem 5./4. Jh. v. Chr., schriftlich fixiert wohl im 1. Jh. v. Chr. in Sri Lanka
  note: Längste Erzählung des Pali-Kanons über die letzten Monate des Buddha, seinen Tod in Kushinagar und die Verteilung seiner Reliquien; über Jahrhunderte gewachsen und erweitert.
- id: q-dhammacakkappavattana-sutta
  kind: primaer
  authors: ["Anonym (Pali-Kanon)"]
  title: Dhammacakkappavattana-Sutta
  subtitle: Die Lehrrede vom Ingangsetzen des Rades der Lehre (Saṃyutta-Nikāya 56.11)
  written: Mündlich überliefert ab dem 5./4. Jh. v. Chr., schriftlich fixiert wohl im 1. Jh. v. Chr.
  note: Nach der Tradition die erste Predigt des Buddha im Wildpark bei Sarnath; enthält die klassische Formulierung der Vier edlen Wahrheiten und des achtfachen Pfades.
- id: q-vinaya-cullavagga
  kind: primaer
  authors: ["Anonym (Pali-Kanon)"]
  title: Cullavagga
  subtitle: Teil des Vinaya-Piṭaka (Ordensdisziplin)
  written: Über Jahrhunderte gewachsen, schriftlich fixiert wohl im 1. Jh. v. Chr.
  note: Regelwerk des Mönchsordens, das unter anderem die Aufnahme der ersten Nonnen sowie die Konzile von Rajagriha und Vaishali schildert.
- id: q-mahavamsa
  kind: primaer
  authors: ["Mahānāma (zugeschrieben)"]
  title: Mahāvaṃsa
  subtitle: Die große Chronik Sri Lankas
  written: Anuradhapura, wohl 5./6. Jh. n. Chr.
  note: Pali-Chronik des Mahavihara-Klosters, die die Geschichte des Buddhismus von den Konzilen über Ashoka bis zu den Königen Sri Lankas erzählt; Hauptquelle der „langen Chronologie“ und der Mission Mahindas.
- id: q-faxian
  kind: primaer
  authors: ["Faxian"]
  title: Foguo ji
  subtitle: Bericht über die buddhistischen Länder
  written: China, um 416 n. Chr.
  note: Reisebericht des chinesischen Mönchs Faxian, der um 399–412 n. Chr. auf dem Landweg nach Indien und über Sri Lanka auf dem Seeweg zurück reiste; beschreibt die heiligen Stätten und Klöster seiner Zeit.

