# --- Primärquellen ---
- id: q-periplus
  kind: primaer
  title: Periplus Maris Erythraei (Umsegelung des Roten Meeres)
  written: Ägypten, Mitte des 1. Jahrhunderts n. Chr.
  note: Griechisches Handbuch eines unbekannten Kaufmanns über Häfen, Waren und Seewege zwischen Ägypten, Ostafrika, Arabien und Indien; erwähnt Adulis, die Stadt der Axumiten und den Herrscher Zoskales.
- id: q-monumentum-adulitanum
  kind: primaer
  title: Monumentum Adulitanum (Inschriften von Adulis)
  written: Adulis; eine ptolemäische Inschrift des 3. Jh. v. Chr. und eine aksumitische Thron-Inschrift wohl des 2. oder 3. Jh. n. Chr.
  note: Die Originale sind verloren; erhalten sind nur die Abschriften, die Kosmas Indikopleustes nach eigener Angabe zu Beginn der Regierung Justins I. (518–527) in Adulis anfertigte und in seine Christliche Topographie aufnahm.
- id: q-ezana-inschriften
  kind: primaer
  authors: ["Ezana von Aksum"]
  title: Königsinschriften des Ezana
  written: Aksum und Umgebung, Mitte des 4. Jahrhunderts
  note: Steininschriften in Ge'ez (in äthiopischer und in südarabischer Schrift) und Griechisch über Feldzüge und Herrschaftsansprüche; die späteren nennen den christlichen Gott.
- id: q-rufinus-kirchengeschichte
  kind: primaer
  authors: ["Rufinus von Aquileia"]
  title: Historia ecclesiastica (Kirchengeschichte), Buch 10
  written: Aquileia, um 402
  note: Lateinische Fortsetzung der Kirchengeschichte des Eusebios; erzählt die Bekehrung Aksums durch Frumentius nach dem Bericht von dessen Gefährten Aedesius.
- id: q-athanasius-apologie
  kind: primaer
  authors: ["Athanasius von Alexandria"]
  title: Apologia ad Constantium (Verteidigungsschrift an Kaiser Constantius)
  written: um 357
  note: Verteidigungsschrift des Bischofs von Alexandria, die den Brief des Kaisers Constantius II. an die aksumitischen Herrscher Aizanas und Sazanas über Frumentius im Wortlaut wiedergibt.
- id: q-mani-kephalaia
  kind: primaer
  title: Kephalaia des Lehrers
  written: koptische Handschrift des 4./5. Jahrhunderts aus Medinet Madi (Ägypten); auf Lehren Manis (3. Jh.) zurückgeführt
  note: Manichäische Lehrgespräche, die Mani in den Mund gelegt werden; ein Kapitel zählt das Reich der Aksumiten zu den vier großen Reichen der Welt.
- id: q-kosmas-topographia
  kind: primaer
  authors: ["Kosmas Indikopleustes"]
  title: Christliche Topographie
  written: wohl Alexandria, um 550
  note: Griechisches Werk eines Kaufmanns und späteren Mönchs, der das Rote Meer bereist hatte; beschreibt Adulis, Aksum und den Handel nach Indien und Sri Lanka.
- id: q-abraha-marib
  kind: primaer
  authors: ["Abraha"]
  title: Inschrift Abrahas am Damm von Marib (CIH 541)
  written: Marib (Jemen), 548
  note: Sabäische Bauinschrift über die Ausbesserung des großen Staudamms, die auch Gesandtschaften aus Aksum, Byzanz, Persien und von arabischen Fürsten am Hof Abrahas verzeichnet.
- id: q-simeon-beth-arscham
  kind: primaer
  authors: ["Simeon von Beth Arscham"]
  title: Brief über die Märtyrer von Nadschran
  written: Mesopotamien, um 524
  note: Syrischer Bericht eines miaphysitischen Bischofs über die Verfolgung der Christen von Nadschran durch den himyarischen König Yusuf; parteiisch, aber zeitnah.
- id: q-kebra-nagast
  kind: primaer
  title: Kebra Nagast (Die Herrlichkeit der Könige)
  written: wohl frühes 14. Jahrhundert, Ge'ez
  note: Äthiopisches Werk, das die Herkunft der Könige von Salomo und der Königin von Saba und die Überführung der Bundeslade nach Aksum erzählt; Legitimationsschrift der salomonischen Dynastie, keine Quelle für die Antike.
