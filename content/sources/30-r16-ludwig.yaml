# Quellen und Literatur: Ludwig XIV. und der Absolutismus

# --- Primärquellen ---
- id: q-ludwig-xiv-memoires
  kind: primaer
  authors: ["Ludwig XIV."]
  title: Mémoires pour l'instruction du Dauphin
  written: Frankreich, 1660er Jahre (unter Mitarbeit von Sekretären)
  note: Für den Thronfolger bestimmte Aufzeichnungen, in denen der König seine Regierungsübernahme 1661 und seine Auffassung vom Königsamt darstellt.
- id: q-edikt-fontainebleau
  kind: primaer
  title: Edikt von Fontainebleau (Édit portant révocation de l'Édit de Nantes)
  written: Fontainebleau, Oktober 1685
  note: Königliches Edikt, das das Edikt von Nantes von 1598 widerrief, den reformierten Gottesdienst verbot und den Pfarrern die Ausreise befahl, den übrigen Hugenotten aber die Auswanderung untersagte.
- id: q-potsdamer-edikt
  kind: primaer
  authors: ["Friedrich Wilhelm von Brandenburg"]
  title: Edikt von Potsdam
  written: Potsdam, 29. Oktober 1685 (julianischer Kalender)
  note: Edikt des Großen Kurfürsten, das französischen Glaubensflüchtlingen Aufnahme, Steuerfreiheiten und eigene Gemeinden in Brandenburg-Preußen zusicherte.
- id: q-bossuet-politique
  kind: primaer
  authors: ["Bossuet, Jacques-Bénigne"]
  title: Politique tirée des propres paroles de l'Écriture sainte
  written: Frankreich, begonnen um 1679, gedruckt 1709
  note: Für den Dauphin verfasste Lehre vom Königtum, die die Herrschaft des Königs aus der Bibel ableitet und als heilig, väterlich und absolut, aber an Vernunft und göttliches Gesetz gebunden beschreibt.
- id: q-saint-simon-memoires
  kind: primaer
  authors: ["Saint-Simon, Louis de Rouvroy, duc de"]
  title: Mémoires
  written: Frankreich, niedergeschrieben vor allem 1739–1749
  note: Umfangreiche, parteiische Erinnerungen eines Herzogs über den Hof der späten Regierungszeit Ludwigs XIV. und die Régence; wichtigste, aber von Abneigung gegen den König geprägte Quelle zum Leben in Versailles.
- id: q-liselotte-briefe
  kind: primaer
  authors: ["Elisabeth Charlotte von Orléans"]
  title: Briefe
  written: Versailles, Saint-Cloud und Paris, 1672–1722
  note: Tausende Briefe der pfälzischen Prinzessin und Schwägerin des Königs, meist an Verwandte in Deutschland, mit drastischen Schilderungen des Hoflebens und Klagen über die Verwüstung der Pfalz.
- id: q-fenelon-lettre
  kind: primaer
  authors: ["Fénelon, François de Salignac de La Mothe-"]
  title: Lettre à Louis XIV
  written: Frankreich, um 1693/94
  note: Anonymer, vermutlich nie überreichter Mahnbrief des Erzbischofs, der dem König Kriegslust, Ruhmsucht und das Elend des Volkes vorhält; Verfasserschaft und Datierung gelten als weitgehend gesichert.
- id: q-vauban-dime
  kind: primaer
  authors: ["Vauban, Sébastien Le Prestre de"]
  title: Projet d'une dîme royale
  written: Frankreich, gedruckt 1707
  note: Reformschrift des Festungsbaumeisters, die die Armut der Bevölkerung beschreibt und eine einheitliche, alle Stände treffende Steuer vorschlägt; vom Rat des Königs verboten.

