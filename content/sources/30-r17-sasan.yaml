# Quellen und Literatur: Das Sasanidenreich (224–651)

# --- Primärquellen ---
- id: q-schapur-kaaba-zardoscht
  kind: primaer
  authors: ["Schapur I."]
  title: Inschrift Schapurs I. an der Ka'ba-ye Zardoscht (ŠKZ, „Res gestae divi Saporis“)
  written: Naqsch-e Rostam (Persis), um 260–270
  note: Dreisprachiger Tatenbericht (Mittelpersisch, Parthisch, Griechisch) an einem turmartigen Bau bei Naqsch-e Rostam; schildert die Siege über Gordian III., Philippus Arabs und Valerian, zählt die Provinzen des Reiches auf und stiftet Feuer für die Seelen der Königsfamilie.
- id: q-kirdir-inschriften
  kind: primaer
  authors: ["Kirdir"]
  title: Inschriften des Kirdir
  written: Persis, spätes 3. Jahrhundert
  note: Vier mittelpersische Felsinschriften des zoroastrischen Priesters (u. a. an der Ka'ba-ye Zardoscht und in Sar Maschhad), die seinen Aufstieg unter mehreren Königen, die Gründung von Feuerheiligtümern und die Bekämpfung anderer Religionen schildern.
- id: q-sasanidische-muenzen
  kind: primaer
  title: Sasanidische Münzprägung
  written: 3.–7. Jahrhundert, Münzstätten im ganzen Reich
  note: Vor allem Silberdrachmen mit Königsbild, Namen und Titel in mittelpersischer Schrift auf der Vorderseite und einem Feueraltar auf der Rückseite; ab dem späten 5. Jahrhundert mit Münzstätten- und Jahresangaben.
- id: q-sebeos
  kind: primaer
  authors: ["Sebeos (zugeschrieben)"]
  title: Armenische Geschichte
  written: Armenien, um 660
  note: Armenisches Geschichtswerk eines Zeitgenossen über die Kriege zwischen Persern und Römern vom späten 6. Jahrhundert bis zu den arabischen Eroberungen; die Zuschreibung an einen Bischof Sebeos ist unsicher.
- id: q-schahname
  kind: primaer
  authors: ["Firdausi"]
  title: Schahname (Buch der Könige)
  written: Tus (Chorasan), abgeschlossen um 1010
  note: Neupersisches Epos von rund 50.000 Doppelversen über die iranischen Könige von der Urzeit bis Yazdegerd III.; für die Sasanidenzeit keine zeitgenössische Quelle, sondern Bearbeitung einer späten, höfisch geprägten Überlieferung.

