- id: q-prokop-bauten
  kind: primaer
  authors: ["Prokop von Caesarea"]
  title: Peri ktismaton (Über die Bauten)
  written: um 554 oder später
  note: Lobschrift auf die Bauten Justinians, die mit der Beschreibung der Hagia Sophia beginnt.
- id: q-corpus-iuris
  kind: primaer
  title: Corpus iuris civilis
  written: 529–534, Novellen bis 565
  note: Neuzeitlicher Sammelname für das auf Befehl Justinians geschaffene Gesetzeswerk aus Codex, Digesten, Institutionen und den späteren Novellen.

