  title: Encyclopédie, ou Dictionnaire raisonné des sciences, des arts et des métiers
  written: Paris, 1751–1772
  note: 17 Text- und 11 Tafelbände mit über 70.000 Artikeln; mehrfach verboten und dennoch weiter gedruckt.
- id: q-montesquieu
  kind: primaer
  authors: ["Montesquieu"]
  title: De l'esprit des lois (Vom Geist der Gesetze)
  written: Genf, 1748
  note: Vergleichende Untersuchung von Regierungsformen mit der einflussreichen Lehre von der Trennung der Gewalten.
- id: q-rousseau-contrat
  kind: primaer
  authors: ["Rousseau, Jean-Jacques"]
  title: Du contrat social (Vom Gesellschaftsvertrag)
  written: Amsterdam, 1762
  note: Begründet legitime Herrschaft mit dem „Gemeinwillen“ (volonté générale) der Bürger.
- id: q-voltaire-toleranz
  kind: primaer
  authors: ["Voltaire"]
  title: Traité sur la tolérance (Abhandlung über die Toleranz)
  written: 1763
  note: Anlässlich der Hinrichtung des Protestanten Jean Calas in Toulouse verfasste Streitschrift gegen religiösen Fanatismus.
- id: q-locke-treatises
  kind: primaer
  authors: ["Locke, John"]
  title: Two Treatises of Government (Zwei Abhandlungen über die Regierung)
  written: London, 1689 (Titelblatt 1690)
  note: Begründet Herrschaft mit der Zustimmung der Regierten und dem Schutz von Leben, Freiheit und Eigentum.
- id: q-wollstonecraft
  kind: primaer
  authors: ["Wollstonecraft, Mary"]
  title: A Vindication of the Rights of Woman (Verteidigung der Rechte der Frau)
  written: London, 1792
  note: Forderte gleiche Bildung für Frauen und griff Rousseaus Vorstellungen von weiblicher Erziehung an.
- id: q-mendelssohn-jerusalem
  kind: primaer
  authors: ["Mendelssohn, Moses"]
  title: Jerusalem oder über religiöse Macht und Judentum
  written: Berlin, 1783
  note: Plädoyer für die Trennung von Staat und Religion und für Gewissensfreiheit aus der Feder des bedeutendsten jüdischen Philosophen der deutschen Aufklärung.

