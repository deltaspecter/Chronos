# --- Primärquellen und Editionen ---
- id: q-gladstone-1840
  kind: primaer
  authors: ["Gladstone, William Ewart"]
  title: Rede im britischen Unterhaus zum Krieg gegen China
  written: London, April 1840
  note: Beitrag des jungen konservativen Abgeordneten in der Unterhausdebatte über einen Tadelsantrag gegen die Regierung, in der er den Krieg als ungerecht und als Schande für Großbritannien verurteilte; überliefert in den Parlamentsprotokollen (Hansard).
- id: q-vertrag-tianjin
  kind: primaer
  title: Vertrag von Tianjin zwischen Großbritannien und China
  written: Tianjin, 26. Juni 1858
  note: Friedens- und Handelsvertrag im Zweiten Opiumkrieg – ständige Gesandtschaft in Peking, neue Vertragshäfen, Reisefreiheit im Landesinneren, Schutz der Mission und Entschädigungen; ähnliche Verträge schlossen Frankreich, Russland und die USA.
- id: q-konvention-peking
  kind: primaer
  title: Konvention von Peking zwischen Großbritannien und China
  written: Peking, 24. Oktober 1860
  note: Abkommen nach der Einnahme Pekings, das den Vertrag von Tianjin bestätigte, die Entschädigungen erhöhte, Tianjin öffnete und die Südspitze der Halbinsel Kowloon an Großbritannien abtrat; am folgenden Tag schloss Frankreich eine entsprechende Konvention.
- id: q-haiguo-tuzhi
  kind: primaer
  authors: ["Wei Yuan"]
  title: Haiguo tuzhi (Illustrierte Abhandlung über die Länder jenseits der Meere)
  written: China, erste Fassung um 1843/44, bis 1852 erweitert
  note: Geografisches Sammelwerk über die westlichen Länder, das auf Material zurückgriff, das Lin Zexu in Kanton hatte übersetzen lassen, und forderte, von den überlegenen Techniken der Fremden zu lernen, um sie abzuwehren.
- id: q-hugo-1861
  kind: primaer
  authors: ["Hugo, Victor"]
  title: Brief an Hauptmann Butler über die Plünderung des Sommerpalasts
  written: Hauteville House (Guernsey), 25. November 1861
  note: Antwort des im Exil lebenden Schriftstellers auf die Bitte um Zustimmung zur Chinaexpedition, in der er die Plünderung und Zerstörung des Yuanmingyuan als Tat zweier Räuber – Frankreich und England – verurteilte; später in „Actes et paroles“ veröffentlicht.
- id: q-elgin-1872
  kind: edition
  editors: ["Walrond, Theodore"]
  title: Letters and Journals of James, Eighth Earl of Elgin
  place: London
  publisher: John Murray
  year: 1872
  note: Briefe und Tagebücher des britischen Sonderbevollmächtigten in China 1857–1860, der die Verträge von Tianjin und Peking aushandelte und die Zerstörung des Sommerpalasts befahl.
