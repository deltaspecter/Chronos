# Quellen und Literatur: Der Faschismus in Italien (r15-fasch)

# --- Primärquellen ---
- id: q-mussolini-rede-1925
  kind: primaer
  authors: ["Mussolini, Benito"]
  title: Rede vor der Abgeordnetenkammer vom 3. Januar 1925
  written: Rom, Camera dei deputati, 3. Januar 1925
  note: Rede, in der Mussolini nach dem Mord an Giacomo Matteotti die politische, moralische und historische Verantwortung für alles Geschehene übernahm und damit den Übergang zur offenen Diktatur einleitete.
- id: q-lateranvertraege
  kind: primaer
  authors: ["Mussolini, Benito", "Gasparri, Pietro"]
  title: Lateranverträge zwischen dem Heiligen Stuhl und dem Königreich Italien
  written: Rom, Lateranpalast, 11. Februar 1929
  note: Staatsvertrag, Konkordat und Finanzabkommen, mit denen der Vatikanstaat entstand, der Katholizismus Staatsreligion wurde und die seit 1870 offene „Römische Frage“ beigelegt war.
- id: q-dottrina-del-fascismo
  kind: primaer
  authors: ["Mussolini, Benito", "Gentile, Giovanni"]
  title: La dottrina del fascismo
  container: Enciclopedia Italiana, Bd. 14
  written: Rom, 1932
  note: Unter Mussolinis Namen veröffentlichter Lexikonartikel, dessen philosophischen Teil weitgehend Giovanni Gentile verfasste; offizielle Selbstdeutung des Faschismus als totalitäre, antiliberale Staatsidee.
- id: q-haile-selassie-1936
  kind: primaer
  authors: ["Haile Selassie I."]
  title: Rede vor der Versammlung des Völkerbunds
  written: Genf, 30. Juni 1936
  note: Rede des exilierten äthiopischen Kaisers, der den Einsatz von Giftgas gegen Soldaten und Zivilisten schilderte und den Völkerbund an seine Pflicht zur kollektiven Sicherheit erinnerte.
- id: q-rassengesetz-1938
  kind: primaer
  authors: ["Königreich Italien"]
  title: Regio decreto-legge 17 novembre 1938, n. 1728 – Provvedimenti per la difesa della razza italiana
  written: Rom, 17. November 1938
  note: Zentrales Gesetz der faschistischen Rassengesetzgebung, das Ehen zwischen „Ariern“ und Juden verbot und Jüdinnen und Juden aus Staatsdienst, Armee und vielen Berufen ausschloss.

