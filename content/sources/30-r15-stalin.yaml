# --- Primärquellen ---
- id: q-stalin-1931
  kind: primaer
  authors: ["Stalin, Josef"]
  title: Über die Aufgaben der Wirtschaftler
  written: Moskau, 4. Februar 1931
  note: Rede vor der Ersten Unionskonferenz der Funktionäre der sozialistischen Industrie, in der Stalin das Tempo der Industrialisierung mit dem Rückstand gegenüber den „fortgeschrittenen Ländern“ begründete.
- id: q-stalin-1930
  kind: primaer
  authors: ["Stalin, Josef"]
  title: Vor Erfolgen von Schwindel befallen
  written: Prawda, 2. März 1930
  note: Zeitungsartikel, in dem Stalin „Überspitzungen“ bei der Kollektivierung örtlichen Funktionären anlastete und einen vorübergehenden Rückzug einleitete.
- id: q-befehl-00447
  kind: primaer
  authors: ["Jeschow, Nikolai"]
  title: Operativer Befehl Nr. 00447 des NKWD „Über die Operation zur Repression ehemaliger Kulaken, Krimineller und anderer antisowjetischer Elemente“
  written: Moskau, 30. Juli 1937
  note: Geheimer Befehl, der für jede Region Quoten für Erschießungen und Lagerhaft festlegte und von „Troikas“ ohne Gerichtsverfahren ausgeführt wurde; seit den 1990er-Jahren veröffentlicht.
- id: q-chruschtschow-1956
  kind: primaer
  authors: ["Chruschtschow, Nikita"]
  title: Über den Personenkult und seine Folgen
  written: Moskau, 25. Februar 1956
  note: Sogenannte Geheimrede vor den Delegierten des XX. Parteitags der KPdSU, die Stalins Verbrechen an Parteimitgliedern anprangerte; in der Sowjetunion erst 1989 veröffentlicht.
- id: q-solschenizyn-1973
  kind: primaer
  authors: ["Solschenizyn, Alexander"]
  title: Der Archipel GULAG
  written: Paris (russische Erstausgabe, YMCA-Press), 1973–1975
  note: Auf eigener Haft und den Berichten von über 200 ehemaligen Häftlingen beruhende „literarische Untersuchung“ des sowjetischen Lagersystems, die dem Wort „Gulag“ weltweite Bekanntheit verschaffte.
