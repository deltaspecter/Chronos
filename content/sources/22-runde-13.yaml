  authors: ["Clay, Lucius D."]
  title: Decision in Germany
  written: Garden City, N. Y., 1950
  note: Erinnerungen des amerikanischen Militärgouverneurs in Deutschland 1947–1949, der die Luftbrücke organisierte; deutsch als „Entscheidung in Deutschland“ (1950).

# --- Bandung-Konferenz ---
