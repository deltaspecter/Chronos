- id: q-marshall-1947
  kind: primaer
  authors: ["Marshall, George C."]
  title: Rede an der Harvard University
  written: Cambridge, Mass., 5. Juni 1947
  note: Ansprache des amerikanischen Außenministers, die ein umfassendes Hilfsprogramm für den Wiederaufbau Europas ankündigte – den späteren Marshallplan.
- id: q-reuter-1948
  kind: primaer
  authors: ["Reuter, Ernst"]
  title: Rede auf der Kundgebung vor dem Reichstagsgebäude
