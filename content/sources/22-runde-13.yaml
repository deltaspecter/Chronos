  year: 2007
- id: ampiah-2007
  kind: sekundaer
  authors: ["Ampiah, Kweku"]
  title: The Political and Moral Imperatives of the Bandung Conference of 1955
  subtitle: The Reactions of the US, UK and Japan
  place: Folkestone
  publisher: Global Oriental
  year: 2007
- id: q-sukarno-1955
  kind: primaer
  authors: ["Sukarno"]
  title: Eröffnungsrede der Asiatisch-Afrikanischen Konferenz („Let a New Asia and a New Africa be Born“)
  written: Bandung, 18. April 1955
  note: Rede des indonesischen Präsidenten, die die Konferenz als erste interkontinentale Versammlung „farbiger Völker“ der Geschichte bezeichnete und den Kolonialismus als noch nicht überwunden beschrieb.
- id: q-bandung-kommunique
  kind: primaer
  title: Schlusskommuniqué der Asiatisch-Afrikanischen Konferenz
  written: Bandung, 24. April 1955
  note: Gemeinsame Erklärung der 29 Teilnehmerstaaten zu wirtschaftlicher und kultureller Zusammenarbeit, Menschenrechten, Selbstbestimmung und Kolonialismus, mit zehn Grundsätzen für das friedliche Zusammenleben der Staaten.
- id: q-panchsheel-1954
  kind: primaer
  title: Abkommen zwischen Indien und China über Handel und Verkehr zwischen Tibet und Indien
  written: Peking, 29. April 1954
  note: Vertrag, dessen Präambel die „Fünf Prinzipien der friedlichen Koexistenz“ (Panchsheel) formulierte, auf die sich Nehru und Zhou Enlai in Bandung beriefen.
- id: q-wright-1956
  kind: primaer
  authors: ["Wright, Richard"]
  title: The Color Curtain
  subtitle: A Report on the Bandung Conference
  written: Cleveland und New York, 1956
  note: Reportage des afroamerikanischen Schriftstellers, der als Beobachter nach Bandung reiste und die Konferenz als Aufstand der „Gedemütigten und Beleidigten“ der Welt beschrieb.

