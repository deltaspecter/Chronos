- id: q-genji
  kind: primaer
  authors: ["Murasaki Shikibu"]
  title: Genji monogatari (Die Geschichte vom Prinzen Genji)
  written: Anfang des 11. Jahrhunderts
  note: Roman in 54 Kapiteln über das Leben und die Liebschaften des Prinzen Genji und seiner Nachkommen am Kaiserhof; 1008 im Tagebuch der Autorin erstmals erwähnt.
- id: q-makura-no-soshi
  kind: primaer
  authors: ["Sei Shōnagon"]
  title: Makura no sōshi (Kopfkissenbuch)
  written: um 1000
  note: Sammlung von Beobachtungen, Listen und Episoden einer Hofdame der Kaiserin Teishi; ein lebendiges, sehr subjektives Bild des Hoflebens.
- id: q-kokinshu
  kind: primaer
  title: Kokin wakashū (Sammlung alter und neuer japanischer Gedichte)
  written: um 905
  note: Erste kaiserlich in Auftrag gegebene Anthologie von Gedichten in japanischer Sprache; das Vorwort in Kana gilt als erste Dichtungstheorie Japans.
- id: q-midokanpakuki
  kind: primaer
  authors: ["Fujiwara no Michinaga"]
  title: Midō kanpakuki (Tagebuch des Michinaga)
  written: 998–1021
  note: Eigenhändiges Tagebuch des mächtigsten Regenten der Heian-Zeit, in Teilen im Original erhalten; seit 2013 im Register „Memory of the World“ der UNESCO.
- id: q-heike
  kind: primaer
  title: Heike monogatari (Die Geschichte der Taira)
  written: 13. Jahrhundert
  note: Kriegserzählung über den Aufstieg und Untergang des Hauses Taira im Genpei-Krieg, ursprünglich von blinden Spielleuten vorgetragen; mehr Literatur als Chronik.
