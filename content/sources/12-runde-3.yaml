- id: q-tursun-beg
  kind: primaer
  authors: ["Tursun Beg"]
  title: Tarih-i Ebü'l-Feth (Geschichte des Vaters der Eroberung)
  written: um 1488
  note: Osmanische Geschichte Mehmeds II. aus der Feder eines Beamten, der an der Belagerung teilnahm.

