# --- Primärquellen ---
- id: q-kaschgari
  kind: primaer
  authors: ["Mahmud al-Kaschgari"]
  title: Diwan lughat at-Turk (Sammlung der Sprachen der Türken)
  written: Bagdad, um 1072–1077
  note: Arabisch geschriebenes Wörterbuch türkischer Dialekte, das auch die Stämme der Oghusen aufzählt und den Clan der Seldschuken nennt.
- id: q-matthaeus-von-edessa
  kind: primaer
  authors: ["Matthäus von Edessa"]
  title: Chronik
  written: Edessa, erste Hälfte des 12. Jahrhunderts
  note: Armenische Chronik der Jahre 952–1136, die die türkischen Einfälle in Armenien und Anatolien aus der Sicht der betroffenen christlichen Bevölkerung schildert.
- id: q-attaleiates
  kind: primaer
  authors: ["Michael Attaleiates"]
  title: Historia
  written: Konstantinopel, um 1079/80
  note: Zeitgeschichte eines byzantinischen Richters und Beamten, der Kaiser Romanos IV. auf dem Feldzug von 1071 begleitete; wichtigster Augenzeugenbericht zu Manzikert.
- id: q-siyasatnama
  kind: primaer
  authors: ["Nizam al-Mulk"]
  title: Siyar al-muluk (Siyasatnama, Buch der Staatskunst)
  written: Iran, um 1091/92
  note: Persischer Fürstenspiegel des seldschukischen Wesirs, der Ratschläge zu Regierung, Steuern, Militär und Spionage mit Anekdoten aus der Geschichte verbindet.
- id: q-ghazali-munqidh
  kind: primaer
  authors: ["al-Ghazali"]
  title: Al-Munqidh min ad-dalal (Der Erretter aus dem Irrtum)
  written: Iran, um 1106–1110
  note: Autobiografischer Bericht des Gelehrten über seinen Weg durch Theologie, Philosophie und ismailitische Lehre zur Mystik, einschließlich seines Rückzugs aus der Nizamiyya in Bagdad.
- id: q-ibn-bibi
  kind: primaer
  authors: ["Ibn Bibi"]
  title: Al-Awamir al-Ala'iyya (Die alaiyyischen Verordnungen)
  written: Anatolien, um 1280/85
  note: Persische Hofchronik der Rum-Seldschuken von etwa 1192 bis 1280, verfasst von einem Kanzleibeamten; Hauptquelle für das Sultanat von Konya.
- id: q-masnawi
  kind: primaer
  authors: ["Dschalal ad-Din Rumi"]
  title: Masnawi-yi ma'nawi (Gedicht der inneren Bedeutung)
  written: Konya, um 1258–1273
  note: Persisches Lehrgedicht von rund 25.000 Doppelversen, das mystische Lehre in Geschichten, Gleichnissen und Koranauslegung vermittelt.
