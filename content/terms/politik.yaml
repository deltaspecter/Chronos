- id: senat
  name: Senat
  aliases: [Senatus]
  definition: In der Römischen Republik der Rat der ehemaligen Magistrate (meist um 300, nach Sulla etwa 600 Mitglieder). Er beriet formal nur, lenkte aber faktisch Außenpolitik, Finanzen und Provinzverwaltung.
  themes: [verfassung-recht]
- id: konsul
  name: Konsul
  aliases: [Consul, Konsulat]
  definition: Höchstes jährlich gewähltes Amt der Römischen Republik, stets mit zwei Inhabern besetzt; die Konsuln führten die Heere, beriefen Senat und Volksversammlungen und gaben dem Jahr ihren Namen.
  themes: [verfassung-recht]
- id: volkstribun
  name: Volkstribun
  aliases: [Tribunus plebis, Tribunat]
  definition: Zehn jährlich von der Plebs gewählte Amtsträger, die als unverletzlich galten und mit ihrem Einspruch (intercessio) Handlungen anderer Magistrate blockieren konnten.
  themes: [verfassung-recht]
- id: nobilitaet
  name: Nobilität
  aliases: [Nobilitas, Nobiles]
  definition: Die Führungsschicht der Römischen Republik seit dem 4. Jh. v. Chr., bestehend aus patrizischen und plebejischen Familien, die bereits Konsuln gestellt hatten.
  themes: [gesellschaft, politik]
- id: klientel
  name: Klientel
  aliases: [Patronat, Clientela, Klient, Patron]
  definition: In Rom ein dauerhaftes Verhältnis gegenseitiger Verpflichtung zwischen einem mächtigen Patron und abhängigen Klienten – Schutz und Hilfe gegen Loyalität und Unterstützung.
  themes: [gesellschaft]
- id: cursus-honorum
  name: Cursus honorum
  aliases: [Ämterlaufbahn]
  definition: Die festgelegte Reihenfolge der römischen Ämter (Quästur, Ädilität, Prätur, Konsulat) mit Mindestaltern und Pausen, gesetzlich seit 180 v. Chr. geregelt.
  themes: [verfassung-recht]
- id: imperium
  name: Imperium
  aliases: [Befehlsgewalt]
  definition: Die Befehls- und Zwangsgewalt höherer römischer Magistrate (Konsuln, Prätoren, Diktatoren) und Statthalter, insbesondere über Truppen. Später auch Bezeichnung für den römischen Herrschaftsbereich.
  themes: [verfassung-recht, imperien]
- id: patrizier-plebejer
  name: Patrizier und Plebejer
  aliases: [Patrizier, Plebejer, Plebs, Ständekämpfe]
  definition: Die beiden Stände der frühen römischen Bürgerschaft. Die Patrizier – eine kleine Gruppe alter Familien – beanspruchten anfangs Ämter und Priesterschaften für sich; die Plebejer erkämpften bis 287 v. Chr. die politische Gleichberechtigung.
  themes: [gesellschaft, politik]
- id: mischverfassung
  name: Mischverfassung
  aliases: [Gemischte Verfassung, Politeia mikte]
  definition: Staatstheoretisches Modell, nach dem eine Verbindung monarchischer, aristokratischer und demokratischer Elemente die stabilste Ordnung bildet; von Polybios auf Rom angewandt und für die Verfassungsdebatten der Neuzeit einflussreich.
  themes: [verfassung-recht]
- id: provinz
  name: Provinz
  aliases: [Provincia]
  definition: Ursprünglich der Aufgabenbereich eines römischen Magistrats, seit dem 3. Jh. v. Chr. ein dauerhaft von einem Statthalter verwaltetes, abgabepflichtiges Gebiet außerhalb Italiens. Sizilien wurde 241 v. Chr. die erste Provinz.
  themes: [imperien]
- id: optimaten-popularen
  name: Optimaten und Popularen
  aliases: [Optimaten, Popularen, Optimates, Populares]
  definition: Bezeichnungen der späten Römischen Republik für zwei politische Methoden – Berufung auf die Autorität des Senats bzw. Durchsetzung von Anliegen über die Volksversammlung. Es handelte sich nicht um Parteien.
  themes: [politik]
- id: senatus-consultum-ultimum
  name: Senatus consultum ultimum
  aliases: [Notstandsbeschluss, SCU]
  definition: „Äußerster Senatsbeschluss“, mit dem der Senat seit 121 v. Chr. die Magistrate aufforderte, dafür zu sorgen, dass der Staat keinen Schaden nehme – faktisch eine Ermächtigung zur Gewaltanwendung gegen Bürger.
  themes: [verfassung-recht]
- id: proskription
  name: Proskription
  aliases: [Proscriptio, Ächtung]
  definition: Öffentliche Ächtung politischer Gegner durch ausgehängte Listen, deren Erfassten getötet werden durften und deren Vermögen eingezogen wurde; unter Sulla (82 v. Chr.) und dem Zweiten Triumvirat (43 v. Chr.).
  themes: [politik, gewalt-genozid]
- id: diktator
  name: Diktator (Rom)
  aliases: [Dictator, Diktatur]
  definition: In der Römischen Republik ein außerordentlicher Oberbeamter, der in Notlagen für höchstens sechs Monate ernannt wurde. Sulla und Caesar übernahmen das Amt ohne zeitliche Begrenzung.
  themes: [verfassung-recht]
- id: prinzipat
  name: Prinzipat
  aliases: [Principatus, Princeps]
  definition: Die von Augustus begründete Herrschaftsform der frühen und hohen römischen Kaiserzeit, in der der Herrscher als „erster Bürger“ (princeps) auftrat und seine Macht auf aus republikanischen Ämtern abgeleitete Befugnisse stützte.
  themes: [verfassung-recht, politik]
- id: tribunicia-potestas
  name: Tribunicia potestas
  aliases: [Tribunizische Gewalt]
  definition: Die Rechte eines Volkstribunen (Unverletzlichkeit, Veto, Gesetzesinitiative), die Augustus seit 23 v. Chr. auf Lebenszeit besaß, ohne das Amt selbst zu bekleiden; Grundlage der Kaisermacht.
  themes: [verfassung-recht]
- id: stadtstaat
  name: Stadtstaat
  aliases: [Polis, Stadtstaaten]
  definition: Ein politisch selbstständiges Gemeinwesen, das aus einer Stadt und dem von ihr kontrollierten Umland besteht – etwa in Sumer, im antiken Griechenland, bei den Maya oder im Italien der Renaissance.
  themes: [politik]
- id: zikkurat
  name: Zikkurat
  aliases: [Ziqqurat, Stufentempel, Tempelturm]
  definition: Gestufter Tempelturm aus Lehmziegeln in Mesopotamien, auf dessen Spitze ein Heiligtum stand. Die Zikkurat von Ur (um 2100 v. Chr.) ist eine der am besten erhaltenen.
  themes: [religion, kultur-kunst]
- id: keilschrift
  name: Keilschrift
  aliases: [Cuneiform]
  definition: Schriftsystem Mesopotamiens, dessen Zeichen mit einem Griffel keilförmig in Ton gedrückt wurden; um 3300 v. Chr. in Uruk entstanden, über 3000 Jahre lang für zahlreiche Sprachen verwendet und im 19. Jh. entziffert.
  themes: [schrift-medien]
- id: pharao
  name: Pharao
  aliases: [Per-aa]
  definition: Bezeichnung des ägyptischen Königs, von ägyptisch per-aa („großes Haus“, ursprünglich der Palast); erst seit dem Neuen Reich für die Person des Herrschers gebraucht.
  themes: [politik, religion]
- id: maat
  name: Maat
  aliases: [Ma'at]
  definition: Ägyptischer Begriff für die richtige Ordnung der Welt – Wahrheit, Gerechtigkeit und kosmisches Gleichgewicht; ihre Erhaltung war die zentrale Aufgabe des Königs.
  themes: [religion]
- id: mastaba
  name: Mastaba
  definition: Rechteckiger ägyptischer Grabbau mit flachem Dach und geneigten Wänden über einem unterirdischen Grabschacht; Vorläufer der Pyramide.
  themes: [kultur-kunst, archaeologie]
- id: hieroglyphen
  name: Hieroglyphen
  aliases: [Hieroglyphenschrift]
  definition: Bilderschrift des alten Ägypten mit Laut-, Wort- und Deutzeichen, verwendet von etwa 3200 v. Chr. bis 394 n. Chr.; 1822 von Jean-François Champollion entziffert.
  themes: [schrift-medien]
- id: kandake
  name: Kandake
  aliases: [Kdke, Candace]
  definition: Titel der Königin oder Königinmutter im Reich von Meroe; mehrere Kandaken regierten als Alleinherrscherinnen.
  themes: [politik]
- id: meroitische-schrift
  name: Meroitische Schrift
  aliases: [Meroitisch]
  definition: Eigene Schrift des Reiches von Meroe (ab dem 2. Jh. v. Chr.) in hieroglyphischer und kursiver Form; seit 1909–1911 lesbar, die Sprache ist aber nur in Ansätzen verstanden.
  themes: [schrift-medien]
- id: satrapie
  name: Satrapie
  aliases: [Satrap, Satrapen]
  definition: Provinz des Perserreiches unter einem Statthalter (Satrap), der Abgaben einzog, Truppen stellte und Recht sprach; später auch in hellenistischen Reichen verwendet.
  themes: [imperien, verfassung-recht]
- id: grosskoenig
  name: Großkönig
  aliases: [König der Könige, Schahanschah]
  definition: Titel der persischen Herrscher („König der Könige“), der ihre Stellung über unterworfenen Königen und Völkern ausdrückte.
  themes: [politik]
- id: dhamma
  name: Dhamma (Ashoka)
  aliases: [Dharma, Dhamma-Politik]
  definition: In den Inschriften Ashokas eine allgemeine Ethik von Gewaltlosigkeit, Toleranz, Freigebigkeit und Fürsorge, die der König im ganzen Reich verkündete; nicht gleichbedeutend mit einer bestimmten Religion.
  themes: [religion, politik]
- id: brahmi
  name: Brahmi-Schrift
  aliases: [Brahmi]
  definition: Älteste gut belegte Schrift Südasiens, verwendet in den Inschriften Ashokas; Vorläuferin zahlreicher südasiatischer und südostasiatischer Schriften. 1837 von James Prinsep entziffert.
  themes: [schrift-medien]
- id: legalismus
  name: Legalismus
  aliases: [Fajia, Schule der Gesetze]
  definition: Spätere Sammelbezeichnung für chinesische Staatstheoretiker wie Shang Yang und Han Feizi, die Ordnung durch strenge, für alle geltende Gesetze, Belohnung und Strafe sichern wollten; prägend für den Staat Qin.
  themes: [politik, verfassung-recht]
- id: konfuzianismus
  name: Konfuzianismus
  aliases: [Rujia, Konfuzius, Kongzi]
  definition: Auf Konfuzius (551–479 v. Chr. nach der Überlieferung) zurückgehende Lehre, die Ordnung durch Bildung, Rituale, moralisches Vorbild und richtige Beziehungen in Familie und Staat anstrebt; seit der Han-Zeit Grundlage der Beamtenausbildung.
  themes: [religion, politik]
- id: mandat-des-himmels
  name: Mandat des Himmels
  aliases: [Tianming, Himmelsmandat]
  definition: Chinesische Vorstellung, dass der Himmel einem gerechten Herrscher das Recht zur Herrschaft verleiht und es einem unfähigen oder tyrannischen Herrscher wieder entziehen kann; Rechtfertigung für Dynastiewechsel.
  themes: [politik, religion]
- id: kommandantur-kreis-system
  name: Kommandantur-Kreis-System
  aliases: [Junxian-System, Kommandanturen]
  definition: Gliederung des chinesischen Reiches in Kommandanturen (jun) und Kreise (xian) unter ernannten, absetzbaren Beamten statt erblicher Lehnsherren; unter Qin reichsweit eingeführt.
  themes: [verfassung-recht, imperien]
- id: mansa
  name: Mansa
  definition: Herrschertitel im Reich Mali („König“, „Herrscher“), etwa Mansa Musa oder Mansa Sulayman.
  themes: [politik]
- id: griot
  name: Griot
  aliases: [Jeli, Djeli, Griots]
  definition: In westafrikanischen Gesellschaften der Mande und benachbarter Völker Angehörige einer erblichen Berufsgruppe, die als Erzähler, Musiker, Genealogen und Berater die Geschichte mündlich bewahren und vortragen.
  themes: [kultur-kunst, gesellschaft, geschichtsschreibung]
- id: transsahara-handel
  name: Transsahara-Handel
  aliases: [Saharahandel, Karawanenhandel]
  definition: Fernhandel mit Kamelkarawanen durch die Sahara zwischen Nord- und Westafrika, vor allem Gold, Salz, Textilien, Bücher und versklavte Menschen; besonders bedeutend vom 8. bis 16. Jh.
  themes: [handelsnetze, wirtschaft-handel]
- id: ablass
  name: Ablass
  aliases: [Ablasshandel, Indulgenz]
  definition: Nach katholischer Lehre der Erlass zeitlicher Sündenstrafen, auch für Verstorbene im Fegefeuer; im Spätmittelalter oft gegen Geldspenden gewährt und Anlass von Luthers Kritik 1517.
  themes: [religion]
- id: konfessionalisierung
  name: Konfessionalisierung
  aliases: [Konfessionelles Zeitalter]
  definition: Von Heinz Schilling und Wolfgang Reinhard geprägtes Forschungskonzept für die Zeit etwa 1550–1650, in der katholische, lutherische und reformierte Obrigkeiten Bekenntnisse festlegten, Untertanen disziplinierten und so den frühmodernen Staat stärkten.
  themes: [religion, politik, geschichtsschreibung]
- id: buchdruck
  name: Buchdruck mit beweglichen Lettern
  aliases: [Buchdruck, Gutenberg, Druckerpresse]
  definition: Um 1450 von Johannes Gutenberg in Mainz entwickeltes Druckverfahren mit wiederverwendbaren Metallbuchstaben; in Ostasien gab es bewegliche Lettern bereits früher (China, Korea).
  themes: [schrift-medien, wissenschaft-technik]
- id: ancien-regime
  name: Ancien Régime
  aliases: [Alte Ordnung]
  definition: Rückblickende Bezeichnung für die vorrevolutionäre Ordnung Frankreichs (und Europas) mit absoluter Monarchie, ständischer Gesellschaft und Privilegien von Adel und Geistlichkeit.
  themes: [politik, gesellschaft]
- id: generalstaende
  name: Generalstände
  aliases: [États généraux]
  definition: Versammlung der Vertreter der drei Stände Frankreichs (Geistlichkeit, Adel, Dritter Stand), vom König einberufen; tagte 1789 erstmals seit 1614.
  themes: [verfassung-recht]
- id: jakobiner
  name: Jakobiner
  aliases: [Jakobinerklub, Club des Jacobins]
  definition: Politischer Klub der Französischen Revolution, benannt nach seinem Versammlungsort im Pariser Kloster der Dominikaner (Jakobiner); 1793/94 Träger der radikalen Revolutionsregierung.
  themes: [politik, revolutionen]
- id: sansculotten
  name: Sansculotten
  aliases: [Sans-culottes]
  definition: Pariser Handwerker, Ladenbesitzer und Arbeiter, die als radikale Volksbewegung die Französische Revolution 1792–1794 mitprägten; benannt nach ihren langen Hosen statt der adligen Kniebundhosen (culottes).
  themes: [revolutionen, gesellschaft]
- id: totaler-krieg
  name: Totaler Krieg
  definition: Kriegführung, die alle Ressourcen einer Gesellschaft – Wirtschaft, Arbeitskraft, Wissenschaft, Propaganda – mobilisiert und die Grenze zwischen Front und Heimat sowie zwischen Kombattanten und Zivilisten verwischt.
  themes: [krieg-militaer]
- id: grabenkrieg
  name: Grabenkrieg
  aliases: [Stellungskrieg, Schützengraben]
  definition: Kriegführung aus befestigten Schützengräben, typisch für die Westfront des Ersten Weltkriegs, wo sich beide Seiten jahrelang auf engem Raum gegenüberlagen.
  themes: [krieg-militaer]
- id: kriegsschuldfrage
  name: Kriegsschuldfrage
  aliases: [Fischer-Kontroverse, Kriegsschuldlüge]
  definition: Die Debatte über die Verantwortung für den Ausbruch des Ersten Weltkriegs, von Artikel 231 des Versailler Vertrags über die Fischer-Kontroverse der 1960er Jahre bis zu den Diskussionen um Christopher Clarks „Schlafwandler“.
  themes: [krieg-militaer, geschichtsschreibung]
- id: antisemitismus
  name: Antisemitismus
  aliases: [Judenfeindschaft, Judenhass, Antijudaismus]
  definition: Feindschaft gegen Jüdinnen und Juden als Gruppe. Der Begriff entstand um 1879 für eine neue, „rassisch“ argumentierende Judenfeindschaft; er wird heute für alle Formen von Judenhass verwendet, auch den älteren religiösen Antijudaismus.
  themes: [gewalt-genozid, religion]
- id: shoah-begriff
  name: Shoah
  aliases: [Schoah, Holocaust]
  definition: Hebräisch „Katastrophe“, „Zerstörung“; Bezeichnung für den Völkermord an den europäischen Jüdinnen und Juden, die viele dem aus dem Griechischen stammenden Wort „Holocaust“ („Brandopfer“) vorziehen.
  themes: [gewalt-genozid]
- id: einsatzgruppen
  name: Einsatzgruppen
  aliases: [Einsatzgruppen der Sicherheitspolizei und des SD]
  definition: Mobile Mordeinheiten der Sicherheitspolizei und des SD, die hinter der Front in Polen und vor allem in der Sowjetunion Massenerschießungen von Jüdinnen und Juden, Roma, Kommunisten und anderen durchführten.
  themes: [gewalt-genozid]
- id: vernichtungslager
  name: Vernichtungslager
  aliases: [Todeslager]
  definition: Lager, deren Hauptzweck die sofortige Ermordung der Deportierten war – Chełmno, Bełżec, Sobibór, Treblinka sowie die Vernichtungsbereiche von Auschwitz-Birkenau und Majdanek; zu unterscheiden von Konzentrations- und Arbeitslagern.
  themes: [gewalt-genozid]
- id: gerechte-unter-den-voelkern
  name: Gerechte unter den Völkern
  aliases: [Righteous Among the Nations, Chassidei Umot HaOlam]
  definition: Ehrentitel, den die Gedenkstätte Yad Vashem nichtjüdischen Menschen verleiht, die unter Lebensgefahr Jüdinnen und Juden vor dem Holocaust retteten.
  themes: [gewalt-genozid, gesellschaft]
- id: ghetto
  name: Ghetto
  aliases: [Ghettos]
  definition: Ursprünglich Bezeichnung für das jüdische Viertel Venedigs (1516); im Zweiten Weltkrieg von den deutschen Besatzern abgeriegelte Stadtviertel, in die Jüdinnen und Juden gezwungen wurden, als Vorstufe der Deportation und Ermordung.
  themes: [gewalt-genozid, gesellschaft]
- id: friedliche-revolution
  name: Friedliche Revolution
  aliases: [Wende, Herbst 1989]
  definition: Bezeichnung für den gewaltfreien Sturz der SED-Herrschaft in der DDR im Herbst 1989 durch Massenproteste und Fluchtbewegung; viele Beteiligte ziehen sie dem von Egon Krenz geprägten Begriff „Wende“ vor.
  themes: [revolutionen]
- id: treuhandanstalt
  name: Treuhandanstalt
  aliases: [Treuhand]
  definition: 1990 gegründete Anstalt, die bis 1994 die volkseigenen Betriebe der DDR privatisierte, sanierte oder stilllegte; bis heute ein Symbol der umstrittenen Transformation Ostdeutschlands.
  themes: [wirtschaft-handel]
- id: staatssicherheit
  name: Ministerium für Staatssicherheit
  aliases: [Stasi, MfS]
  definition: Geheimpolizei und Nachrichtendienst der DDR („Schild und Schwert der Partei“), der die Bevölkerung mit einem dichten Netz hauptamtlicher und inoffizieller Mitarbeiter überwachte.
  themes: [politik]
- id: sed
  name: SED
  aliases: [Sozialistische Einheitspartei Deutschlands]
  definition: 1946 durch die Zwangsvereinigung von KPD und SPD in der sowjetischen Zone gegründete Staatspartei der DDR, die ihren Führungsanspruch in der Verfassung verankerte.
  themes: [politik]
