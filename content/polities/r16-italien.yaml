  summary: Von einem Vizekönig verwaltetes habsburgisches Königreich in Norditalien mit Mailand und Venedig als Zentren; Kern der österreichischen Vorherrschaft in Italien und Schauplatz der Kriege von 1848, 1859 und 1866.
