# Staaten: Die Einigung Italiens (Risorgimento)
- id: koenigreich-beider-sizilien
  name: Königreich beider Sizilien
  aliases: [Regno delle Due Sicilie, Königreich Neapel-Sizilien]
  start: "1816-12-08"
  end: "1861-02-13"
  spanNote: 1816 aus der Vereinigung der Königreiche Neapel und Sizilien gebildet; mit der Kapitulation von Gaeta am 13. Februar 1861 endete die bourbonische Herrschaft faktisch, das Gebiet war schon durch die Volksabstimmung vom Oktober 1860 an Sardinien-Piemont angeschlossen worden.
  capital: neapel
  summary: Größter Staat der italienischen Halbinsel vor der Einigung, von einer Linie der spanischen Bourbonen regiert; Aufstände in Neapel und Sizilien 1820, 1848 und 1860 erschütterten ihn, bis Garibaldis Zug der Tausend ihn 1860 zum Einsturz brachte.
  regions: [italien, mittelmeer]
  themes: [politik]
  successors: [koenigreich-italien]
  weight: 2
