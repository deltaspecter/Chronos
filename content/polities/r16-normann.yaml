  spanNote: Moderne Bezeichnung für die Verbindung des Königreichs England mit dem Herzogtum Normandie unter Wilhelm dem Eroberer und seinen Söhnen; 1087–1096 und 1100–1106 hatten beide Länder verschiedene Herrscher. 1154 ging die Herrschaft an Heinrich II. aus dem Haus Anjou über.
