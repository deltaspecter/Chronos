- id: kurfuerstentum-hannover
  name: Kurfürstentum Hannover
  aliases: [Kurhannover, Braunschweig-Lüneburg]
  start: "1692"
  end: "1806"
  spanNote: 1692 erhielt das Haus Braunschweig-Lüneburg die Kurwürde; ab 1714 in Personalunion mit Großbritannien verbunden. 1803 und 1806 von Frankreich bzw. Preußen besetzt, 1814 als Königreich wiederhergestellt.
  summary: Norddeutsches Kurfürstentum, dessen Herrscher ab 1714 zugleich Könige von Großbritannien waren; seine Verwundbarkeit zog Großbritannien in die Kriege auf dem Kontinent hinein.
  regions: [deutschland]
  themes: [politik]
  weight: 3
