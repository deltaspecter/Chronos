- id: nawabat-bengalen
  name: Nawabat Bengalen
  aliases: [Nawabs von Bengalen, Bengalen]
  start: "1717"
  end: "1765"
  spanNote: Die Nawabs regierten formal als Statthalter des Großmoguls, faktisch seit Murshid Quli Khan (ab 1717) weitgehend selbstständig. 1765 übertrug der Großmogul der Ostindien-Kompanie die Steuerhoheit (Diwani); die Nawabs blieben danach nur noch Titularherrscher.
  summary: Faktisch unabhängiges Fürstentum der Mogul-Statthalter in Bengalen, Bihar und Orissa mit Sitz in Murshidabad, eine der reichsten Regionen der Welt; nach Plassey 1757 geriet es unter die Kontrolle der britischen Ostindien-Kompanie.
