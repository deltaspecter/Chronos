- id: mogulreich
  name: Mogulreich
  aliases: [Moguln, Mughal-Reich, Großmogul]
  start: "1526"
  end: "1857"
  spanNote: 1540–1555 von der Herrschaft Sher Shah Suris unterbrochen; ab dem frühen 18. Jahrhundert faktisch zerfallen, der letzte Mogul wurde 1858 von den Briten abgesetzt.
  capital: agra
  summary: Von Babur begründetes Reich, das auf seinem Höhepunkt um 1700 fast den ganzen indischen Subkontinent beherrschte und zu den bevölkerungsreichsten und wohlhabendsten Staaten der Welt gehörte.
  regions: [suedasien]
  themes: [imperien]
  successors: [britisch-indien]
