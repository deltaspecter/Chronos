  end: "1943"
  spanNote: Italien eroberte die osmanischen Provinzen ab 1911; im Frieden von Ouchy 1912 trat das Osmanische Reich sie ab. Das Hinterland wurde erst bis 1932 unterworfen; 1934 wurden Tripolitanien und die Kyrenaika zur Kolonie Libyen vereinigt. Anfang 1943 vertrieben britische und französische Truppen die Achsenmächte.
