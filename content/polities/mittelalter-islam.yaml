  end: "1258"
  spanNote: Die politische Macht der Kalifen schwand ab dem späten 9. Jahrhundert; ab 945 standen sie unter der Kontrolle anderer Dynastien. In Kairo bestand unter den Mamluken bis 1517 ein Schattenkalifat.
