- id: kasachische-ssr
  name: Kasachische Sozialistische Sowjetrepublik
  aliases: [Kasachische SSR, Kasachische ASSR, Sowjetkasachstan]
  start: "1920"
  end: "1991-12-16"
  spanNote: 1920–1936 autonome Republik innerhalb der Russischen Sowjetrepublik (bis 1925 als Kirgisische ASSR bezeichnet), ab 1936 Unionsrepublik; Hauptstadt ab 1929 Alma-Ata.
  capital: alma-ata
  summary: Sowjetrepublik in Zentralasien, in der die erzwungene Sesshaftmachung der kasachischen Nomaden und die Kollektivierung 1930–1933 eine Hungersnot auslösten, die einen großen Teil der Kasachen das Leben kostete; später Ziel zahlreicher Deportationen.
