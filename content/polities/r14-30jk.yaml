- id: kurpfalz
  name: Kurpfalz
  aliases: [Pfalz, Kurfürstentum Pfalz, Pfalzgrafschaft bei Rhein]
  start: "1356"
  end: "1803"
  spanNote: Die Pfalzgrafen bei Rhein besaßen die Kurwürde schon zuvor; die Goldene Bulle von 1356 schrieb sie fest. 1623 ging die Kur an Bayern, 1648 wurde für die Pfalz eine achte Kur geschaffen.
  capital: heidelberg
  summary: Calvinistisch geprägtes Kurfürstentum am Rhein mit der Residenz Heidelberg, dessen Kurfürst Friedrich V. 1619 die böhmische Krone annahm; das Land wurde im Krieg schwer verwüstet.
  regions: [deutschland]
  themes: [politik, religion]
  weight: 3
- id: kurfuerstentum-sachsen
  name: Kurfürstentum Sachsen
  aliases: [Kursachsen]
