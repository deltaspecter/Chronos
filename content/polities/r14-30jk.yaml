  summary: Kurfürstentum und Königreich mit überwiegend protestantischen Ständen, deren Aufstand 1618 den Krieg auslöste; nach 1620 rekatholisiert und durch die Verneuerte Landesordnung von 1627 enger an die Habsburger gebunden.
