  start: "1581"
  end: "1795"
  spanNote: 1581 sagten sich die aufständischen Provinzen von Philipp II. los; Spanien erkannte ihre Unabhängigkeit erst im Frieden von Münster 1648 an.
  summary: Aus dem Aufstand gegen Spanien hervorgegangener Bund nördlicher niederländischer Provinzen, im 17. Jahrhundert führende Handels- und Seemacht mit Kolonien und Stützpunkten in Asien, Afrika und Amerika.
  regions: [westeuropa]
  themes: [politik, wirtschaft-handel, handelsnetze]
