# Staaten: Der Dreißigjährige Krieg und der Westfälische Frieden
- id: koenigreich-schweden
  name: Königreich Schweden
  aliases: [Schweden, Schwedisches Großmachtreich, Stormaktstiden]
  start: "1523"
  spanNote: 1523 wurde Gustav Wasa zum König gewählt und die Kalmarer Union mit Dänemark endgültig verlassen; als Großmachtzeit gilt meist die Spanne von 1611 bis 1721.
  capital: stockholm
  summary: Lutherische Monarchie im Norden Europas, die unter Gustav II. Adolf und seinen Nachfolgern zur Vormacht im Ostseeraum aufstieg und 1648 Vorpommern, Wismar sowie die Stifte Bremen und Verden als Reichslehen erhielt.
  regions: [nordeuropa]
  themes: [politik, krieg-militaer, imperien]
  weight: 2
- id: daenemark-norwegen
  name: Dänemark-Norwegen
  aliases: [Dänemark, Königreich Dänemark]
  start: "1524"
  end: "1814"
  spanNote: Personal- und später Realunion der Königreiche Dänemark und Norwegen unter dem Haus Oldenburg; das Anfangsdatum wird unterschiedlich angesetzt (1380, 1524 oder 1536).
  capital: kopenhagen
  summary: Lutherische Doppelmonarchie, die über den Öresundzoll an der Ostsee verdiente und als Herzog von Holstein im Reich vertreten war; ihr Eingreifen 1625–1629 scheiterte.
  regions: [nordeuropa]
  themes: [politik, handelsnetze]
  weight: 3
- id: republik-der-vereinigten-niederlande
