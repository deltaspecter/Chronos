  end: "1806"
  spanNote: Seit 1547 im Besitz der albertinischen Linie der Wettiner.
  capital: dresden
  summary: Lutherisches Kurfürstentum an der Elbe, unter Johann Georg I. lange Stütze des Kaisers, 1631–1635 mit Schweden verbündet und Partner des Prager Friedens; erhielt 1635 die Lausitzen.
  regions: [deutschland]
  themes: [politik]
  weight: 3
- id: koenigreich-boehmen
