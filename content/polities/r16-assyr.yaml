- id: meder
  name: Meder
  aliases: [Medien, Medisches Reich, Mada]
  start: "~-700?"
  end: "-550"
  spanNote: Ob die Meder vor Kyros II. einen zentral regierten Staat oder einen lockeren Verband von Fürstentümern bildeten, ist umstritten.
  capital: ekbatana
  summary: Iranischsprachige Bevölkerung im Zagros-Gebirge um Ekbatana (Hamadan), die in assyrischen Texten oft als Ziel von Feldzügen und Tributlieferant erscheint; unter Kyaxares beteiligten sich die Meder entscheidend an der Zerstörung Assyriens. Um 550 v. Chr. übernahm Kyros II. ihre Herrschaft.
  regions: [iran]
  themes: [politik, krieg-militaer]
  successors: [achaemenidenreich]
  weight: 3
