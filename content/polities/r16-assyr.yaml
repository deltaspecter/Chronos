# Staaten: Das Neuassyrische Reich
- id: neuassyrisches-reich
  name: Neuassyrisches Reich
  aliases: [Assyrien, Assyrisches Reich, Neo-Assyrian Empire, Land Assur]
  start: "-911"
  end: "-609"
  spanNote: Beginn konventionell mit dem Regierungsantritt Adad-nirari II. 911 v. Chr.; Ende mit dem gescheiterten Versuch, Harran 609 v. Chr. zurückzuerobern. Hauptstädte nacheinander Assur, Kalchu, Dur-Scharrukin und Ninive.
  capital: ninive
  summary: Von der Stadt Assur am Tigris ausgehender Staat, der im 9. bis 7. Jahrhundert v. Chr. Mesopotamien, die Levante, Teile Anatoliens und Irans und zeitweise Ägypten beherrschte; er gilt vielen Forschern als erstes Weltreich. 614–609 v. Chr. von Babyloniern und Medern zerstört.
  regions: [mesopotamien, westasien, levante, anatolien, iran]
  themes: [imperien, krieg-militaer, politik]
  successors: [neubabylonisches-reich]
  weight: 1
- id: neubabylonisches-reich
  name: Neubabylonisches Reich
  aliases: [Chaldäisches Reich, Neo-Babylonian Empire]
  start: "-626"
  end: "-539"
  capital: babylon
  summary: Von Nabopolassar begründetes Reich mit der Hauptstadt Babylon, das nach dem Sieg über Assyrien dessen westliche Gebiete übernahm; unter Nebukadnezar II. eroberte es 587/586 v. Chr. Jerusalem. 539 v. Chr. von Kyros II. eingenommen.
  regions: [mesopotamien, levante]
  themes: [imperien, politik]
