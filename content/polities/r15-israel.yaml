# Staaten: Die Gründung Israels und der Nahostkonflikt bis 1967
- id: britisches-mandat-palaestina
  name: Britisches Mandatsgebiet Palästina
  aliases: [Mandatspalästina, Palestine Mandate, Mandat Palästina]
  start: "1920-07-01"
  end: "1948-05-14"
  spanNote: Britische Militärverwaltung ab 1917/18; Zivilverwaltung ab Juli 1920 nach der Konferenz von San Remo; Bestätigung des Mandats durch den Völkerbund 1922, in Kraft ab September 1923. Das Mandat endete um Mitternacht vom 14. auf den 15. Mai 1948.
  capital: jerusalem
  summary: Vom Völkerbund an Großbritannien übertragenes Verwaltungsgebiet zwischen Mittelmeer und Jordan, in dem die Mandatsmacht sowohl die „nationale Heimstätte“ für das jüdische Volk fördern als auch die Rechte der arabischen Mehrheit wahren sollte; der wachsende Konflikt beider Nationalbewegungen machte das Mandat schließlich unregierbar.
  regions: [levante]
  themes: [imperien, politik]
  predecessors: [osmanisches-reich]
  successors: [staat-israel, jordanien, koenigreich-aegypten]
  weight: 2
- id: staat-israel
  name: Israel
  aliases: [Staat Israel, Medinat Jisra'el]
  start: "1948-05-14"
  summary: Am 14. Mai 1948 in Tel Aviv ausgerufener jüdischer Staat, der im Krieg 1948/49 rund drei Viertel des früheren Mandatsgebiets unter seine Kontrolle brachte und Hunderttausende Holocaust-Überlebende und Juden aus arabischen Ländern aufnahm.
  regions: [levante]
  themes: [politik, migration]
  predecessors: [britisches-mandat-palaestina]
  weight: 1
- id: jordanien
  name: Jordanien
  aliases: [Transjordanien, Emirat Transjordanien, Haschemitisches Königreich Jordanien]
  start: "1921"
  spanNote: 1921–1946 Emirat Transjordanien unter britischem Mandat, 1946 unabhängiges Königreich, seit 1949 offiziell Jordanien.
  capital: amman
  summary: Von Großbritannien 1921 für den Haschemiten Abdallah geschaffenes Emirat östlich des Jordan, 1946 unabhängig; seine britisch geführte Arabische Legion war 1948 die schlagkräftigste arabische Armee. 1950 annektierte Jordanien das Westjordanland mit Ost-Jerusalem, das es 1967 an Israel verlor.
  regions: [levante]
  themes: [politik]
  weight: 2
