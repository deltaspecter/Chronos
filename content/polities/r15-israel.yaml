  name: Königreich Ägypten
  aliases: [Ägypten (Monarchie)]
  start: "1922-02-28"
  end: "1953-06-18"
  spanNote: Formal unabhängig seit 1922, doch blieben britische Truppen bis 1956 am Suezkanal. Nach dem Putsch der Freien Offiziere 1952 wurde 1953 die Republik ausgerufen.
  capital: kairo
  summary: Monarchie unter der Dynastie Muhammad Alis, die 1948 in den Krieg in Palästina eingriff und danach den Gazastreifen verwaltete; die Niederlage trug zum Sturz König Faruks 1952 bei.
