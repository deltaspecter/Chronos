# Staaten: Ming-Dynastie (r15-ming)
- id: noerdliche-yuan
  name: Nördliche Yuan
  aliases: [Nördliche Yuan-Dynastie, Mongolen nach 1368]
  start: "1368"
  end: "1635"
  spanNote: Bezeichnung für die mongolischen Herrscher in der Steppe nach der Vertreibung der Yuan aus China; die Einheit zerfiel rasch in rivalisierende Verbände. 1635 unterwarf sich der letzte Großkhan den Mandschu.
  summary: Die nach 1368 in die Mongolei zurückgezogene Yuan-Herrscherlinie und die mongolischen Verbände der Steppe, die für die Ming die wichtigste militärische Bedrohung an der Nordgrenze blieben.
