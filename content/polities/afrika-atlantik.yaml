  weight: 3
- id: simbabwe-staat
  name: Staat von Groß-Simbabwe
  aliases: [Zimbabwe-Staat, Königreich Simbabwe]
  start: "~1250"
  end: "~1450"
  spanNote: Daten nach archäologischen Befunden; Beginn und Ende sind nur ungefähr bestimmbar.
  capital: gross-simbabwe
  summary: Staat der Vorfahren der heutigen Shona mit Zentrum in Groß-Simbabwe, der Viehzucht, Landwirtschaft und den Goldhandel mit der Swahili-Küste kontrollierte.
