  start: "~1430"
  end: "~1760"
  summary: Nachfolgestaat Groß-Simbabwes im Norden des heutigen Simbabwe, der im 16. und 17. Jahrhundert mit portugiesischen Händlern und Eroberern rang.
  regions: [suedliches-afrika]
  themes: [imperien]
  predecessors: [simbabwe-staat]
  weight: 3
- id: sultanat-kilwa
  name: Sultanat Kilwa
  aliases: [Kilwa]
  start: "~1000?"
  end: "1505"
  spanNote: Die Chronik von Kilwa setzt die Gründung ins 10. Jahrhundert; archäologisch ist eine bedeutende Stadt ab dem 11./12. Jahrhundert belegt. 1505 eroberten die Portugiesen die Stadt.
  capital: kilwa-kisiwani
  summary: Mächtigster Stadtstaat der Swahili-Küste im 13. und 14. Jahrhundert, reich durch die Kontrolle des Goldhandels aus Sofala.
  regions: [ostafrika]
  themes: [handelsnetze]
  weight: 2
