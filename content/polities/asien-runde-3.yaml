- id: khmer-reich
  name: Khmer-Reich (Angkor)
  aliases: [Angkor-Reich, Kambuja, Khmer-Imperium]
  start: "802"
  end: "~1431"
  spanNote: 802 gilt nach einer späteren Inschrift als Gründungsjahr; das traditionelle Enddatum 1431 (Eroberung Angkors durch Ayutthaya) ist umstritten – der Bedeutungsverlust Angkors war ein längerer Prozess.
  capital: angkor-thom
  summary: Königreich der Khmer mit Zentrum in Angkor, das auf seinem Höhepunkt im 12. und frühen 13. Jahrhundert große Teile des heutigen Kambodscha, Thailands, Laos und Südvietnams beherrschte.
  regions: [suedostasien]
  themes: [imperien, religion]
  weight: 1
