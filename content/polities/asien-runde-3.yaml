  aliases: [Cham-Reiche]
  start: "~200"
  end: "1832"
  summary: Reiche der Cham an der Küste des heutigen Mittel- und Südvietnam, Rivalen der Khmer; 1177 plünderten sie Angkor.
  regions: [suedostasien]
  themes: [imperien]
  weight: 3
