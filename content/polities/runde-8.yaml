# Staaten: Jugoslawien und Nachfolgestaaten
- id: jugoslawien
  name: Sozialistisches Jugoslawien
  aliases: [SFRJ, Sozialistische Föderative Republik Jugoslawien, Jugoslawien, FVRJ]
  start: "1945-11-29"
  end: "1992-04-27"
  spanNote: 1945 als Föderative Volksrepublik ausgerufen, ab 1963 Sozialistische Föderative Republik; zerfiel 1991/92. Vorausgegangen war das Königreich Jugoslawien (1918–1941).
