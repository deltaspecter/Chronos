  summary: Bundesstaat aus sechs Republiken – Slowenien, Kroatien, Bosnien und Herzegowina, Serbien, Montenegro und Makedonien – mit zwei autonomen Provinzen, unter Tito blockfrei und mit eigenem Modell der Arbeiterselbstverwaltung.
  regions: [suedosteuropa]
  themes: [politik]
  successors: [bundesrepublik-jugoslawien, kroatien, slowenien, bosnien-herzegowina]
