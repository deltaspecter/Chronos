# Staaten: Spätantike
- id: vandalenreich
  name: Reich der Vandalen
  aliases: [Vandalen, Vandalenreich]
  start: "429"
  end: "534"
  spanNote: 429 setzten die Vandalen nach Nordafrika über, 439 eroberten sie Karthago; 534 unterwarf Belisar das Reich.
  capital: karthago
  summary: Von den Vandalen und Alanen unter König Geiserich in Nordafrika errichtetes Königreich, das das westliche Mittelmeer beherrschte und 455 Rom plünderte.
  regions: [nordafrika, mittelmeer]
  themes: [imperien]
  successors: [byzantinisches-reich]
  weight: 3
- id: ostgotenreich
  name: Reich der Ostgoten
  aliases: [Ostgoten, Ostgotenreich]
  start: "493"
  end: "553"
  spanNote: 493 nahm Theoderich der Große Ravenna ein; der Gotenkrieg (535–552/553) beendete die gotische Herrschaft in Italien.
  capital: ravenna
  summary: Königreich der Ostgoten in Italien, das unter Theoderich die römische Verwaltung und den Senat weiterbestehen ließ und von Justinians Heeren erobert wurde.
  regions: [italien]
  themes: [imperien]
  successors: [byzantinisches-reich, langobardenreich]
  weight: 3
- id: sasanidenreich
  name: Reich der Sasaniden
  aliases: [Sasaniden, Neupersisches Reich]
  start: "224"
  end: "651"
  summary: Persisches Großreich mit der Hauptstadt Ktesiphon am Tigris, über vier Jahrhunderte der große Rivale Roms und Ostroms; den arabisch-islamischen Eroberungen erlegen.
  regions: [iran, mesopotamien, zentralasien]
  themes: [imperien, religion]
  predecessors: [partherreich]
  successors: [umayyaden-kalifat]
  weight: 2
# Staaten: Aufklärung
