  aliases: [BRJ, Serbien und Montenegro, Rest-Jugoslawien]
  start: "1992-04-27"
  end: "2006-06-03"
  spanNote: Ab 2003 Staatenbund Serbien und Montenegro, 2006 durch die Unabhängigkeit Montenegros aufgelöst.
  capital: belgrad
  summary: Aus Serbien und Montenegro gebildeter Staat, der sich als Fortsetzung Jugoslawiens verstand.
  regions: [suedosteuropa]
  themes: [politik]
  predecessors: [jugoslawien]
  weight: 3
- id: slowenien
