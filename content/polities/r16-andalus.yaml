- id: koenigreich-leon
  name: Königreich León
  aliases: [León]
  start: "910"
  end: "1230"
  capital: leon
  spanNote: Mehrfach mit Kastilien vereinigt und wieder getrennt, 1230 unter Ferdinand III. endgültig mit Kastilien verbunden.
  summary: Nachfolgereich Asturiens mit der Hauptstadt León, dessen Könige zeitweise den Titel eines Kaisers (imperator) Hispaniens führten; aus seiner Ostgrenze ging die Grafschaft und spätere Königreich Kastilien hervor.
  regions: [iberische-halbinsel]
  themes: [politik]
  predecessors: [koenigreich-asturien]
  successors: [krone-kastilien]
  weight: 3
- id: krone-aragon
  name: Krone Aragón
  aliases: [Aragón, Aragon, Corona de Aragón]
  start: "1137"
  end: "1716"
  spanNote: 1137 wurden das Königreich Aragón und die Grafschaft Barcelona durch Heirat verbunden; seit 1479 regierte Ferdinand II. die Krone gemeinsam mit Kastilien; die Sonderrechte endeten mit den Nueva-Planta-Dekreten 1707–1716.
  summary: Verbund des Königreichs Aragón, der Grafschaft Barcelona (Katalonien) und der eroberten Königreiche Mallorca und Valencia, später auch Siziliens, Sardiniens und Neapels; eine im Mittelmeer ausgerichtete Handels- und Seemacht.
  regions: [iberische-halbinsel, mittelmeer]
  themes: [politik, wirtschaft-handel]
  weight: 2
