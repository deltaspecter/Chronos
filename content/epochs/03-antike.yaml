- id: persische-reiche
  title: Persische Reiche
  parent: antike-welten
  order: 3
  start: "~-550"
  end: "651"
  regions: [iran, westasien]
  summary: Achämeniden, Parther und Sasaniden beherrschten über ein Jahrtausend lang den Raum zwischen Mesopotamien und Zentralasien.
  body: |
    Iranische Großreiche waren keine bloßen „Gegenspieler“ der Griechen und Römer, wie es die klassische europäische Überlieferung nahelegt, sondern eigenständige politische Ordnungen mit großer Ausstrahlung. Die Forschung bemüht sich seit den 1980er Jahren verstärkt darum, sie aus ihren eigenen Quellen – Inschriften, Verwaltungstexten, archäologischen Befunden – zu verstehen.
  planned:
    - Das Partherreich
    - Das Sasanidenreich
    - Zoroastrismus

- id: antikes-indien
  title: Südasien in der Antike
  parent: antike-welten
  order: 4
  start: "~-600"
  end: "~550"
  regions: [suedasien]
  summary: Von den frühen Königreichen der Gangesebene über das Maurya-Reich bis zur Gupta-Zeit – die Epoche, in der Buddhismus und Jainismus entstanden.
  body: |
    Im 6. und 5. Jahrhundert v. Chr. entstanden in der Gangesebene Städte und Königreiche (Mahajanapadas); in diesem Umfeld lebten der Buddha und Mahavira. Das [[maurya-reich]] vereinte erstmals große Teile des Subkontinents. Die Chronologie der frühen indischen Geschichte ist unsicherer als die des Mittelmeerraums, weil Herrscherlisten und Texte oft erst später schriftlich fixiert wurden.
  planned:
    - Der Buddha und die Entstehung des Buddhismus
    - Das Gupta-Reich
    - Das Kushana-Reich

- id: china-qin-han
  title: China von der Zhou- bis zur Han-Zeit
  parent: antike-welten
  order: 5
  start: "~-1046"
  end: "220"
  spanNote: Das traditionelle Anfangsdatum der Zhou-Dynastie (1046 v. Chr.) beruht auf dem chinesischen Xia-Shang-Zhou-Chronologieprojekt und ist nicht unumstritten.
  regions: [china]
  summary: Von der Zhou-Zeit mit Konfuzius und den „Hundert Schulen“ über die Zeit der Streitenden Reiche zur Reichseinigung durch Qin und zum Han-Reich.
  body: |
    Die Periodisierung der chinesischen Geschichte folgt traditionell den Dynastien. Die Zeit der Streitenden Reiche (ca. 475–221 v. Chr.) war eine Epoche intensiver Staatsbildung und philosophischer Debatten. Die Reichseinigung von 221 v. Chr. begründete eine politische Ordnung, an die alle späteren Dynastien anknüpften. Siehe [[qin-und-han]].
  planned:
    - Konfuzius und der Konfuzianismus
    - Die Zeit der Streitenden Reiche
    - Die Seidenstraßen in der Han-Zeit

- id: afrika-antike
  title: Afrikanische Reiche der Antike
  parent: antike-welten
  order: 6
  start: "~-800"
  end: "~700"
  regions: [nordostafrika, nordafrika]
  summary: Kusch mit Napata und Meroe, Karthago in Nordafrika und das christliche Aksum am Horn von Afrika.
  body: |
    Afrika war in der Antike kein Randgebiet. Das Reich von Kusch beherrschte zeitweise Ägypten, Karthago war die große Handelsmacht des westlichen Mittelmeers, und Aksum im heutigen Äthiopien und Eritrea prägte eigene Münzen und war ein Knotenpunkt des Handels zwischen Mittelmeer und Indischem Ozean.
  planned:
    - Karthago
    - Aksum
