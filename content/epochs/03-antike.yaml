- id: antike-welten
  title: Antike Welten
  order: 3
  start: "~-800"
  end: "~600"
  spanNote: „Antike“ ist ursprünglich ein Begriff der europäischen Geschichtsschreibung für die griechisch-römische Welt. CHRONOS verwendet ihn hier nur als Sammelbezeichnung für die Großreiche und Stadtkulturen Eurasiens und Afrikas in diesem Zeitraum; regionale Periodisierungen (etwa die Zhou-, Qin- und Han-Zeit in China) werden in den Unterbereichen verwendet.
  regions: [mittelmeer, westasien, suedasien, ostasien, afrika]
  summary: Zwischen dem 8. Jahrhundert v. Chr. und dem 6. Jahrhundert n. Chr. entstanden vom Mittelmeer bis China Großreiche, Philosophien und Religionen, die bis heute nachwirken.
  body: |
    Der Philosoph Karl Jaspers prägte 1949 den Begriff der „Achsenzeit“ für die Jahrhunderte um 500 v. Chr., in denen in China, Indien, Iran, Israel und Griechenland einflussreiche Denk- und Religionstraditionen entstanden. Der Begriff ist umstritten, weil er sehr unterschiedliche Entwicklungen zusammenfasst; er macht aber auf Parallelen aufmerksam, die eine rein europäische Erzählung übersieht.

    Politisch prägten diese Epoche Großreiche von bis dahin unbekannter Ausdehnung: das Perserreich der Achämeniden, das Alexanderreich und seine Nachfolgestaaten, das Maurya-Reich in Indien, das von Qin und Han geeinte China und das Römische Reich. Zwischen ihnen verbanden Land- und Seewege, später zusammenfassend „Seidenstraße“ genannt, die Wirtschaftsräume Eurasiens und Ostafrikas.
  planned:
    - Die Achsenzeit – ein umstrittenes Konzept
    - Die Seidenstraßen
    - Das Reich von Aksum
    - Das antike Israel und Juda
    - Die Phönizier
    - Die Etrusker

- id: antikes-griechenland
  title: Antikes Griechenland
  parent: antike-welten
  order: 1
  start: "~-800"
  end: "-30"
  regions: [griechenland, mittelmeer]
  summary: Die Welt der griechischen Poleis, der athenischen Demokratie, der Philosophie und – nach Alexander dem Großen – der hellenistischen Königreiche.
  body: |
    Die griechische Geschichte im engeren Sinne wird meist in archaische (ca. 800–500 v. Chr.), klassische (500–336 v. Chr.) und hellenistische Zeit (336–30 v. Chr.) unterteilt. Griechische Siedlungen reichten vom Schwarzen Meer bis nach Südfrankreich; nach den Eroberungen Alexanders entstanden griechisch geprägte Königreiche bis nach Zentralasien.
  planned:
    - Die Polis
    - Die Perserkriege
    - Der Peloponnesische Krieg
    - Die Archaische Zeit und die griechische Kolonisation
    - Sparta
    - Die griechische Philosophie – Sokrates, Platon, Aristoteles
    - Theater und Feste in Athen

- id: roemische-geschichte
  title: Römische Geschichte
  parent: antike-welten
  order: 2
  start: "-753"
  end: "1453"
  spanNote: Das Gründungsdatum 753 v. Chr. ist eine antike Berechnung (nach Varro), kein historisch gesichertes Datum. Das Ende hängt von der Perspektive ab – 476 n. Chr. für den Westen, 1453 für das Oströmische (Byzantinische) Reich.
  regions: [italien, mittelmeer]
  summary: Vom Stadtstaat am Tiber zum Weltreich – Königszeit, Republik, Kaiserzeit und Spätantike.
  body: |
    Die römische Geschichte ist eine der am besten dokumentierten der Antike: Geschichtswerke, Reden, Briefe, zehntausende Inschriften, Münzen und archäologische Befunde erlauben eine dichte Rekonstruktion. Zugleich stammen fast alle literarischen Quellen aus der Feder einer schmalen Oberschicht. Die Lebenswelten von Frauen, Sklaven, Provinzbewohnern und der Landbevölkerung müssen oft indirekt erschlossen werden.

    Die Artikelreihe [[roemische-republik]] führt von den Institutionen der Republik über die [[punische-kriege|Punischen Kriege]] und die [[krise-der-roemischen-republik|Krise der Republik]] zu [[julius-caesar|Caesar]] und [[augustus|Augustus]].
  planned: []

