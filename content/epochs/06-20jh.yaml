- id: zeitalter-weltkriege
  title: Zeitalter der Weltkriege
  order: 8
  start: "1914"
  end: "1945"
  regions: [welt]
  summary: Zwei Weltkriege, die Russische Revolution, die Weltwirtschaftskrise, faschistische und kommunistische Diktaturen und der Holocaust.
  body: |
    Zwischen 1914 und 1945 wurden die Gesellschaften Europas und großer Teile der Welt durch Krieg, Revolution und Massengewalt erschüttert. Manche Historiker fassen die Jahre 1914 bis 1945 in Anlehnung an den Krieg von 1618 bis 1648 als „zweiten Dreißigjährigen Krieg“ zusammen; diese Deutung ist umstritten, weil sie die Unterschiede zwischen beiden Weltkriegen und die eigenständigen Ursachen der Zwischenkriegskrisen verwischen kann.
  planned:
    - Die Weimarer Republik
    - Die Weltwirtschaftskrise
    - Der Faschismus in Italien
    - Der Stalinismus

