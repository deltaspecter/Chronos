- id: deutschland-1945-1990
  title: Deutschland 1945–1990
  parent: nachkriegszeit
  order: 3
  start: "1945"
  end: "1990-10-03"
  regions: [deutschland]
  summary: Besatzungszeit, die Gründung von Bundesrepublik und DDR, die Geschichte zweier deutscher Staaten und die Wiedervereinigung.
  body: |
    1949 entstanden auf dem Gebiet der drei westlichen Besatzungszonen die Bundesrepublik Deutschland und auf dem Gebiet der sowjetischen Besatzungszone die Deutsche Demokratische Republik. Beide Staaten entwickelten sich in entgegengesetzten politischen und wirtschaftlichen Systemen, blieben aber durch Familien, Geschichte und die offene „deutsche Frage“ aufeinander bezogen. Siehe [[deutsche-wiedervereinigung]].
  planned:
    - Die Gründung der Bundesrepublik und das Grundgesetz
    - Die Gründung der DDR
    - Der Volksaufstand vom 17. Juni 1953
    - Der Bau der Berliner Mauer 1961
    - Die Neue Ostpolitik
    - Die Staatssicherheit (Stasi)

- id: europaeische-integration
  title: Europäische Integration
  parent: nachkriegszeit
  order: 4
  start: "1950-05-09"
  end: "2026"
  regions: [europa]
  summary: Von der Montanunion über die Europäischen Gemeinschaften zur Europäischen Union.
  body: |
    Am 9. Mai 1950 schlug der französische Außenminister Robert Schuman vor, die Kohle- und Stahlproduktion Frankreichs und Deutschlands einer gemeinsamen Behörde zu unterstellen. Daraus ging 1951 die Europäische Gemeinschaft für Kohle und Stahl hervor, 1957 folgten mit den Römischen Verträgen die Europäische Wirtschaftsgemeinschaft und Euratom. Der Vertrag von Maastricht (1992) begründete die Europäische Union.
  planned:
    - Die Römischen Verträge 1957
    - Der Vertrag von Maastricht
    - Die Osterweiterung 2004

