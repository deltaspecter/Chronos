- id: nachkriegszeit
  title: Kalter Krieg und Dekolonisierung
  order: 9
  start: "1945"
  end: "1991"
  regions: [welt]
  summary: Die Konfrontation zwischen den USA und der Sowjetunion, die Unabhängigkeit von über hundert neuen Staaten, die deutsche Teilung und die europäische Integration.
  body: |
    Aus europäischer Sicht wird die Zeit nach 1945 häufig als „Kalter Krieg“ beschrieben, weil die direkte militärische Konfrontation der Supermächte ausblieb. In weiten Teilen Asiens, Afrikas und Lateinamerikas war sie jedoch eine Zeit heißer Kriege – in Korea, Vietnam, Angola, Afghanistan und vielen anderen Ländern. Zugleich erlangten zwischen 1945 und 1975 die meisten Kolonien ihre Unabhängigkeit.
  planned: []

