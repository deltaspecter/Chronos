- id: kolonialismus-versklavung
  title: Kolonialismus und Versklavung
  parent: fruehe-neuzeit
  order: 3
  start: "1492"
  end: "1888"
  spanNote: 1888 schaffte Brasilien als letzter Staat der Amerikas die Sklaverei ab.
  regions: [atlantik, amerika, afrika]
  summary: Die europäische Eroberung der Amerikas und der transatlantische Sklavenhandel, durch den über zwölf Millionen Menschen aus Afrika verschleppt wurden.
  body: |
    Die Datenbank [[quelle:slavevoyages|SlaveVoyages]] (Trans-Atlantic Slave Trade Database) schätzt auf Grundlage von Schiffsregistern, dass zwischen dem 16. und dem 19. Jahrhundert rund 12,5 Millionen Menschen aus Afrika eingeschifft wurden, von denen etwa 10,7 Millionen die Amerikas lebend erreichten. Hinter diesen Zahlen stehen individuelle Schicksale, die nur selten in eigenen Zeugnissen überliefert sind.
  planned:
    - Abolitionismus

- id: aufklaerung-revolutionen
  title: Aufklärung und Revolutionen
  parent: fruehe-neuzeit
  order: 4
  start: "~1680"
  end: "~1830"
  regions: [europa, amerika, karibik]
  summary: Die Aufklärung, die Amerikanische, die Französische und die Haitianische Revolution sowie die Unabhängigkeitsbewegungen in Lateinamerika.
  body: |
    Im späten 18. Jahrhundert verbanden sich Ideen der Aufklärung – Volkssouveränität, Menschenrechte, Gewaltenteilung – mit sozialen und finanziellen Krisen zu einer Welle von Revolutionen im atlantischen Raum. Die Haitianische Revolution (1791–1804) war die erste erfolgreiche Erhebung versklavter Menschen, die zur Gründung eines unabhängigen Staates führte.
  planned:
    - Friedrich der Große und der aufgeklärte Absolutismus
    - Der Siebenjährige Krieg
    - Die Teilungen Polens

- id: langes-19-jahrhundert
  title: Das lange 19. Jahrhundert
  order: 7
  start: "1789"
  end: "1914"
  spanNote: Den Begriff „langes 19. Jahrhundert“ prägte der Historiker Eric Hobsbawm für die Zeit von der Französischen Revolution bis zum Ersten Weltkrieg.
  regions: [welt]
  summary: Industrialisierung, Nationalstaaten, Massenmigration und die Aufteilung großer Teile der Welt unter europäische Kolonialmächte.
  body: |
    Im 19. Jahrhundert wuchs die Weltbevölkerung, Dampfmaschine, Eisenbahn und Telegraf verdichteten Raum und Zeit, und die wirtschaftliche Kluft zwischen Westeuropa und Nordamerika einerseits und großen Teilen Asiens und Afrikas andererseits vergrößerte sich stark. Die Frage nach den Ursachen dieser „Great Divergence“ gehört zu den großen Debatten der Wirtschaftsgeschichte.
  planned:
    - Der Wiener Kongress 1815
    - Der Krimkrieg
    - Die Abschaffung der Sklaverei in den Amerikas
    - Die Arbeiterbewegung und der Sozialismus
    - Die Frauenbewegung im 19. Jahrhundert
    - Die Massenauswanderung nach Amerika
    - Die Vertreibung der indigenen Völker Nordamerikas
    - Der Taiping-Aufstand

