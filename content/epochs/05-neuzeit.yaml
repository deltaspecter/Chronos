- id: fruehe-neuzeit
  title: Frühe Neuzeit und globale Verflechtung
  order: 6
  start: "~1450"
  end: "~1800"
  regions: [welt]
  summary: Buchdruck, Renaissance und Reformation in Europa; die großen Reiche der Osmanen, Safawiden, Moguln und Qing; europäische Expansion, Kolonialismus und der transatlantische Sklavenhandel.
  body: |
    Ab dem späten 15. Jahrhundert entstanden erstmals Handelsbeziehungen, die alle bewohnten Kontinente miteinander verbanden. Für Europa war dies eine Zeit des Aufbruchs; für die indigenen Bevölkerungen der Amerikas bedeutete sie Eroberung, Epidemien und einen dramatischen Bevölkerungseinbruch, für Millionen Afrikanerinnen und Afrikaner Verschleppung und Versklavung.

    Zugleich ist die Vorstellung eines von Europa dominierten Zeitalters für die Frühe Neuzeit nicht haltbar: Das Osmanische Reich, das Safawidenreich, das Mogulreich und China unter Ming und Qing gehörten zu den bevölkerungsreichsten und wirtschaftlich stärksten Staaten der Welt.
  planned:
    - Der Buchdruck mit beweglichen Lettern
    - Die spanische Eroberung Mexikos und Perus
    - Das Safawidenreich
    - Die Englische Revolution und die Glorious Revolution
    - Die Wissenschaftliche Revolution
    - Die Hexenverfolgungen

