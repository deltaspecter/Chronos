- id: maurya-reich-250
  polity: maurya-reich-staat
  name: Maurya-Reich um 250 v. Chr.
  start: "-250"
  end: "-250"
  certainty: unsicher
  basis: Redaktionelle Vereinfachung nach der Verbreitung der Inschriften Ashokas und gängigen Übersichtskarten (vgl. Thapar 2002, Singh 2008).
  note: Die Ausdehnung beruht vor allem auf den Fundorten der Ashoka-Inschriften. Wie stark die Kontrolle in den Randgebieten und im Dekkan war, ist umstritten; die tamilischen Königreiche im Süden waren unabhängig.
